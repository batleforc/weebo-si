{{- if .Values.monitoring.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ .Values.monitoring.project }}
  source:
    repoURL: '{{ .Values.repo }}'
    path: '2.argo/helm/monitoring'
    targetRevision: '{{ .Values.branch }}'
    helm:
      releaseName: ingress
      valuesObject:
        project: "{{ .Values.monitoring.project }}"
        repo: "{{ .Values.repo }}"
        branch: "{{ .Values.branch }}"
        traefik:
          ips: "{{ .Values.traefik.ips }}"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'monitoring'
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        # Opts the namespace into the clickstack-ingest ClusterExternalSecret.
        weebo.io/otel-ingest: "true"
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end -}}