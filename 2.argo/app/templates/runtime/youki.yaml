# youki: the workspaces' container runtime (durcissement-workspaces, phase 5).
# Handler declared by the Talos youki extension in /etc/cri/conf.d/10-youki.part.
# Lives in the root app rather than in che: a RuntimeClass is node-level and
# cluster-wide, so che, the team-tools namespaces and Kata later all share it.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: youki
handler: youki
