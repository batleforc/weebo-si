{{ if .Values.storage.local.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-storage
  namespace: argocd
  annotations:
    argocd.argoproj.io/manifest-generate-paths: "."
    argocd.argoproj.io/sync-wave: "0"
spec:
  # Not `default`: that project is locked (lockDefaultProject).
  project: {{ .Values.storage.main.project }}
  # The kustomization (upstream deploy/ + our patches) lives in this repo.
  source:
    repoURL: '{{ .Values.repo }}'
    path: '2.argo/helm/local-storage'
    targetRevision: '{{ .Values.branch }}'

  destination:
    name: "in-cluster"
    # The kustomization names its own namespace on every object.
    namespace: 'local-path-storage'
  syncPolicy:
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end -}}
