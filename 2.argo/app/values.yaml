ingress:
  enabled: true
  project: infra

auth:
  enabled: true
  project: infra

vault:
  enabled: true
  project: infra

storage:
  local:
    enabled: true
  main:
    enabled: true
    project: infra

vpn:
  enabled: true
  project: infra

hook:
  enabled: true
  project: infra

monitoring:
  enabled: true
  project: monitoring

database:
  enabled: true
  project: database

repo: ""
branch: ""

traefik:
  ips: ""

project:
  - name: infra
    sourceRepo:
      - oci://ghcr.io/traefik/helm/traefik
      - oci://quay.io/jetstack/charts/cert-manager
      - oci://ghcr.io/bank-vaults/helm-charts/vault-operator
      - oci://quay.io/jetstack/charts/trust-manager
      - https://ghcr.io/external-secrets/charts
      - https://ghcr.io/bank-vaults/helm-charts
      - https://charts.zitadel.com
      - https://charts.dexidp.io
      - https://kyverno.github.io/kyverno/
      - https://charts.longhorn.io
      - https://charts.goauthentik.io
      - oci://ghcr.io/batleforc/charts/weebo-authentik
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "*"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "Role"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "rbac.authorization.k8s.io"
        kind: "RoleBinding"
      - group: "networking.k8s.io"
        kind: "IngressClass"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "cert-manager.io"
        kind: "ClusterIssuer"
      - group: "vault.banzaicloud.com"
        kind: "Vault"
      - group: "trust.cert-manager.io"
        kind: "Bundle"
      - group: "cert-manager.io"
        kind: "Certificate"
      - group: "policies.kyverno.io"
        kind: "MutatingPolicy"
      - group: "kyverno.io"
        kind: "ClusterPolicy"
      - group: "scheduling.k8s.io"
        kind: "PriorityClass"
      - group: "authentik.weebo.io"
        kind: "AuthentikInstance"
      - group: "authentik.weebo.io"
        kind: "AuthentikNamespacePolicy"
      - group: "authentik.weebo.io"
        kind: "AuthentikUser"
      - group: "authentik.weebo.io"
        kind: "AuthentikGroup"
      - group: "authentik.weebo.io"
        kind: "AuthentikBrand"
      # Cluster-scoped like the four above, and added to the operator in 0.7.0
      # -- after this list was first written, which is why it was missing.
      # Without it `auth-app` fails its sync with
      #   resource authentik.weebo.io:AuthentikFlow is not permitted in project infra
      # and the CR never reaches the cluster. See MIGRATION.md phase 2b.
      # NB: AuthentikOutpost is the one remaining cluster-scoped kind still
      # absent here. No phase of the migration creates one (an unset
      # `outpostRef` means Authentik's embedded outpost), so it is left out
      # rather than granted unused -- add it here first if that ever changes.
      - group: "authentik.weebo.io"
        kind: "AuthentikFlow"
  - name: monitoring
    sourceRepo:
      - https://open-telemetry.github.io/opentelemetry-helm-charts
      - https://github.com/batleforc/weebo-si-hardening
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
      - server: "https://kubernetes.default.svc"
        namespace: "obi"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "external-secrets.io"
        kind: "ClusterSecretStore"
      - group: "external-secrets.io"
        kind: "ClusterExternalSecret"
  - name: database
    sourceRepo:
      - oci://ghcr.io/clickhouse/clickhouse-operator-helm
      - https://mongodb.github.io/helm-charts
      - https://cloudnative-pg.github.io/charts
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "database"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
