ingress:
  enabled: true
  project: infra

auth:
  enabled: true
  project: infra

vault:
  enabled: true
  project: infra

storage:
  local:
    enabled: true
  main:
    enabled: true
    project: infra

vpn:
  enabled: true
  project: infra

hook:
  enabled: true
  project: infra

monitoring:
  enabled: true
  project: monitoring

database:
  enabled: true
  project: database

angos:
  enabled: true
  project: dev-base

repo: ""
branch: ""

traefik:
  ips: ""

project:
  - name: infra
    sourceRepo:
      - oci://ghcr.io/traefik/helm/traefik
      - oci://quay.io/jetstack/charts/cert-manager
      - oci://ghcr.io/bank-vaults/helm-charts/vault-operator
      - oci://quay.io/jetstack/charts/trust-manager
      - https://ghcr.io/external-secrets/charts
      - https://ghcr.io/bank-vaults/helm-charts
      - https://charts.dexidp.io
      - https://kyverno.github.io/kyverno/
      - https://charts.longhorn.io
      - https://charts.goauthentik.io
      - oci://ghcr.io/batleforc/charts/weebo-authentik
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "*"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "Role"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "rbac.authorization.k8s.io"
        kind: "RoleBinding"
      - group: "networking.k8s.io"
        kind: "IngressClass"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "cert-manager.io"
        kind: "ClusterIssuer"
      - group: "vault.banzaicloud.com"
        kind: "Vault"
      - group: "trust.cert-manager.io"
        kind: "Bundle"
      - group: "cert-manager.io"
        kind: "Certificate"
      - group: "policies.kyverno.io"
        kind: "MutatingPolicy"
      - group: "kyverno.io"
        kind: "ClusterPolicy"
      - group: "scheduling.k8s.io"
        kind: "PriorityClass"
      - group: "authentik.weebo.io"
        kind: "AuthentikInstance"
      - group: "authentik.weebo.io"
        kind: "AuthentikNamespacePolicy"
      - group: "authentik.weebo.io"
        kind: "AuthentikUser"
      - group: "authentik.weebo.io"
        kind: "AuthentikGroup"
      - group: "authentik.weebo.io"
        kind: "AuthentikBrand"
      - group: "authentik.weebo.io"
        kind: "AuthentikFlow"
      - group: "authentik.weebo.io"
        kind: "AuthentikScopeMapping"
      - group: "longhorn.io"
        kind: "RecurringJob"
  - name: monitoring
    sourceRepo:
      - https://open-telemetry.github.io/opentelemetry-helm-charts
      - https://github.com/batleforc/weebo-si-hardening
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
      - server: "https://kubernetes.default.svc"
        namespace: "obi"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "external-secrets.io"
        kind: "ClusterSecretStore"
      - group: "external-secrets.io"
        kind: "ClusterExternalSecret"
  - name: database
    sourceRepo:
      - oci://ghcr.io/clickhouse/clickhouse-operator-helm
      - https://mongodb.github.io/helm-charts
      - https://cloudnative-pg.github.io/charts
      - https://operator.rustfs.com
      - https://github.com/rustfs/operator
      - https://valkey.io/valkey-helm
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "database"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
      - server: "https://kubernetes.default.svc"
        namespace: "s3"
      - server: "https://kubernetes.default.svc"
        namespace: "valkey"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "rustfs.com"
        kind: "Tenant"
  - name: dev-base
    includeBaseRepo: true
    dest:
      - server: https://kubernetes.default.svc
        namespace: "angos"
      - server: https://kubernetes.default.svc
        namespace: "batlehub"
      # The angos chart's one node-level object, kept out of `angos` so the
      # Pod Security exception it needs covers nothing else.
      - server: https://kubernetes.default.svc
        namespace: "angos-node"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "valkey.io"
        kind: "ValkeyCluster"
      # angos binds its own ServiceAccount to the built-in
      # `system:service-account-issuer-discovery` ClusterRole, which is how it
      # reads the cluster's JWKS to validate the service-account tokens
      # workloads present to it. Without this entry ArgoCD refuses the object
      # with "ClusterRoleBinding is not permitted in project dev-base".
      #
      # ClusterRole is deliberately NOT whitelisted alongside it: this project
      # may bind an existing role, never define a new one, which keeps the
      # blast radius to roles someone else already reviewed.
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
