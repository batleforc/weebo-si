ingress:
  enabled: true
  project: infra

auth:
  enabled: true
  project: infra

vault:
  enabled: true
  project: infra

storage:
  local:
    enabled: true
  main:
    enabled: true
    project: infra

vpn:
  enabled: true
  project: infra

hook:
  enabled: true
  project: infra

monitoring:
  enabled: true
  project: monitoring

database:
  enabled: true
  project: database

angos:
  enabled: true
  project: dev-base

batlehub:
  enabled: true
  project: dev-base

che:
  enabled: true
  project: dev

repo: ""
branch: ""

traefik:
  ips: ""

project:
  - name: infra
    sourceRepo:
      - oci://ghcr.io/traefik/helm/traefik
      - oci://quay.io/jetstack/charts/cert-manager
      - oci://ghcr.io/bank-vaults/helm-charts/vault-operator
      - oci://quay.io/jetstack/charts/trust-manager
      - https://ghcr.io/external-secrets/charts
      - https://ghcr.io/bank-vaults/helm-charts
      - https://charts.dexidp.io
      - https://kyverno.github.io/kyverno/
      - https://charts.longhorn.io
      - https://charts.goauthentik.io
      - oci://ghcr.io/batleforc/charts/weebo-authentik
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "*"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "Role"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "rbac.authorization.k8s.io"
        kind: "RoleBinding"
      - group: "networking.k8s.io"
        kind: "IngressClass"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "cert-manager.io"
        kind: "ClusterIssuer"
      - group: "vault.banzaicloud.com"
        kind: "Vault"
      - group: "trust.cert-manager.io"
        kind: "Bundle"
      - group: "cert-manager.io"
        kind: "Certificate"
      - group: "policies.kyverno.io"
        kind: "MutatingPolicy"
      - group: "kyverno.io"
        kind: "ClusterPolicy"
      - group: "scheduling.k8s.io"
        kind: "PriorityClass"
      - group: "authentik.weebo.io"
        kind: "AuthentikInstance"
      - group: "authentik.weebo.io"
        kind: "AuthentikNamespacePolicy"
      - group: "authentik.weebo.io"
        kind: "AuthentikUser"
      - group: "authentik.weebo.io"
        kind: "AuthentikGroup"
      - group: "authentik.weebo.io"
        kind: "AuthentikBrand"
      - group: "authentik.weebo.io"
        kind: "AuthentikFlow"
      - group: "authentik.weebo.io"
        kind: "AuthentikScopeMapping"
      - group: "longhorn.io"
        kind: "RecurringJob"
  - name: monitoring
    sourceRepo:
      - https://open-telemetry.github.io/opentelemetry-helm-charts
      - https://github.com/batleforc/weebo-si-hardening
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
      - server: "https://kubernetes.default.svc"
        namespace: "obi"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "external-secrets.io"
        kind: "ClusterSecretStore"
      - group: "external-secrets.io"
        kind: "ClusterExternalSecret"
  - name: database
    sourceRepo:
      - oci://ghcr.io/clickhouse/clickhouse-operator-helm
      - https://mongodb.github.io/helm-charts
      - https://cloudnative-pg.github.io/charts
      - https://operator.rustfs.com
      - https://github.com/rustfs/operator
      - https://valkey.io/valkey-helm
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "database"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
      - server: "https://kubernetes.default.svc"
        namespace: "s3"
      - server: "https://kubernetes.default.svc"
        namespace: "valkey"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "rustfs.com"
        kind: "Tenant"
  - name: dev-base
    includeBaseRepo: true
    sourceRepo:
      - oci://ghcr.io/batlehub/batlehub/charts/batlehub
    dest:
      # batlehub's chart renders an Application of its own -- the upstream
      # chart, pulled from the OCI repo above -- and an Application lives in
      # argocd whatever it deploys.
      - server: https://kubernetes.default.svc
        namespace: "argocd"
      - server: https://kubernetes.default.svc
        namespace: "angos"
      - server: https://kubernetes.default.svc
        namespace: "batlehub"
      # The angos chart's one node-level object, kept out of `angos` so the
      # Pod Security exception it needs covers nothing else.
      - server: https://kubernetes.default.svc
        namespace: "angos-node"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "valkey.io"
        kind: "ValkeyCluster"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "external-secrets.io"
        kind: "ClusterSecretStore"
      - group: "external-secrets.io"
        kind: "ClusterExternalSecret"
  - name: dev
    includeBaseRepo: true
    sourceRepo:
      - https://github.com/devfile/devworkspace-operator
      - https://eclipse-che.github.io/che-operator/charts
      - oci://ghcr.io/batleforc/charts/weebo-si-operator
      - oci://ghcr.io/batleforc/charts/endpoint-gateway
    dest:
      - server: https://kubernetes.default.svc
        namespace: "argocd"
      - server: https://kubernetes.default.svc
        namespace: "eclipse-che"
      - server: "https://kubernetes.default.svc"
        namespace: "devworkspace-controller"
      - server: "https://kubernetes.default.svc"
        namespace: "weebo-si-hardening"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "controller.devfile.io"
        kind: "DevWorkspaceOperatorConfig"
      - group: "trust.cert-manager.io"
        kind: "Bundle"
      - group: "hardening.weebo.io"
        kind: "WeeboSiConfig"
      - group: "hardening.weebo.io"
        kind: "WeeboSiTeam"
      - group: "hardening.weebo.io"
        kind: "WeeboSiUser"
  # The per-user Applications weebo-si-operator creates (identity feature),
  # rendering 2.helm/user-app, and the external-config Application that chart
  # renders in turn. Kept to what they do: a dev-ws-* namespace, plus that
  # one Application in argocd.
  - name: che-users
    includeBaseRepo: true
    sourceRepo:
      # Users' external config (cheUser.externalConfig.repoURL).
      - https://github.com/batleforc/weebo-dotfiles-che
    dest:
      - server: https://kubernetes.default.svc
        namespace: "dev-ws-*"
      - server: https://kubernetes.default.svc
        namespace: "argocd"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
    # Unset, every namespaced kind is allowed, a RoleBinding to `admin` and an
    # Application naming another project included. Kept to what user-app
    # renders. The user's external config (dotfiles, ConfigMaps, Secrets...)
    # is deployed under this project too, so a kind it needs goes here.
    namespaceResourceWhitelist:
      - group: "rbac.authorization.k8s.io"
        kind: "RoleBinding"
      - group: "external-secrets.io"
        kind: "SecretStore"
      - group: "argoproj.io"
        kind: "Application"
      - group: ""
        kind: "ConfigMap"
      - group: ""
        kind: "Secret"
