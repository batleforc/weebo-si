ingress:
  enabled: true
  project: infra

repo: ""
branch: ""

traefik:
  ips: ""

project:
  - name: infra
    sourceRepo:
      - ghcr.io/traefik/helm/traefik
      - quay.io/jetstack/charts/cert-manager
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "*"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
