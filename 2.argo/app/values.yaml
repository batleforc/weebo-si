ingress:
  enabled: true
  project: infra

auth:
  enabled: true
  project: infra

vault:
  enabled: true
  project: infra

storage:
  local:
    enabled: true
  main:
    enabled: true
    project: infra

vpn:
  enabled: true
  project: infra

hook:
  enabled: true
  project: infra

monitoring:
  enabled: true
  project: monitoring

database:
  enabled: true
  project: database

angos:
  enabled: true
  project: dev-base

batlehub:
  enabled: true
  project: dev-base

forgejo:
  enabled: true
  project: dev-base

# Stalwart, the internal mail server (2.argo/helm/mail, RFC 0001).
mail:
  enabled: false
  project: dev-base

che:
  enabled: true
  project: dev

# The BatleHub stylesheet of the Argo CD UI (templates/argocd-theme.yaml), built
# by 3.custo/batlehub-theme into files/argocd-theme/. ui.cssurl, which loads it,
# is set where Argo CD is installed (1.pulu-conf).
#
# `dex`: the BatleHub theme of Argo CD's Dex (templates/argocd-dex-theme.yaml),
# from files/dex-theme/. The volume and frontend settings that use it are in
# 1.pulu-conf too.
argocdTheme:
  enabled: true
  dex: true

repo: ""
branch: ""

traefik:
  ips: ""

# Lock Argo CD's built-in `default` project (templates/appProject/default.yaml):
# no source, no destination, so nothing can deploy through it. Flip to true
# only AFTER the app of apps (`main`, created by 1.pulu-conf) has moved to the
# `bootstrap` project below -- locked while `main` still uses it, the root
# would stop syncing.
lockDefaultProject: true

project:
  # The app of apps itself (`main`, 1.pulu-conf). What this chart renders:
  # Applications, AppProjects and theme ConfigMaps in argocd, the dex-theme
  # ConfigMap in kube-system, and weebo-admin-crb. It writes the AppProjects,
  # so it is the root of trust whatever its own restrictions.
  - name: bootstrap
    sourceRepo: []
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "kube-system"
    clusterResourceWhitelist:
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
  - name: infra
    sourceRepo:
      - oci://ghcr.io/traefik/helm/traefik
      - oci://quay.io/jetstack/charts/cert-manager
      - oci://ghcr.io/bank-vaults/helm-charts/vault-operator
      - oci://quay.io/jetstack/charts/trust-manager
      - oci://ghcr.io/tarampampam/error-pages/charts/error-pages
      - https://ghcr.io/external-secrets/charts
      - https://ghcr.io/bank-vaults/helm-charts
      - https://charts.dexidp.io
      - https://kyverno.github.io/kyverno/
      - https://charts.longhorn.io
      - https://github.com/kubernetes-csi/external-snapshotter
      - https://charts.goauthentik.io
      - oci://ghcr.io/batleforc/charts/weebo-authentik
      # vault/main's operators (bank-vaults, external-secrets), spelled as
      # their Applications spell them, and local-storage.
      - ghcr.io/external-secrets/charts
      - ghcr.io/bank-vaults/helm-charts
      - https://github.com/rancher/local-path-provisioner
    includeBaseRepo: true
    # The namespaces the infra Applications actually manage (live inventory,
    # 2026-11-05), not `*`: a new one is an explicit edit here. kube-system:
    # cert-manager's leader-election Role, and snapshot-crds' destination.
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "auth"
      - server: "https://kubernetes.default.svc"
        namespace: "dex"
      - server: "https://kubernetes.default.svc"
        namespace: "cert-manager"
      - server: "https://kubernetes.default.svc"
        namespace: "kube-system"
      - server: "https://kubernetes.default.svc"
        namespace: "hook"
      - server: "https://kubernetes.default.svc"
        namespace: "longhorn"
      - server: "https://kubernetes.default.svc"
        namespace: "netbird"
      - server: "https://kubernetes.default.svc"
        namespace: "traefik"
      - server: "https://kubernetes.default.svc"
        namespace: "vault"
      - server: "https://kubernetes.default.svc"
        namespace: "vault-operator"
      - server: "https://kubernetes.default.svc"
        namespace: "vault-infra"
      - server: "https://kubernetes.default.svc"
        namespace: "external-secrets"
      - server: "https://kubernetes.default.svc"
        namespace: "local-path-storage"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "Role"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "rbac.authorization.k8s.io"
        kind: "RoleBinding"
      - group: "networking.k8s.io"
        kind: "IngressClass"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "cert-manager.io"
        kind: "ClusterIssuer"
      - group: "vault.banzaicloud.com"
        kind: "Vault"
      - group: "trust.cert-manager.io"
        kind: "Bundle"
      - group: "cert-manager.io"
        kind: "Certificate"
      - group: "policies.kyverno.io"
        kind: "MutatingPolicy"
      - group: "kyverno.io"
        kind: "ClusterPolicy"
      - group: "scheduling.k8s.io"
        kind: "PriorityClass"
      - group: "authentik.weebo.io"
        kind: "AuthentikInstance"
      - group: "authentik.weebo.io"
        kind: "AuthentikNamespacePolicy"
      - group: "authentik.weebo.io"
        kind: "AuthentikUser"
      - group: "authentik.weebo.io"
        kind: "AuthentikGroup"
      - group: "authentik.weebo.io"
        kind: "AuthentikBrand"
      - group: "authentik.weebo.io"
        kind: "AuthentikFlow"
      - group: "authentik.weebo.io"
        kind: "AuthentikScopeMapping"
      - group: "authentik.weebo.io"
        kind: "AuthentikBlueprint"
      - group: "longhorn.io"
        kind: "RecurringJob"
      # local-storage (moved out of `default`).
      - group: "storage.k8s.io"
        kind: "StorageClass"
  - name: monitoring
    sourceRepo:
      - https://open-telemetry.github.io/opentelemetry-helm-charts
      - https://github.com/batleforc/weebo-si-hardening
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
      - server: "https://kubernetes.default.svc"
        namespace: "obi"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "external-secrets.io"
        kind: "ClusterSecretStore"
      - group: "external-secrets.io"
        kind: "ClusterExternalSecret"
  - name: database
    sourceRepo:
      - oci://ghcr.io/clickhouse/clickhouse-operator-helm
      - https://mongodb.github.io/helm-charts
      - https://cloudnative-pg.github.io/charts
      - https://operator.rustfs.com
      - https://github.com/rustfs/operator
      - https://valkey.io/valkey-helm
    includeBaseRepo: true
    dest:
      - server: "https://kubernetes.default.svc"
        namespace: "argocd"
      - server: "https://kubernetes.default.svc"
        namespace: "database"
      - server: "https://kubernetes.default.svc"
        namespace: "monitoring"
      - server: "https://kubernetes.default.svc"
        namespace: "s3"
      - server: "https://kubernetes.default.svc"
        namespace: "valkey"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "rustfs.com"
        kind: "Tenant"
  - name: dev-base
    includeBaseRepo: true
    sourceRepo:
      - oci://ghcr.io/batlehub/batlehub/charts/batlehub
      - oci://code.forgejo.org/forgejo-helm/forgejo
      - oci://ghcr.io/batleforc/charts/weebo-forgejo
      - oci://ghcr.io/batleforc/charts/weebo-batlehub
      - oci://ghcr.io/batleforc/charts/weebo-angos
      # Phase 1 of RFC 0001: the operator is not deployed yet.
      - oci://ghcr.io/batleforc/charts/weebo-stalwart
    dest:
      # batlehub's chart renders an Application of its own -- the upstream
      # chart, pulled from the OCI repo above -- and an Application lives in
      # argocd whatever it deploys.
      - server: https://kubernetes.default.svc
        namespace: "argocd"
      - server: https://kubernetes.default.svc
        namespace: "angos"
      - server: https://kubernetes.default.svc
        namespace: "batlehub"
      - server: https://kubernetes.default.svc
        namespace: "forgejo"
      # The weebo-forgejo operator (2.argo/helm/forgejo, operator.*).
      - server: https://kubernetes.default.svc
        namespace: "weebo-forgejo"
      # The weebo-batlehub operator (2.argo/helm/batlehub, operator.*).
      - server: https://kubernetes.default.svc
        namespace: "weebo-batlehub"
      # The weebo-angos operator (2.argo/helm/angos, operator.*).
      - server: https://kubernetes.default.svc
        namespace: "weebo-angos"
      # The angos chart's one node-level object, kept out of `angos` so the
      # Pod Security exception it needs covers nothing else.
      - server: https://kubernetes.default.svc
        namespace: "angos-node"
      # Stalwart (2.argo/helm/mail), and its operator weebo-stalwart
      # (phase 1 of RFC 0001, not deployed yet).
      - server: https://kubernetes.default.svc
        namespace: "mail"
      - server: https://kubernetes.default.svc
        namespace: "weebo-stalwart"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "valkey.io"
        kind: "ValkeyCluster"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "external-secrets.io"
        kind: "ClusterSecretStore"
      - group: "external-secrets.io"
        kind: "ClusterExternalSecret"
      # weebo-forgejo, weebo-batlehub and weebo-angos: their CRDs, their admission
      # webhooks, and the cluster-scoped kinds of forgejo's API that
      # 2.argo/helm/forgejo declares (batlehub's API has none).
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "forgejo.weebo.io"
        kind: "ForgejoInstance"
      - group: "forgejo.weebo.io"
        kind: "ForgejoNamespacePolicy"
      # weebo-stalwart's cluster-scoped kinds (phase 1 of RFC 0001).
      - group: "stalwart.weebo.io"
        kind: "StalwartInstance"
      - group: "stalwart.weebo.io"
        kind: "StalwartNamespacePolicy"
      - group: "stalwart.weebo.io"
        kind: "StalwartDomain"
  - name: dev
    includeBaseRepo: true
    sourceRepo:
      - https://github.com/devfile/devworkspace-operator
      - https://eclipse-che.github.io/che-operator/charts
      - oci://ghcr.io/batleforc/charts/weebo-si-operator
      - oci://ghcr.io/batleforc/charts/endpoint-gateway
    dest:
      - server: https://kubernetes.default.svc
        namespace: "argocd"
      - server: https://kubernetes.default.svc
        namespace: "eclipse-che"
      - server: "https://kubernetes.default.svc"
        namespace: "devworkspace-controller"
      - server: "https://kubernetes.default.svc"
        namespace: "weebo-si-hardening"
    clusterResourceWhitelist:
      - group: ""
        kind: "Namespace"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRole"
      - group: "rbac.authorization.k8s.io"
        kind: "ClusterRoleBinding"
      - group: "admissionregistration.k8s.io"
        kind: "MutatingWebhookConfiguration"
      - group: "apiextensions.k8s.io"
        kind: "CustomResourceDefinition"
      - group: "admissionregistration.k8s.io"
        kind: "ValidatingWebhookConfiguration"
      - group: "controller.devfile.io"
        kind: "DevWorkspaceOperatorConfig"
      - group: "trust.cert-manager.io"
        kind: "Bundle"
      - group: "hardening.weebo.io"
        kind: "WeeboSiConfig"
      - group: "hardening.weebo.io"
        kind: "WeeboSiTeam"
      - group: "hardening.weebo.io"
        kind: "WeeboSiUser"
  # che-users (the per-user Applications weebo-si-operator creates) is
  # rendered by 2.argo/helm/che/hardening, next to the WeeboSiUser objects it
  # gives each person a role for: one list of users, both in step.
