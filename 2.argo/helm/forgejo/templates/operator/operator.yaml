{{- $o := .Values.operator -}}
{{- if and .Values.forgejo.enabled $o.enabled -}}
---
# weebo-forgejo, from the chart its repository publishes: CRDs, the operator,
# its admission webhook (allow-list, ForgejoNamespacePolicy) and the webhook's
# certificate, from a self-signed Issuer the chart creates -- cert-manager is
# already there. The CRDs are chart templates, so a chart bump upgrades them.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weebo-forgejo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    chart: {{ $o.chart.name }}
    repoURL: {{ $o.chart.repoURL }}
    targetRevision: {{ $o.chart.version }}
    helm:
      releaseName: weebo-forgejo
      valuesObject:
        replicaCount: {{ $o.replicaCount }}
        podDisruptionBudget:
          enabled: {{ gt (int $o.replicaCount) 1 }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: {{ $o.namespace }}
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end -}}
