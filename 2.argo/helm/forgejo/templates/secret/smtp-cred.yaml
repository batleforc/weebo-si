{{- if and .Values.forgejo.enabled .Values.forgejo.mailer.enabled -}}
---
# Forgejo's sending account on Stalwart (2.argo/helm/mail): host, port,
# security, username, password, from. Written by Terraform in phase 0 of
# RFC 0001 (2.terra/vault/terra-map/mail.tf), by weebo-stalwart's
# StalwartServiceAccount from phase 1 on -- same path, same keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-smtp
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: forgejo-smtp
  dataFrom:
  - extract:
      key: mv/forgejo/smtp
{{- end -}}
