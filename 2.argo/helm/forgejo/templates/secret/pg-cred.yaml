{{- if and .Values.forgejo.enabled .Values.forgejo.postgres.enabled -}}
---
# The role CNPG creates at bootstrap, and the password Forgejo then connects
# with (FORGEJO__DATABASE__PASSWD). basic-auth because CNPG refuses a
# `bootstrap.initdb.secret` of any other type. Wave 1, before the Cluster of
# wave 2 asks for it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-pg-cred
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: forgejo-pg-cred
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ "{{" }}.username}}"
        password: "{{ "{{" }}.password}}"
  data:
  - secretKey: username
    remoteRef:
      key: mv/forgejo/pg
      property: username
  - secretKey: password
    remoteRef:
      key: mv/forgejo/pg
      property: password
{{- end -}}
