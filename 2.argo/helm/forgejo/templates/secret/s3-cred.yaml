{{- if and .Values.forgejo.enabled .Values.forgejo.s3.enabled -}}
---
# The RustFS user's keys. The tenant in 2.argo/helm/database/sub reads the same
# mv/forgejo/s3 path to create that user, so the two sides cannot disagree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-s3-cred
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: forgejo-s3-cred
  data:
  - secretKey: accesskey
    remoteRef:
      key: mv/forgejo/s3
      property: accesskey
  - secretKey: secretkey
    remoteRef:
      key: mv/forgejo/s3
      property: secretkey
{{- end -}}
