{{- if and .Values.forgejo.enabled .Values.forgejo.oidc.enabled -}}
---
# Written to Vault by the authentik operator itself: the `forgejo`
# AuthentikApplication in 2.argo/helm/auth/sub carries `secretTargets:
# [{backend: vault, path: forgejo/auth}]`. Renamed to `key` / `secret`, the
# only two keys the chart reads from a gitea.oauth[].existingSecret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-oidc
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: forgejo-oidc
  data:
  - secretKey: key
    remoteRef:
      key: mv/forgejo/auth
      property: AUTHENTIK_CLIENT_ID
  - secretKey: secret
    remoteRef:
      key: mv/forgejo/auth
      property: AUTHENTIK_CLIENT_SECRET
{{- end -}}
