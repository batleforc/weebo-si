{{- if .Values.forgejo.enabled -}}
---
# The local admin (gitea.admin.existingSecret). The chart reads exactly these
# two keys, `username` and `password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: forgejo-admin
  data:
  - secretKey: username
    remoteRef:
      key: mv/forgejo/admin
      property: username
  - secretKey: password
    remoteRef:
      key: mv/forgejo/admin
      property: password
{{- end -}}
