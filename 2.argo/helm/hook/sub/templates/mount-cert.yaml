# Mounts the cluster CA bundle (ConfigMap weebo.poc) over /etc/ssl/certs in every
# container of a pod annotated `inject-certs: enabled`.
#
# A policies.kyverno.io MutatingPolicy since 2026-11-18: Kyverno 1.20 no longer
# executes kyverno.io ClusterPolicy. Same behaviour as the ClusterPolicy it
# replaces: admission only (no mutateExisting), failurePolicy Fail (the
# default), and rules auto-generated for the same four controllers the old
# `pod-policies.kyverno.io/autogen-controllers` annotation named, so their pod
# templates keep getting the volume too.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: add-certificates-volume
  annotations:
    policies.kyverno.io/title: Add Certificates as a Volume
    policies.kyverno.io/subject: Pod,Volume
    policies.kyverno.io/description: >-
      Adds the cluster CA bundle as a volume mounted at /etc/ssl/certs in all
      containers of a pod annotated `inject-certs: enabled`.
spec:
  failurePolicy: Fail
  evaluation:
    admission:
      enabled: true
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, jobs, statefulsets]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: inject-certs-annotation
      expression: >-
        has(object.metadata.annotations) &&
        object.metadata.annotations[?'inject-certs'].orValue('') == 'enabled'
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: object.spec.containers.map(c, Object.spec.containers{
                name: c.name,
                volumeMounts: [Object.spec.containers.volumeMounts{
                  name: "etc-ssl-certs",
                  mountPath: "/etc/ssl/certs"
                }]
              }),
              volumes: [Object.spec.volumes{
                name: "etc-ssl-certs",
                configMap: Object.spec.volumes.configMap{name: "weebo.poc"}
              }]
            }
          }
