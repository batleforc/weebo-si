{{- if .Values.defaultLimits.enabled -}}
# Gives every namespace a LimitRange so "no memory limit" stops being what a
# workload inherits by forgetting to set one. 51 of the 77 containers running
# when this was written had none, and on a single node one leak is enough to
# evict the control plane.
#
# Generated by Kyverno rather than shipped as manifests because the manifests
# have to arrive *after* namespaces that ~15 different Applications create, and
# there is no ordering that holds on a cold bootstrap. A generate rule has no
# ordering at all: generateExisting backfills whatever already exists whenever
# Kyverno starts, and the admission path catches everything created later. Tear
# the cluster down, bring it back in any order, and it converges either way --
# which is the whole point, and something an explicit namespace list could not
# do without being edited every time a namespace is added.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-container-limits
  annotations:
    policies.kyverno.io/title: Default container resources per namespace
    policies.kyverno.io/category: Resource governance
    policies.kyverno.io/subject: Namespace,LimitRange
    policies.kyverno.io/description: >-
      Generates a LimitRange giving containers a default memory limit and a
      request floor in every namespace except the excluded ones. A backstop
      against unbounded workloads, not a substitute for real per-workload
      requests and limits.
spec:
  # MUST stay Ignore. A generate rule on Namespace makes Kyverno register a
  # webhook on namespace CREATE; left at the default Fail, a Kyverno that is
  # down or not yet up blocks namespace creation cluster-wide -- which would
  # deadlock the very bootstrap this policy is written to survive. Ignore means
  # a namespace created while Kyverno is unavailable simply gets no LimitRange
  # until generateExisting backfills it.
  failurePolicy: Ignore
  # Required for generateExisting to reconcile namespaces that already exist.
  background: true
  rules:
    - name: add-default-limitrange
      match:
        any:
          - resources:
              kinds:
                - Namespace
      exclude:
        any:
          - resources:
              namespaces:
                {{- range $ns := .Values.defaultLimits.excludeNamespaces }}
                - {{ $ns | quote }}
                {{- end }}
      generate:
        apiVersion: v1
        kind: LimitRange
        name: default-resources
        namespace: "{{ `{{request.object.metadata.name}}` }}"
        # Recreate the LimitRange if it is deleted or edited out of band, and
        # remove it again when this policy goes away -- so a teardown leaves
        # nothing behind.
        synchronize: true
        generateExisting: true
        data:
          metadata:
            labels:
              app.kubernetes.io/managed-by: kyverno
          spec:
            limits:
              - type: Container
                default:
                  memory: {{ .Values.defaultLimits.defaultLimit.memory }}
                defaultRequest:
                  memory: {{ .Values.defaultLimits.defaultRequest.memory }}
                  cpu: {{ .Values.defaultLimits.defaultRequest.cpu }}
{{- end -}}
