{{- if .Values.kyverno.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  labels:
    app.kubernetes.io/name: kyverno
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
  destination:
    namespace: hook
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: kyverno
    repoURL: https://kyverno.github.io/kyverno/
    targetRevision: {{ .Values.kyverno.version }}
    helm:
      releaseName: kyverno
      valuesObject:
        webhookLabels:
          app.kubernetes.io/managed-by: argocd
        # Two of the four controllers had nothing to do. Measured 2026-09-05:
        # admission 176Mi, background 77Mi, cleanup 115Mi, reports 75Mi.
        #
        # cleanup ran against zero CleanupPolicies, and reports produced 81
        # PolicyReports that were all a single "skip" or "pass" from a
        # mutate-only policy -- 81 etcd objects and a watch cache carrying no
        # signal. Dropping both frees ~190Mi, 43% of Kyverno's footprint.
        #
        # admission and background both stay: admission runs the mutate policy
        # and the Namespace generate webhook, and background is what makes
        # default-limits.yaml's generateExisting/synchronize work at all.
        #
        # Turn reportsController back on the moment a *validate* policy is
        # added (the securityContext work in the audit's §3.7) -- reports are
        # the only place validation results surface, and without it a failing
        # policy is invisible.
        cleanupController:
          enabled: false
        reportsController:
          enabled: false
        # Reporting off end-to-end. The admission controller ships
        # --admissionReports=true and RBAC to write ephemeralreports, so
        # disabling reportsController alone would leave it writing reports that
        # nothing aggregates -- and writing them into CRDs removed below, which
        # would be a steady stream of errors rather than a saving. These flags
        # are what actually stop it at the source.
        features:
          admissionReports:
            enabled: false
          aggregateReports:
            enabled: false
          policyReports:
            enabled: false
          validatingAdmissionPolicyReports:
            enabled: false
          reporting:
            validate: false
            mutate: false
            mutateExisting: false
            imageVerify: false
            generate: false
        crds:
          # The post-upgrade migrate-resources Job cannot run under ArgoCD: its
          # ServiceAccount and RBAC are hooks too, with hook-succeeded, so ArgoCD
          # deletes them before the Job's pod starts and the CLI gets a 401
          # (seen on the 3.9.2 bump, 2026-10-24). It only rewrites objects to a
          # new storage version; on a bump that changes one (check
          # `.status.storedVersions` on the kyverno CRDs), run `kyverno migrate`
          # by hand.
          migration:
            enabled: false
          groups:
            # Kept although nothing writes them: kyverno-background-controller
            # still watches both (apiserver audit log, 2026-10-25), and deleting
            # a CRD under a live informer leaves it failing in a loop. Setting
            # them false here only made ArgoCD stop tracking them; the CRDs
            # stayed, unowned, from 2026-09-05 to 2026-10-25.
            reports:
              clusterephemeralreports: true
              ephemeralreports: true
            # Storage for what reportsController wrote. Safe to drop because
            # the features block above stops anything writing them, and nothing
            # watches them. ArgoCD does not prune a CRD it stops rendering: the
            # four below were deleted by hand on 2026-10-25.
            wgpolicyk8s:
              clusterpolicyreports: false
              policyreports: false
            kyverno:
              # Paired with cleanupController above.
              cleanuppolicies: false
              clustercleanuppolicies: false
              # Everything below stays. clusterpolicies, policies and
              # policyexceptions hold nothing since the move to
              # policies.kyverno.io (2026-11-18), but Kyverno 1.20 still serves
              # them and its check-legacy-policies hook reads them; dropping a
              # CRD under a live informer is the failure loop described above.
              # updaterequests is the queue the background controller drives
              # generate through, so losing it breaks the LimitRanges.
              clusterpolicies: true
              policies: true
              updaterequests: true
              globalcontextentries: true
              policyexceptions: true

        config:
          webhooks:
            # Replaces the chart default (kube-system only; kyverno adds its own
            # namespace, hook, on top). vault-infra is excluded to break an
            # admission cycle: bank-vaults' pod webhook is failurePolicy Fail
            # and does not exclude hook, so a new kyverno pod needs
            # vault-webhook up, while a new vault-webhook pod went through this
            # Fail webhook and needed kyverno up. With both pods gone (a stuck
            # drain, an etcd restore), no pod could be created outside a few
            # namespaces. Costs nothing: the only pod there, vault-webhook, was
            # already running without the CA mount (checked 2026-10-25).
            namespaceSelector:
              matchExpressions:
                - key: kubernetes.io/metadata.name
                  operator: NotIn
                  values:
                    - kube-system
                    - vault-infra

        # The policies.kyverno.io group (the `kyverno-api` subchart) is the one
        # in use since 2026-11-18: Kyverno 1.20 (chart 3.10) no longer executes
        # kyverno.io ClusterPolicy, so add-certificates-volume,
        # add-rustfs-tenant-ca (MutatingPolicy) and default-container-limits
        # (GeneratingPolicy) live there, in hook/sub. Its CRDs share the
        # `crds.install` condition with the kyverno.io ones, so neither group
        # can be dropped alone.
{{- end -}}
