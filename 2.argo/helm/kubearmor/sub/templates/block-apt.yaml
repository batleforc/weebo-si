apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: block-pkg-mgmt-tools-exec
  namespace: dev-ws-batleforc
spec:
  selector:
    matchLabels:
      controller.devfile.io/devworkspace_name: weebo-dotfiles-che-owjk
  process:
    matchPaths:
    - path: /usr/bin/apt
    - path: /usr/bin/apt-get
  action:
    Block