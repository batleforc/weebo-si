{{- if .Values.angos.enabled -}}
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: angos-valkey
  namespace: {{ .Release.Namespace }}
spec:
  image: {{ printf "%s:%s" .Values.angos.valkey.image.repository .Values.angos.valkey.image.tag | quote }}
  shards: 1
  replicas: 0
  podDisruptionBudget:
    mode: Disabled
  persistence:
    size: 5Gi
    storageClassName: longhorn
  users:
    - name: angos
      passwordSecret:
        name: angos-valkey-cred
        keys: [pwd]
      permissions: "+@all ~* &*"
{{- end -}}