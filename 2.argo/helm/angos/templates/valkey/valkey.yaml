{{- if .Values.angos.enabled -}}
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: angos-valkey
  namespace: {{ .Release.Namespace }}
spec:
  image: {{ printf "%s:%s" .Values.angos.valkey.image.repository .Values.angos.valkey.image.tag | quote }}
  shards: 1
  replicasPerShard: 0
  podDisruptionBudget:
    mode: Disabled
  persistence:
    size: 5Gi
    storageClassName: longhorn
  acl:
    users:
      - name: angos
        password:
          secret:
            name: angos-valkey-cred
            keys: [pwd]
        permissions: "+@all ~* &*"
{{- end -}}