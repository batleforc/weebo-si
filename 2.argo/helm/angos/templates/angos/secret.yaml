{{- if .Values.angos.enabled -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: angos-partial-conf
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: cred-store
    kind: SecretStore
  target:
    name: registry-credentials
    template:
      data:
        secrets.toml: |
          [cache.redis]
          url = "{{ "{{" }}.url}}"
          key_prefix = "angos-cache-"

          [metadata_store.s3.redis]
          url = "{{ "{{" }}.url}}"
          key_prefix = "angos-lock-"
          ttl = 5

          [blob_store.s3]
          access_key_id = "{{ "{{" }}.s3_accessKey}}"
          secret_key = "{{ "{{" }}.s3_secretKey}}"
          endpoint = "{{ .Values.angos.s3Url }}"
          bucket = "angos"
          region = "us-east-"

          [metadata_store.s3]
          access_key_id = "{{ "{{" }}.s3_accessKey}}"
          secret_key = "{{ "{{" }}.s3_secretKey}}"
          endpoint = "{{ .Values.angos.s3Url }}"
          bucket = "angos"
          region = "us-east-"

          [auth.oidc.weebo]
          issuer = "{{ "{{" }}.AUTHENTIK_URL}}"
          required_audience = "{{ "{{" }}.AUTHENTIK_CLIENT_ID}}"
          required_claims = ["email"]
  data:
    - secretKey: url
      remoteRef:
        key: mv/angos/config
        property: url
    - secretKey: s3_accessKey
      remoteRef:
        key: mv/angos/s3
        property: accesskey
    - secretKey: s3_secretKey
      remoteRef:
        key: mv/angos/s3
        property: secretkey
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_CLIENT_ID
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_CLIENT_SECRET
    - secretKey: AUTHENTIK_URL
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_URL
{{- end -}}