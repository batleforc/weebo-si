{{- if .Values.angos.enabled -}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: angos-partial-conf
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: cred-store
    kind: SecretStore
  target:
    name: registry-credentials
    template:
      data:
        secrets.toml: |
          [cache.redis]
          url = "{{ "{{" }}.url}}"
          key_prefix = "angos-cache-"

          [metadata_store.s3.redis]
          url = "{{ "{{" }}.url}}"
          key_prefix = "angos-lock-"
          ttl = 5

          [blob_store.s3]
          access_key_id = "{{ "{{" }}.s3_accessKey}}"
          secret_key = "{{ "{{" }}.s3_secretKey}}"
          endpoint = "{{ .Values.angos.s3Url }}"
          bucket = "angos"
          region = "us-east-"

          [metadata_store.s3]
          access_key_id = "{{ "{{" }}.s3_accessKey}}"
          secret_key = "{{ "{{" }}.s3_secretKey}}"
          endpoint = "{{ .Values.angos.s3Url }}"
          bucket = "angos"
          region = "us-east-"

          [auth.oidc.weebo]
          issuer = "{{ "{{" }}.AUTHENTIK_URL}}"
          required_audience = "{{ "{{" }}.AUTHENTIK_CLIENT_ID}}"
          required_claims = ["email"]

          # Exchanges whatever credential authenticated the request for a
          # registry-signed token, advertised through the WWW-Authenticate of a
          # 401 and followed by OCI clients on their own. It exists because an
          # Authentik device-code token is short-lived while a `docker push` of
          # a large image is not: without it a push that outlives the token
          # dies mid-upload. Lives here rather than in config.toml because
          # secret_key is a secret.
          [auth.token_service]
          secret_key = "{{ "{{" }}.token_service_key}}"
          realm = "https://{{ .Values.angos.dns }}/token"
          ttl_secs = {{ .Values.angos.tokenService.ttlSecs }}
  data:
    - secretKey: url
      remoteRef:
        key: mv/angos/config
        property: url
    # Base64 of 32 random bytes, written by 2.terra/vault/terra-map/angos.tf.
    # angos refuses to start on anything shorter once decoded.
    - secretKey: token_service_key
      remoteRef:
        key: mv/angos/config
        property: token_service_key
    - secretKey: s3_accessKey
      remoteRef:
        key: mv/angos/s3
        property: accesskey
    - secretKey: s3_secretKey
      remoteRef:
        key: mv/angos/s3
        property: secretkey
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_CLIENT_ID
    - secretKey: AUTHENTIK_CLIENT_SECRET
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_CLIENT_SECRET
    - secretKey: AUTHENTIK_URL
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_URL
{{- end -}}