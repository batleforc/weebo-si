{{- if .Values.angos.enabled -}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: angos
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: angos
spec:
  entryPoints:
    - websecure
  routes:
{{- if .Values.angos.oauth2Proxy.enabled }}
    # One host serves both audiences, and the split below is what keeps them
    # apart. It cannot be done on paths alone: the web UI reads
    # `/v2/{ns}/manifests/...` and `/v2/{ns}/blobs/...`, the very paths a
    # `docker pull` uses. So the discriminator is the session cookie, which a
    # browser has after logging in and which no OCI client ever sends -- docker,
    # containerd, podman and skopeo neither store nor emit cookies.
    #
    # Priorities are explicit because Traefik otherwise orders routers by rule
    # length, which would put these in an order nobody chose. Higher wins.

    # 1. oauth2-proxy's own endpoints: the redirect to Authentik, the callback
    #    and sign-out. Nothing else answers under /oauth2/ and no registry
    #    client asks for it.
    - kind: Rule
      match: Host(`{{ .Values.angos.dns }}`) && PathPrefix(`/oauth2/`)
      priority: 100
      services:
        - name: angos-oauth2-proxy
          namespace: {{ .Release.Namespace }}
          port: 4180
          passHostHeader: true

    # 2. API calls that carry a browser session: the UI's own fetches. They go
    #    through the proxy so it can attach the ID token as a bearer, which is
    #    the only credential angos accepts from a browser.
    #
    #    Matched on a cookie NAME PREFIX, since oauth2-proxy splits an oversized
    #    session into `<name>_0`, `<name>_1`.
    - kind: Rule
      match: Host(`{{ .Values.angos.dns }}`) && PathPrefix(`/v2`) && HeaderRegexp(`Cookie`, `{{ .Values.angos.oauth2Proxy.cookieName }}`)
      priority: 90
      services:
        - name: angos-oauth2-proxy
          namespace: {{ .Release.Namespace }}
          port: 4180
          passHostHeader: true

    # 3. Registry clients, straight to angos, exactly as before this route
    #    existed: the 401 they get is angos' own Bearer challenge and the token
    #    dance that follows is untouched. `/token` is here unconditionally --
    #    the UI never calls it, only OCI clients do, and putting a login
    #    redirect in front of it would break `docker login` outright.
    - kind: Rule
      match: Host(`{{ .Values.angos.dns }}`) && (PathPrefix(`/v2`) || Path(`/token`) || Path(`/healthz`) || Path(`/readyz`) || Path(`/metrics`))
      priority: 50
      services:
        - name: angos
          namespace: {{ .Release.Namespace }}
          port: 8000
          passHostHeader: true

    # 4. Everything else is the UI itself: the SPA document and its assets.
    #    Always through the proxy, cookie or not -- this is where a browser with
    #    no session gets sent to Authentik. Routing it by cookie instead would
    #    serve the app anonymously and leave it stuck on a failed fetch, with
    #    no way to ever log in.
    - kind: Rule
      match: Host(`{{ .Values.angos.dns }}`)
      priority: 10
      services:
        - name: angos-oauth2-proxy
          namespace: {{ .Release.Namespace }}
          port: 4180
          passHostHeader: true
{{- else }}
    # oauth2-proxy off: one route, and the UI is unauthenticated-and-therefore-
    # useless, since angos grants a browser nothing without a credential.
    - kind: Rule
      match: Host(`{{ .Values.angos.dns}}`)
      priority: 10
      services:
        - name: angos
          namespace: {{ .Release.Namespace }}
          port: 8000
          passHostHeader: true
{{- end }}
  tls:
    secretName: angos-tls
{{- end -}}
