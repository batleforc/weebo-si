{{- if .Values.angos.enabled -}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: angos
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: angos
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.angos.dns}}`)
      priority: 10
      services:
        - name: angos
          namespace: {{ .Release.Namespace }}
          port: 8000
          passHostHeader: true
  tls:
    secretName: angos-tls
{{- end -}}