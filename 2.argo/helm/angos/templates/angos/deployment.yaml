{{- if .Values.angos.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: angos
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angos
  template:
    metadata:
      labels:
        app: angos
    spec:
      containers:
        - name: angos
          image: {{ .Values.angos.image.registry }}:{{ .Values.angos.image.tag }}
          args: ["-c", "/config/config.toml", "-c", "/secrets/secrets.toml", "server"]
          ports:
            - containerPort: 8000
          env:
            - name: RUST_LOG
              value: info
          {{- if .Values.angos.caTrust.enabled }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.angos.caTrust.mountPath .Values.angos.caTrust.bundleKey | quote }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: config-secret
              mountPath: /secrets
              readOnly: true
            {{- if .Values.angos.caTrust.enabled }}
            - name: weebo-ca
              mountPath: {{ .Values.angos.caTrust.mountPath | quote }}
              readOnly: true
          {{- end }}
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              memory: "150Mi"
              cpu: "100m"
            limits:
              memory: "500Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          secret:
            secretName: angos-config
        - name: config-secret
          secret:
            secretName: registry-credentials
        {{- if .Values.angos.caTrust.enabled }}
        - name: weebo-ca
          configMap:
            name: {{ .Values.angos.caTrust.bundleConfigMap | quote }}
            items:
              - key: {{ .Values.angos.caTrust.bundleKey | quote }}
                path: {{ .Values.angos.caTrust.bundleKey | quote }}
        {{- end }}
{{- end -}}