{{- if .Values.angos.enabled -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: angos
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: angos
  template:
    metadata:
      labels:
        app: angos
    spec:
      {{- if .Values.angos.kubeOidc.enabled }}
      # Its own identity, and the reason the pod's service-account token is
      # worth anything: the ClusterRoleBinding in rbac.yaml names THIS account,
      # and `[auth.oidc.kube]` reads the token this mounts.
      serviceAccountName: {{ .Values.angos.kubeOidc.serviceAccountName }}
      {{- end }}
      containers:
        - name: angos
          image: {{ .Values.angos.image.registry }}:{{ .Values.angos.image.tag }}
          args: ["-c", "/config/config.toml", "-c", "/secrets/secrets.toml", "server"]
          ports:
            - containerPort: 8000
          env:
            - name: RUST_LOG
              value: info
          {{- if .Values.angos.caTrust.enabled }}
            - name: SSL_CERT_FILE
              value: {{ printf "%s/%s" .Values.angos.caTrust.mountPath .Values.angos.caTrust.bundleKey | quote }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: config-secret
              mountPath: /secrets
              readOnly: true
            {{- if .Values.angos.caTrust.enabled }}
            - name: weebo-ca
              mountPath: {{ .Values.angos.caTrust.mountPath | quote }}
              readOnly: true
          {{- end }}
          startupProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 1
            failureThreshold: 3
            successThreshold: 1
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 1
            periodSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          resources:
            requests:
              memory: "150Mi"
              cpu: "100m"
            limits:
              memory: "500Mi"
          # ONE block, not two. This key used to be declared twice here and
          # YAML keeps the last occurrence, so everything in the first was
          # dropped in silence: the container ran with privilege escalation
          # allowed and a writable root filesystem, while git said otherwise.
          #
          # Verified on 1.7.1 before turning it back on -- a full push
          # (upload session, blob PUT, manifest PUT, tag list) succeeds with
          # all of this applied. angos writes nothing outside the store its
          # configuration names, which here is S3.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              # NET_BIND_SERVICE was in the dead block and is not restored:
              # the listener is on 8000 and the process is uid 1000, so there
              # is no port under 1024 to bind. The same push test passes
              # without it.
      volumes:
        - name: config
          secret:
            secretName: angos-config
        - name: config-secret
          secret:
            secretName: registry-credentials
        {{- if .Values.angos.caTrust.enabled }}
        - name: weebo-ca
          configMap:
            name: {{ .Values.angos.caTrust.bundleConfigMap | quote }}
            items:
              - key: {{ .Values.angos.caTrust.bundleKey | quote }}
                path: {{ .Values.angos.caTrust.bundleKey | quote }}
        {{- end }}
{{- end -}}