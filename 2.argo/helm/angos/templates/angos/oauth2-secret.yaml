{{- if and .Values.angos.enabled .Values.angos.oauth2Proxy.enabled -}}
---
# oauth2-proxy reads its whole configuration from flags except the four values
# that are secrets, and every flag has an OAUTH2_PROXY_<FLAG> environment
# variable -- so the keys below ARE the flag names and this Secret is consumed
# with a bare `envFrom`. No template block, unlike angos-partial-conf: nothing
# here is interpolated into a file.
#
# The client id and secret are the ones the Authentik operator writes for the
# `angos` application (2.argo/helm/auth/sub/values.yaml), the same credential
# `task angos:token` uses for the device grant. Reusing them is what keeps the
# browser and the CLI on one Authentik application, one issuer and one audience.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: angos-oauth2-proxy
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: cred-store
    kind: SecretStore
  target:
    name: angos-oauth2-proxy
  data:
    - secretKey: OAUTH2_PROXY_CLIENT_ID
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_CLIENT_ID
    # Unused by angos, which only ever verifies signatures -- but the
    # authorization-code exchange is a confidential-client call and needs it.
    - secretKey: OAUTH2_PROXY_CLIENT_SECRET
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_CLIENT_SECRET
    # The per-application issuer, `<instance>/application/o/angos/`. The same
    # value angos pins in `[auth.oidc.weebo].issuer`, from the same key, so the
    # two cannot drift apart.
    - secretKey: OAUTH2_PROXY_OIDC_ISSUER_URL
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_URL
    # Written by 2.terra/vault/terra-map/angos.tf.
    - secretKey: OAUTH2_PROXY_COOKIE_SECRET
      remoteRef:
        key: mv/angos/config
        property: oauth2_cookie_secret
{{- end -}}
