{{- if and .Values.angos.enabled .Values.angos.kubeOidc.enabled .Values.angos.kubeOidc.credentialProvider.enabled -}}
{{- $cp := .Values.angos.kubeOidc.credentialProvider -}}
---
# Holds nothing but the installer below, which is the point: the privilege it
# needs is declared here and reaches nothing else.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $cp.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    app.kubernetes.io/name: angos
    app.kubernetes.io/component: credential-provider
    # All three, not just `enforce`: the cluster default warns and audits at
    # `restricted`, so leaving them would log a paragraph about this pod on
    # every creation while admitting it anyway.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/warn: privileged
    pod-security.kubernetes.io/audit: privileged
---
# Installs the angos kubelet credential provider on every node, so the kubelet
# can pull from this registry with the service-account token of the pod it is
# starting instead of a shared imagePullSecret.
#
# It installs BOTH artifacts the kubelet needs, and it must run before the
# kubelet is given the flags that name them: a missing binary or a missing
# config file are each fatal to kubelet startup, not a degraded pull. On a
# single-node cluster that is the node. The flags live in
# 1.pulu-init/main.go (machine.kubelet.extraArgs) and are applied second, on
# purpose.
#
# It does NOT restart the kubelet, unlike the DaemonSet upstream ships: that
# one ends with `chroot /host systemctl restart kubelet`, and Talos has no
# systemd. The Talos machine-config apply that adds the flags restarts the
# kubelet by itself, which is exactly the restart this would have needed.
apiVersion: v1
kind: ConfigMap
metadata:
  name: angos-credential-provider-installer
  namespace: {{ $cp.namespace }}
data:
  # Written next to the binary rather than through Talos `machine.files`, so
  # both artifacts land in one place, from one source, at one time.
  #
  # `name` has to equal the binary's filename in the bin dir: that is how the
  # kubelet resolves which plugin to exec. `matchImages` decides which pulls
  # reach the plugin and `--registry` decides which ones leave with a token;
  # both are pinned to this registry, so a widened matchImages cannot leak a
  # token to another host.
  config.yaml: |
    apiVersion: kubelet.config.k8s.io/v1
    kind: CredentialProviderConfig
    providers:
      - name: angos-credential-provider
        apiVersion: credentialprovider.kubelet.k8s.io/v1
        matchImages:
          - {{ .Values.angos.dns | quote }}
        # The credential IS the token, so there is nothing to cache beyond its
        # own life; the plugin caches for the token's remaining validity minus
        # a minute, which is what spares a pod pulling five images five plugin
        # runs.
        defaultCacheDuration: "0s"
        args:
          - "--provider"
          # The `[auth.oidc.<name>]` section angos validates these tokens
          # against, and the Basic username the plugin returns.
          - "kube"
          - "--registry"
          - {{ .Values.angos.dns | quote }}
        tokenAttributes:
          # Must equal `required_audience` in that same section, or the
          # apiserver mints a token angos refuses.
          serviceAccountTokenAudience: {{ .Values.angos.kubeOidc.audience | quote }}
          cacheType: Token
          requireServiceAccount: true

  install.sh: |
    #!/bin/sh
    set -eu

    case "$(uname -m)" in
      x86_64)  asset="angos-credential-provider-linux-amd64"; expected="$SHA256_AMD64" ;;
      aarch64) asset="angos-credential-provider-linux-arm64"; expected="$SHA256_ARM64" ;;
      *) echo "unsupported architecture $(uname -m)" >&2; exit 1 ;;
    esac

    # No checksum, no install. A binary the kubelet execs on every pull is not
    # something to fetch on trust.
    if [ -z "$expected" ]; then
      echo "no checksum configured for $asset; refusing to install it unverified" >&2
      exit 1
    fi

    mkdir -p "/host${BIN_DIR}"

    # The config first and every run: it is cheap, it is small, and the kubelet
    # refuses to start without it once the flags name it.
    cp /script/config.yaml "/host${BIN_DIR}/config.yaml.new"
    chmod 0644 "/host${BIN_DIR}/config.yaml.new"
    mv "/host${BIN_DIR}/config.yaml.new" "/host${BIN_DIR}/config.yaml"

    target="/host${BIN_DIR}/angos-credential-provider"
    installed=""
    if [ -f "$target" ]; then
      installed="$(sha256sum "$target" | cut -d' ' -f1)"
    fi
    if [ "$installed" = "$expected" ]; then
      echo "$target is already ${VERSION}"
      exit 0
    fi

    work="$(mktemp -d)"
    trap 'rm -rf "$work"' EXIT
    wget -qO "$work/$asset" \
      "https://github.com/project-angos/angos/releases/download/${VERSION}/${asset}"
    echo "$expected  $asset" | (cd "$work" && sha256sum -c -)

    # Installed beside the target and renamed: a pull racing the write never
    # sees a half-written plugin.
    install -m 0755 "$work/$asset" "$target.new"
    mv "$target.new" "$target"
    echo "installed ${VERSION}; the kubelet picks it up on its next start"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: angos-credential-provider-installer
  namespace: {{ $cp.namespace }}
  labels:
    app.kubernetes.io/name: angos
    app.kubernetes.io/component: credential-provider
spec:
  selector:
    matchLabels:
      app: angos-credential-provider-installer
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: angos-credential-provider-installer
    spec:
      # No `system-node-critical` here, unlike upstream: the two critical
      # classes are reserved for kube-system and rejected anywhere else.
      # Nothing on this node competes for the scheduling anyway.
      automountServiceAccountToken: false
      tolerations:
        - operator: Exists
      initContainers:
        - name: install
          image: {{ $cp.installerImage | quote }}
          command: ["/bin/sh", "/script/install.sh"]
          env:
            - name: VERSION
              value: {{ $cp.version | quote }}
            - name: SHA256_AMD64
              value: {{ $cp.sha256.amd64 | quote }}
            - name: SHA256_ARM64
              value: {{ $cp.sha256.arm64 | quote }}
            - name: BIN_DIR
              value: {{ $cp.binDir | quote }}
          securityContext:
            # Writes into a host directory the kubelet owns. This is the whole
            # reason the DaemonSet exists, and the only container that holds
            # it: the one below keeps the pod scheduled and touches nothing.
            privileged: true
          volumeMounts:
            - name: host
              mountPath: /host
            - name: script
              mountPath: /script
              readOnly: true
      containers:
        - name: idle
          image: {{ $cp.installerImage | quote }}
          command: ["/bin/sh", "-c", "trap 'exit 0' TERM; sleep infinity & wait"]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
      volumes:
        - name: host
          hostPath:
            path: /
        - name: script
          configMap:
            name: angos-credential-provider-installer
            defaultMode: 0755
{{- end -}}
