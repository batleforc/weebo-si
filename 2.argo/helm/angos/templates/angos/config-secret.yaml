{{- if .Values.angos.enabled -}}
---
kind: Secret
apiVersion: v1
metadata:
  name: angos-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.toml: |
    [server]
    bind_address = "0.0.0.0"
    bind_port = 8000

    [ui]
    enabled = true
    name = "Weebo Registry"

    # [server.tls]
    # TLS is terminated by the ingress controller

    [[repository."hub".upstream]]
    url = "https://registry-1.docker.io"

    # `default = "allow"` and NOT `default_allow = true`: angos ignores an
    # unknown key silently, and a repository that declares an access_policy
    # table with nothing angos recognises is a policy with no rules and the
    # default deny -- which locked this proxy down completely.
    #
    # "allow" here does not mean anonymous: the global policy below is
    # evaluated FIRST and on every request, and a repository policy can only
    # narrow it further. This says "nothing beyond the global rules".
    [repository."hub".access_policy]
    default = "allow"

    [[repository."ghcr".upstream]]
    url = "https://ghcr.io"

    [repository."ghcr".access_policy]
    default = "allow"

    [global.access_policy]
    default = "deny"
    # Every rule is keyed on `identity.oidc`, not on `identity.username`. The
    # OIDC middleware sets ONLY `identity.oidc` -- a token that authenticates
    # perfectly still leaves username null -- so username rules never matched
    # anything here and silently denied every authenticated pull.
    #
    # The three ways in all end up in the same place:
    #   - `docker login` with a device-grant ID token (task angos:login),
    #   - the registry token `/token` mints from it, which carries the original
    #     claims back into the identity,
    #   - the browser, whose ID token oauth2-proxy attaches as a bearer.
    rules = [
      # Allow UI assets to load (required). Anonymous on purpose: this is the
      # SPA shell and its name, and it has to reach a browser that has not
      # logged in yet or there is nothing to log in from.
      "request.action == 'ui-asset' || request.action == 'ui-config'",

      # Pull, and the manifest/blob reads the UI's detail views make. Listed
      # one by one rather than as `startsWith('get-')`: that would hand out
      # `get-api-version` too, and a 200 there makes Docker drop credentials
      # from every later request, pushes included.
      """identity.oidc != null && request.action in [
        'get-api-version', 'get-manifest', 'get-blob', 'get-referrers',
        'list-tags', 'list-catalog']""",

      # Browsing: the repository, namespace, revision, upload and job lists
      # behind the UI's views.
      "identity.oidc != null && request.action.startsWith('list-')",

      # Push. `mount-blob` is the cross-repository shortcut a `docker push`
      # takes for a layer another namespace already holds; without it the push
      # still works, it just re-uploads.
      """identity.oidc != null && request.action in [
        'start-upload', 'update-upload', 'complete-upload', 'cancel-upload',
        'get-upload', 'mount-blob', 'put-manifest']""",

      # /token is evaluated like any other route, so `[auth.token_service]`
      # is inert without this. Tests `identity.oidc`, not `identity.username`:
      # the OIDC path leaves username null.
      "request.action == 'get-token' && identity.oidc != null",

      # Destructive actions, restricted to a named human. Last on purpose: an
      # ID token with no `email` would make this rule throw, and a throw stops
      # evaluation as deny -- harmless once every rule that could have allowed
      # the request has already run. `required_claims = ["email"]` on the
      # provider makes that unreachable anyway.
      '''identity.oidc != null && identity.oidc.claims["email"] == "max@weebo.poc" && request.action in [
        "delete-manifest", "delete-blob", "retry-job", "delete-job"]'''
    ]
{{- end -}}
