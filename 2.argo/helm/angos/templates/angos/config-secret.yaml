{{- if .Values.angos.enabled -}}
---
kind: Secret
apiVersion: v1
metadata:
  name: angos-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.toml: |
    [server]
    bind_address = "0.0.0.0"
    bind_port = 8000

    [ui]
    enabled = true
    name = "Weebo Registry"

    # [server.tls]
    # TLS is terminated by the ingress controller

    [[repository."hub".upstream]]
    url = "https://registry-1.docker.io"

    [repository."hub".access_policy]
    default = "allow"

    [[repository."ghcr".upstream]]
    url = "https://ghcr.io"

    [repository."ghcr".access_policy]
    default = "allow"

    [global.access_policy]
    default = "deny"
    rules = [
      "request.action == 'ui-asset' || request.action == 'ui-config'",
      """identity.oidc != null && request.action in [
        'get-api-version', 'get-manifest', 'get-blob', 'get-referrers',
        'list-tags', 'list-catalog']""",
      "identity.oidc != null && request.action.startsWith('list-')",
      """identity.oidc != null && request.action in [
        'start-upload', 'update-upload', 'complete-upload', 'cancel-upload',
        'get-upload', 'mount-blob', 'put-manifest']""",
      "request.action == 'get-token' && identity.oidc != null",

      '''identity.oidc != null && "groups" in identity.oidc.claims && "weebo_admin" in identity.oidc.claims["groups"] && request.action in [
        "delete-manifest", "delete-blob", "retry-job", "delete-job"]'''
    ]
{{- end -}}
