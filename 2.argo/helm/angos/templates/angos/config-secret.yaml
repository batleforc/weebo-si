{{- if .Values.angos.enabled -}}
---
kind: Secret
apiVersion: v1
metadata:
  name: angos-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.toml: |
    [server]
    bind_address = "0.0.0.0"
    bind_port = 8000
    
    [ui]
    enabled = true
    name = "Weebo Registry"

    # [server.tls]
    # TLS is terminated by the ingress controller

    [[repository."hub".upstream]]
    url = "https://registry-1.docker.io"

    [repository."hub".access_policy]
    default_allow = true

    [[repository."ghcr".upstream]]
    url = "https://ghcr.io"

    [repository."ghcr".access_policy]
    default_allow = true

    [global.access_policy]
    default = "deny"
    rules = [
      # Allow UI assets to load (required)
      "request.action == 'ui-asset' || request.action == 'ui-config'",

      # Allow authenticated users to browse
      "identity.username != null && request.action.startsWith('list-')",

      # Allow reading manifests
      "identity.username != null && request.action == 'get-manifest'",

      # Restrict deletion to admins
      "identity.username == 'admin' && request.action == 'delete-manifest'"
    ]
{{- end -}}