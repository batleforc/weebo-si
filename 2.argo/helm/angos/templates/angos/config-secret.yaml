{{- if .Values.angos.enabled -}}
{{- $verbs := include "angos.access.verbs" . | fromYaml -}}
---
kind: Secret
apiVersion: v1
metadata:
  name: angos-config
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  config.toml: |
    [server]
    bind_address = "0.0.0.0"
    bind_port = 8000

    [ui]
    enabled = true
    name = "Weebo Registry"

    # [server.tls]
    # TLS is terminated by the ingress controller
{{- if .Values.angos.kubeOidc.enabled }}

    [auth.oidc.kube]
    issuer = "{{ .Values.angos.kubeOidc.issuer }}"
    required_audience = "{{ .Values.angos.kubeOidc.audience }}"
    server_ca_bundle = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
{{- end }}
{{- range $name, $repo := .Values.angos.repositories }}

    [repository.{{ $name | quote }}]
{{- range $repo.upstreams }}

    [[repository.{{ $name | quote }}.upstream]]
    url = {{ . | quote }}
{{- end }}

    [repository.{{ $name | quote }}.access_policy]
    default = "deny"
    rules = [
{{- range $verb, $actions := $verbs }}
{{- with index ($repo.access | default dict) $verb }}
      '{{ include "angos.access.rule" (dict "subjects" . "actions" $actions) }}',
{{- end }}
{{- end }}
    ]
{{- end }}

    [global.access_policy]
    default = "deny"
    rules = [
      "request.action == 'ui-asset' || request.action == 'ui-config'",
      'identity.oidc != null && request.action in ["get-api-version", "get-token"]',
      '{{ include "angos.access.rule" (dict "subjects" .Values.angos.policy.browse "actions" (list "list-catalog" "list-repositories" "list-namespaces")) }}',
      '{{ include "angos.access.rule" (dict "subjects" .Values.angos.policy.jobs "actions" (list "list-jobs" "list-failed-jobs" "retry-job" "delete-job")) }}',
      "has_repository_policy()"
    ]
{{- end -}}
