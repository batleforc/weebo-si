{{- $o := .Values.operator -}}
{{- if and .Values.angos.enabled $o.enabled -}}
---
# weebo-angos, from the chart its repository publishes: CRDs, the operator,
# its admission webhook and the webhook's certificate, from a self-signed
# Issuer the chart creates -- cert-manager is already there. Same shape as
# weebo-forgejo in 2.argo/helm/forgejo.
#
# Limited to this chart's namespace (`watch.namespace`): the instance's
# objects (Deployment, Service, Jobs, its config Secrets) are only writable
# there, through a Role. Secrets are still read through the ClusterRole
# (`clusterSecrets`), and an instance's pods only ever mount the ones
# labelled `angos.weebo.io/credential: "true"`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weebo-angos
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    chart: {{ $o.chart.name }}
    repoURL: {{ $o.chart.repoURL }}
    targetRevision: {{ $o.chart.version }}
    helm:
      releaseName: weebo-angos
      valuesObject:
        replicaCount: {{ $o.replicaCount }}
        podDisruptionBudget:
          enabled: {{ gt (int $o.replicaCount) 1 }}
        watch:
          namespace: {{ .Release.Namespace }}
        managedInstances:
          allowedImages:
            - {{ .Values.angos.image.registry }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: {{ $o.namespace }}
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    automated:
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end -}}
