{{- $o := .Values.operator -}}
{{- if and .Values.angos.enabled $o.enabled -}}
{{- range $name, $repo := .Values.angos.repositories }}
---
# `angos.repositories.{{ $name }}`: same prefix byte for byte, so the operator
# serves the namespaces the chart's Deployment wrote. Same subject vocabulary
# as the chart's `access`.
apiVersion: angos.weebo.io/v1alpha1
kind: AngosRepository
metadata:
  name: {{ $name | replace "/" "-" }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instanceRef:
    name: {{ $o.instance.name }}
  prefix: {{ $name | quote }}
  {{- with $repo.upstreams }}
  upstreams:
    {{- range . }}
    - url: {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- with $repo.retention }}
  retention:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $scan := and $.Values.angos.scanner.enabled $repo.scan }}
  {{- if $scan }}
  scan:
    rules:
      {{- toYaml (required "angos.scanner.rules" $.Values.angos.scanner.rules) | nindent 6 }}
  {{- end }}
  access:
    {{- range $verb := list "pull" "browse" "push" "delete" }}
    {{- $subjects := index ($repo.access | default dict) $verb | default list }}
    {{- if and $scan (eq $verb "pull") }}
    {{- /* The scanner pulls back what it analyses. */}}
    {{- $subjects = append $subjects (printf "identity:%s" ($.Values.angos.scanner.username | default "scanner")) }}
    {{- end }}
    {{ $verb }}: {{ $subjects | toJson }}
    {{- end }}
{{- end }}
{{- end -}}
