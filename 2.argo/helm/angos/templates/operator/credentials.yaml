{{- $o := .Values.operator -}}
{{- if and .Values.angos.enabled $o.enabled -}}
---
# What the instance reads, as plain keys: the operator writes them into
# config.toml itself, where the chart templated a whole secrets.toml
# (templates/angos/secret.yaml). Same Vault paths, so the same store, the same
# cache and the same token-service key -- a token minted by the chart's
# Deployment validates on the operator's.
#
# The label is what lets the instance's pods mount it: they read no other
# Secret of the namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $o.instance.credentialsSecret }}
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    name: cred-store
    kind: SecretStore
  target:
    name: {{ $o.instance.credentialsSecret }}
    template:
      metadata:
        labels:
          angos.weebo.io/credential: "true"
  data:
    - secretKey: access-key-id
      remoteRef:
        key: mv/angos/s3
        property: accesskey
    - secretKey: secret-key
      remoteRef:
        key: mv/angos/s3
        property: secretkey
    - secretKey: redis-url
      remoteRef:
        key: mv/angos/config
        property: url
    # Base64 of 32 random bytes, written by 2.terra/vault/terra-map/angos.tf.
    - secretKey: token-key
      remoteRef:
        key: mv/angos/config
        property: token_service_key
    - secretKey: AUTHENTIK_URL
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_URL
    - secretKey: AUTHENTIK_CLIENT_ID
      remoteRef:
        key: mv/angos/auth
        property: AUTHENTIK_CLIENT_ID
{{- end -}}
