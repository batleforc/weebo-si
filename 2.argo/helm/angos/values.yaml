repo: ""
project: ""
branch: ""

angos:
  enabled: true
  s3Url: "https://s3-main.weebo.poc"
  image:
    registry: ghcr.io/project-angos/angos
    tag: 1.7.1
  dns: registry.pkg.weebo.poc
  # `[auth.token_service]`, whose secret_key comes from Vault and whose realm
  # is built from `dns` above. The ceiling angos enforces is 86400.
  tokenService:
    ttlSecs: 3600
  # Browser SSO for the web UI. angos itself has no login flow of any kind: the
  # UI is a Svelte app with no auth code, and the server only ever reads an
  # `Authorization` header or a client certificate -- never a cookie. With
  # `[auth.token_service]` configured every 401 answers with a Bearer
  # challenge, which no browser knows how to satisfy either, so a browser
  # identity has to be handed to angos by something in front of it.
  #
  # oauth2-proxy is that something: it runs the authorization-code flow against
  # the SAME Authentik application `docker login` uses, then forwards the ID
  # token as `Authorization: Bearer`. angos validates it with the
  # `[auth.oidc.weebo]` block it already has -- same issuer, same audience --
  # so the browser and the CLI end up as the same kind of identity and one set
  # of CEL rules covers both.
  #
  # It is NOT on the path of `docker` or the kubelet: the IngressRoute only
  # sends a request through it when the request carries this proxy's session
  # cookie, or when it is not an API path at all. See templates/angos/ingress.yaml.
  oauth2Proxy:
    enabled: true
    image:
      registry: quay.io/oauth2-proxy/oauth2-proxy
      # renovate: datasource=docker depName=quay.io/oauth2-proxy/oauth2-proxy
      tag: v7.15.4
    # The cookie the ingress splits on, so a rename here is a rename in the
    # IngressRoute rule -- they are read from the same value on purpose.
    # oauth2-proxy chunks oversized cookies into `<name>_0`, `<name>_1`, which
    # is why the rule matches a prefix rather than an exact name.
    cookieName: _angos_ui
    # Must stay UNDER the Authentik provider's access-token validity, which is
    # `hours=1` on this instance (read off the API, not the documented
    # default): past it the ID token in the session is expired and angos
    # rejects it. Below that, oauth2-proxy silently swaps in a fresh one using
    # the refresh token, which is what `offline_access` in the provider's
    # property mappings is for. Half the validity leaves room for a refresh
    # that fails once.
    cookieRefresh: 30m
    # How long a browser session survives without re-authenticating at all.
    cookieExpire: 8h
    # A page that hands the logged-in user their own ID token, so a `docker
    # login` needs neither the Vault client secret `task angos:token` reads nor
    # a device-code round trip. Served by oauth2-proxy itself from a ConfigMap
    # (`--upstream=file://`), so it costs no deployment and no image.
    #
    # It works because `--set-authorization-header` makes /oauth2/auth answer
    # with `Authorization: Bearer <id_token>`, which same-origin JavaScript can
    # read. That flag also echoes the header on every proxied response, so the
    # token is readable by any script running on this origin. That is not a new
    # exposure -- a page whose purpose is to hand the token to JavaScript has
    # already accepted it -- but it is the reason this is a flag you can turn
    # off rather than something always on.
    tokenPage:
      enabled: true
      # Trailing slash required: oauth2-proxy maps a file upstream onto a path
      # PREFIX. `/token` (no slash) is angos' own token endpoint, hence a name
      # that cannot be mistaken for it.
      path: /me/

    # CIDRs allowed to set X-Forwarded-*. Empty means every caller is believed,
    # which oauth2-proxy warns about at startup: the redirect URL is pinned
    # above so a spoofed header cannot move the login anywhere, but it can lie
    # about the client IP in the logs. Set it to the pod CIDR (Traefik is the
    # only legitimate caller of this Service) to close that.
    trustedProxyCidrs: []

  # Lets a workload authenticate with the projected service-account token the
  # cluster already mints for it, instead of a static imagePullSecret that
  # never expires and lives in git or Vault.
  #
  # A pod calling angos itself (ORAS, a CI job, anything reading its own token
  # off disk) works with only what is below. An image PULL does not: the
  # kubelet pulls before the pod filesystem exists, so it needs a credential
  # provider plugin installed on every node and named in the kubelet config.
  # On Talos that is a machine-config change, not something this repo can make.
  kubeOidc:
    enabled: true
    # The `iss` of a projected token on THIS cluster, read off
    # /.well-known/openid-configuration -- and NOT the
    # "https://kubernetes.default.svc" the upstream doc shows, which is only
    # right for a cluster whose --service-account-issuer says so. A mismatch
    # here is silent: tokens simply never validate.
    #
    # It is the apiserver's advertised address, which is also the single
    # endpoint behind the in-cluster `kubernetes` Service, so angos reaches it
    # over the same path a pod always uses. Its certificate verifies against
    # the cluster CA below.
    issuer: "https://37.187.255.5:6443"
    # What a workload must ask for in `serviceAccountToken.audience`, and what
    # angos requires: a token minted for the apiserver itself is rejected.
    audience: angos
    # Reading the cluster's JWKS takes the system:service-account-issuer-discovery
    # role -- both discovery endpoints answer 401 to an anonymous caller here,
    # measured. Rather than granting that role to system:unauthenticated, which
    # publishes the signing keys to anyone who can reach the apiserver, angos
    # gets an identity of its own and presents its own service-account token.
    serviceAccountName: angos
    # The node half: the kubelet pulls before the pod filesystem exists, so it
    # cannot read a projected token and asks a credential provider plugin
    # instead. This installs that plugin; `machine.kubelet.extraArgs` in
    # 1.pulu-init/main.go points the kubelet at it.
    #
    # ORDER MATTERS AND IS NOT RECOVERABLE BY RETRY. A kubelet given
    # --image-credential-provider-config or --image-credential-provider-bin-dir
    # refuses to START when the file or the binary they name is missing, so
    # this DaemonSet has to have run on every node before that machine config
    # is applied. On this cluster that node is also the control plane.
    #
    # Verify before applying the Pulumi change:
    #   task t -- -n <node> list /var/lib/kubelet/credential-providers
    credentialProvider:
      enabled: true
      # Its own namespace, and not by taste. Talos ships an AdmissionConfiguration
      # that enforces the `baseline` Pod Security level cluster-wide, exempting
      # only kube-system, and baseline forbids both hostPath volumes and a
      # privileged container:
      #   pods "..." is forbidden: violates PodSecurity "baseline:latest":
      #   hostPath volumes (volume "host"), privileged (container "install" ...)
      # A namespace label overrides that default, so the exception is written
      # where it applies and covers one installer instead of the registry, the
      # proxy and the maintenance jobs that share the `angos` namespace.
      #
      # `kubectl apply --dry-run=server` only reported the `restricted` WARNING
      # here, never the `baseline` refusal, so a clean dry run says nothing
      # about admission on this cluster.
      namespace: angos-node
      # Pinned to the registry's own version: the plugin and the server speak
      # the same `[auth.oidc]` section names, and upstream calls this contrib
      # binary experimental, so drifting them apart buys nothing.
      # renovate: datasource=github-releases depName=project-angos/angos
      version: v1.7.1
      # sha256 of the release asset, checked against the cosign bundle
      # published beside it (keyless, identity project-angos/angos): the
      # installer refuses to write a binary it cannot match.
      sha256:
        amd64: "abefdd7eadc16ebe54a9632efef095650d29e7008d36e8d27f7233b258e6732b"
        # Left empty on purpose: every node here is amd64, and an unchecked
        # arm64 install would be a download on trust. Fill it before adding an
        # arm64 node, or that node's installer fails loudly.
        arm64: ""
      # Under /var, which Talos mounts `rw,nosuid,nodev` with NO `noexec` --
      # verified on the node, and the reason this needs no Talos system
      # extension. The blessed path, /usr/local/lib/kubelet/credentialproviders,
      # is baked into the image and would mean building an installer image and
      # rebooting.
      binDir: /var/lib/kubelet/credential-providers
      installerImage: "alpine:3.22"

  # Storage maintenance, as two CronJobs. Not optional in practice: a delete
  # answers 202 and removes the RECORD, leaving the blob bytes in the bucket
  # until a scrub sweep reclaims them. Without this the S3 bill only grows.
  #
  # Both commands are designed to run against a live server -- no shutdown, no
  # read-only window. Scrub confirms an inconsistency on a re-read before
  # repairing it and age-gates every reclaim behind `gc_grace_secs`, so a push
  # in flight reads as live rather than as garbage.
  maintenance:
    enabled: true
    # Kubernetes reads `schedule` as UTC unless a zone is named here (a tzdata
    # name, "Europe/Paris"). Left empty because 03:00 UTC is already the quiet
    # hour for this cluster, and a DST-shifting zone makes "did it run?" harder
    # to answer than it is worth.
    timeZone: ""
    jobs:
      # Structural: walks every key in both stores, repairs derivable state,
      # reclaims orphan blobs, and quarantines what it does not recognise into
      # `_lost_and_found/` rather than deleting it. Inspect that prefix after a
      # version bump -- an upgrade is exactly when a key shape it has never
      # seen shows up. `--delete-unknown` exists and is not set on purpose.
      #
      # Run it from the same angos version as the server, which the shared
      # `image.tag` above guarantees.
      scrub:
        enabled: true
        schedule: "0 3 * * *"
        # e.g. ["--dry-run"] to see a run before trusting it, or
        # ["--concurrency", "32"] once the store is large.
        args: []
      # Config and time: enforces retention policies, clears namespaces no
      # `[repository]` owns any more, and reclaims upload-lifecycle leftovers
      # older than its window (`-u`, default 1h -- raise it above the longest
      # push you expect, since it is what shields an in-flight one).
      #
      # After scrub, not before, mirroring upstream: prune makes decisions
      # about a store scrub has already made consistent, and the grace gate
      # means bytes it frees are reclaimed by the next night's scrub anyway.
      prune:
        enabled: true
        schedule: "30 3 * * *"
        args: []

  # The internal CA, mounted beside the system store rather than over
  # /etc/ssl/certs the way the `inject-certs` Kyverno policy does: angos has to
  # reach s3-main.weebo.poc (signed by the internal CA) as well as
  # registry-1.docker.io / ghcr.io (public roots), and the Bundle carries both.
  caTrust:
    enabled: true
    # The trust-manager Bundle's ConfigMap target, replicated into every
    # namespace. The file lands at <mountPath>/<bundleKey>.
    bundleConfigMap: weebo.poc
    bundleKey: main-ca.crt
    mountPath: /etc/ssl/weebo
