# The OIDC client secret of the `endpoint-gateway` Authentik application.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.clientSecret.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: weebo-si-hardening-vault
  # ESO's defaults, written out: left implicit, the controller fills them in
  # and Argo reports the ExternalSecret OutOfSync forever.
  target:
    name: {{ .Values.clientSecret.name }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ .Values.clientSecret.key }}
      remoteRef:
        key: {{ .Values.clientSecret.vaultKey }}
        property: {{ .Values.clientSecret.vaultProperty }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
