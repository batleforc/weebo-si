# Vault access for weebo-si-hardening, as every other namespace does it: the
# auth-read role (bound to `default` here in 2.terra/vault/terra-map/
# auth-base.tf) reads mv/weebo-si-hardening/* only.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: weebo-si-hardening-vault
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    external-secrets.io/disable-maintenance-checks: "true"
spec:
  provider:
    vault:
      server: "https://openbao.vault:8200"
      path: "mv"
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "auth-read"
          serviceAccountRef:
            name: "default"
