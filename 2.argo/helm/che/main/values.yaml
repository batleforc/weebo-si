che:
  enabled: true
  namespace: eclipse-che
  cheApp:
    enabled: true
  cheAppBis:
    enabled: true
  ingress:
    enabled: true
    host: cde.dev.weebo.poc
  # Forgejo as a Che git service (forked che-operator/che-server/dashboard),
  # for che.forgejo.endpoint (sub/values.yaml, git.weebo.poc, with OAuth) and
  # che.forgejo.secondEndpoint (git.batleforc.fr, anonymous and PAT only).
  #   enabled  che-server recognises its URLs as Forgejo: devfiles of public
  #            repositories are read anonymously, like GitHub's; a private
  #            one needs a Forgejo PAT added in the dashboard (User
  #            Preferences > Personal Access Tokens). No OAuth app needed.
  #   oauth    also "sign in with Forgejo", which mints the token itself.
  #            The OAuth2 application (redirect URI
  #            https://<che host>/api/oauth/callback) is a
  #            ForgejoOAuth2Application of 2.argo/helm/forgejo
  #            (operator.oauth2Applications.che), which writes its
  #            credentials to Vault at mv/eclipse-che/forgejo.
  forgejo:
    enabled: true
    oauth: true
  # The IDEs the dashboard offers. Passed to sub (CheCluster) and sub-bis
  # (editor ConfigMap). Whatever is offered, imagePolicy still decides which
  # images run: a house editor's images go through angos
  # (registry.pkg.weebo.poc) or weebodevimage.
  editors:
    # <publisher>/<name>/<version> preselected when creating a workspace.
    # Must be a shipped house editor or an upstream one left visible.
    default: weebo/che-code/latest
    # House editors: one devfile per file in 2.argo/helm/che/sub-bis/editors/,
    # keyed by file name without .yaml. true ships it, false keeps it out.
    # Every file there must be listed (the render fails otherwise), so a new
    # IDE is: drop editors/<name>.yaml, add `<name>: true` here.
    custom:
      che-code-angos: true # weebo/che-code/latest
      che-code-insiders-weebo: true # weebo/che-code-weebo/next
      che-code-fast-weebo: true # weebo/che-code-fast/latest
      che-code-external-node-weebo: true # weebo/che-code-external-node/latest
      # che-incubator editors served through angos (header of each file).
      che-web-terminal: true # weebo/che-web-terminal/latest
      che-herdr: true # weebo/che-herdr/latest
      che-orca: true # weebo/che-orca/next
      che-chemuxer: true # weebo/che-chemuxer/next
      che-code-server: true # weebo/che-code-server/latest
      che-code-sshd: true # weebo/che-code-sshd/next
    # The che-incubator editors che-operator ships (list: sub/values.yaml
    # che.editors.upstream.known). Hidden from the picker only: a
    # che-editor.yaml naming one still resolves, and imagePolicy refuses
    # its quay.io images.
    upstream:
      # true: hide every known upstream editor except `show`.
      # false: hide only `hide`.
      hideAll: true
      show: []
      hide: []
  # Root CA injected into che-server (and, through `ca-certs-merged`, into
  # workspaces) so it trusts the internal PKI -- authentik's issuer above all.
  # Rendered as a trust-manager Bundle in sub-bis; `name` is both the Bundle and
  # the ConfigMap it writes into the Che namespace, `key` the file name the
  # certificate gets under /public-certs.
  caBundle:
    enabled: true
    name: che-custom-ca-certificates
    key: custom-ca-certificates.pem
    # In cert-manager, where trust-manager reads its sources; created by the
    # ingress chart's ExternalSecret from mv/cert-manager/config.
    sourceSecret: main-ca.crt
  operator:
    # The che-operator image (weebo-si fork) is pinned in
    # 2.argo/helm/che/operator/kustomization.yaml (`images:`).
    devworkspace:
      repoURL: https://github.com/devfile/devworkspace-operator
      # renovate: datasource=github-tags depName=devfile/devworkspace-operator
      version: v1.1.1
  # weebo-si-operator from batleforc/weebo-si-hardening, pulled as an OCI chart.
  # The chart version is also the image tag (appVersion).
  hardening:
    enabled: true
    namespace: weebo-si-hardening
    ## renovate: datasource=docker depName=ghcr.io/batleforc/charts/weebo-si-operator
    version: 0.6.0
    # 1 = no HA (no webhook during a drain, see hardening-operator.yaml).
    replicas: 1
    # WeeboSiConfig/Team/User, rendered by 2.argo/helm/che/hardening and
    # managed from its values.yaml.
    config:
      enabled: true
    # endpoint-gateway (templates/endpoint-gateway.yaml), same release as
    # the operator (version above). Deployed, not linked: see that file.
    endpointGateway:
      enabled: true
      replicas: 1
      # Its own sign-in host; must match the redirect URI of the
      # `endpoint-gateway` Authentik application (2.argo/helm/auth).
      host: endpoint-auth.cde.dev.weebo.poc
    # weebo-si-operator chart values that gate a feature: the RBAC it needs
    # and the failurePolicy of its webhooks. Merged into the operator
    # Application, and passed to the config chart, which refuses to render
    # a feature enabled in 2.argo/helm/che/hardening/values.yaml whose switch
    # here is off. Each feature's own settings live there, not here.
    operator:
      # features.identity: AuthentikUser cluster-wide, Applications in
      # argoNamespace only (must match identity.che.applicationNamespace).
      identity:
        rbac:
          enabled: true
        argoNamespace: argocd
      # features.networkProfiles with the Cilium backend (and policyGuard
      # over CiliumNetworkPolicy). On: Cilium serves ciliumnetworkpolicies,
      # and without the RBAC the operator logs the backend as absent. Grants
      # the watch only; the feature itself stays off in the config chart.
      networkProfiles:
        cilium:
          enabled: true
      # features.policyGuard: Fail is the safe default; Ignore only once no
      # user can write networkpolicies (true of every access level today).
      policyGuard:
        failurePolicy: Fail
      # features.imagePolicy's Pod webhook (the DevWorkspace one is always
      # Fail). Fail: no workspace pod is (re)created while the operator is
      # down, a node drain included.
      imagePolicy:
        podWebhook:
          failurePolicy: Fail
      # features.kubearmorPolicy: KubeArmor runs (2.argo/helm/kubearmor).
      kubearmorPolicy:
        rbac:
          enabled: true
      # features.registryConfig: create/update/delete on secrets
      # cluster-wide (read RFC 0007's Security considerations first).
      registryConfig:
        rbac:
          enabled: false
        failurePolicy: Ignore
      # features.podSecurity (RFC 0013): patch on namespaces, for the
      # pod-security.kubernetes.io/* labels. On with the feature in DryRun;
      # run the pods audit before Enforce.
      podSecurity:
        rbac:
          enabled: true
      # features.podIdentity (RFC 0018): registers the two Pod webhooks
      # (Fail, workspace namespaces). Two commits, never one: an upgrade that
      # registers them while the old pods still answer 404 refuses every
      # workspace pod for the length of the roll. So true only once the
      # release runs, and before the feature's DryRun (they answer in every
      # mode, Off included). Back to false before any chart downgrade.
      podIdentity:
        webhooks:
          enabled: true
      # features.teamTools (RFC 0020): unbound ClusterRoles, template
      # namespace and CA guard. Off until probe V-16 (rootless buildkitd).
      teamTools:
        rbac:
          enabled: false
      # features.resourceQuotas (RFC 0014): write on resourcequotas and
      # limitranges cluster-wide, plus the pod-less namespace that holds the
      # quota templates (a quota is live where it lives, so never in the
      # operator's own namespace). Both rendered only once enabled; the
      # template namespace then needs a dest entry in the che AppProject
      # (2.argo/app/values.yaml).
      resourceQuotas:
        rbac:
          enabled: false
        templateNamespace:
          name: weebo-si-hardening-templates
          create: true
      # features.endpointAuth. Served by the endpoint-gateway deployment
      # (templates/endpoint-gateway.yaml, che.hardening.endpointGateway).
      endpointAuth:
        rbac:
          enabled: true
        failurePolicy: Fail
        dialect: Traefik
        namespaceLabel:
          key: app.kubernetes.io/part-of
          value: che.eclipse.org
        gateway:
          name: endpoint-gateway
          namespace: weebo-si-hardening
          port: 4180

repo: ""
project: ""
branch: ""
