che:
  enabled: true
  namespace: eclipse-che
  cheApp:
    enabled: true
  cheAppBis:
    enabled: true
  ingress:
    enabled: true
    host: cde.dev.weebo.poc
  # Root CA injected into che-server (and, through `ca-certs-merged`, into
  # workspaces) so it trusts the internal PKI -- authentik's issuer above all.
  # Rendered as a trust-manager Bundle in sub-bis; `name` is both the Bundle and
  # the ConfigMap it writes into the Che namespace, `key` the file name the
  # certificate gets under /public-certs.
  caBundle:
    enabled: true
    name: che-custom-ca-certificates
    key: custom-ca-certificates.pem
    # In cert-manager, where trust-manager reads its sources; created by the
    # ingress chart's ExternalSecret from mv/cert-manager/config.
    sourceSecret: main-ca.crt
  operator:
    # weebo-si fork, built by weebo-si/che-images. `develop` moves nightly:
    # pin a `sha-<short>` tag for a reproducible rollout. Rollback: point
    # eclipse-che.yaml back at the upstream chart
    # (https://eclipse-che.github.io/che-operator/charts, eclipse-che 7.122.0).
    che:
      image: ghcr.io/weebo-si/che-operator
      tag: develop
    devworkspace:
      repoURL: https://github.com/devfile/devworkspace-operator
      ## renovate: datasource=docker depName=ghcr.io/batlehub/batlehub/charts/batlehub
      version: v0.43.0
  # weebo-si-operator from batleforc/weebo-si-hardening, pulled as an OCI chart.
  # The chart version is also the image tag (appVersion).
  hardening:
    enabled: true
    namespace: weebo-si-hardening
    ## renovate: datasource=docker depName=ghcr.io/batleforc/charts/weebo-si-operator
    version: 0.2.0
    # 1 = no HA (no webhook during a drain, see hardening-operator.yaml).
    replicas: 1
    # WeeboSiConfig/Team/User, rendered by 2.argo/helm/che/hardening and
    # managed from its values.yaml.
    config:
      enabled: true
    # endpoint-gateway (templates/endpoint-gateway.yaml), same release as
    # the operator (version above). Deployed, not linked: see that file.
    endpointGateway:
      enabled: true
      replicas: 1
      # Its own sign-in host; must match the redirect URI of the
      # `endpoint-gateway` Authentik application (2.argo/helm/auth).
      host: endpoint-auth.cde.dev.weebo.poc
    # weebo-si-operator chart values that gate a feature: the RBAC it needs
    # and the failurePolicy of its webhooks. Merged into the operator
    # Application, and passed to the config chart, which refuses to render
    # a feature enabled in 2.argo/helm/che/hardening/values.yaml whose switch
    # here is off. Each feature's own settings live there, not here.
    operator:
      # features.identity: AuthentikUser cluster-wide, Applications in
      # argoNamespace only (must match identity.che.applicationNamespace).
      identity:
        rbac:
          enabled: true
        argoNamespace: argocd
      # features.networkProfiles with the Cilium backend (and policyGuard
      # over CiliumNetworkPolicy). On: Cilium serves ciliumnetworkpolicies,
      # and without the RBAC the operator logs the backend as absent. Grants
      # the watch only; the feature itself stays off in the config chart.
      networkProfiles:
        cilium:
          enabled: true
      # features.policyGuard: Fail is the safe default; Ignore only once no
      # user can write networkpolicies (true of every access level today).
      policyGuard:
        failurePolicy: Fail
      # features.imagePolicy's Pod webhook (the DevWorkspace one is always
      # Fail). Fail: no workspace pod is (re)created while the operator is
      # down, a node drain included.
      imagePolicy:
        podWebhook:
          failurePolicy: Fail
      # features.kubearmorPolicy. KubeArmor is not installed on this cluster.
      kubearmorPolicy:
        rbac:
          enabled: false
      # features.registryConfig: create/update/delete on secrets
      # cluster-wide (read RFC 0007's Security considerations first).
      registryConfig:
        rbac:
          enabled: false
        failurePolicy: Ignore
      # features.endpointAuth. Also needs the endpoint-gateway deployment
      # (oci://ghcr.io/batleforc/charts/endpoint-gateway), not deployed yet.
      endpointAuth:
        rbac:
          enabled: false
        failurePolicy: Fail
        dialect: Traefik
        namespaceLabel:
          key: app.kubernetes.io/part-of
          value: che.eclipse.org
        gateway:
          name: endpoint-gateway
          namespace: weebo-si-hardening
          port: 4180

repo: ""
project: ""
branch: ""
