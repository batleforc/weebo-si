{{- if .Values.che.hardening.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: weebo-si-hardening-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: weebo-si-hardening-operator
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: {{ .Values.project }}
  # Admission webhook + controller from batleforc/weebo-si-hardening. Ships its
  # three CRDs (WeeboSiConfig/Team/User) and every feature RBAC switch off: it
  # does nothing until a WeeboSiConfig turns a feature on.
  source:
    chart: weebo-si-operator
    repoURL: oci://ghcr.io/batleforc/charts/weebo-si-operator
    targetRevision: "{{ .Values.che.hardening.version }}"
    helm:
      releaseName: weebo-si-operator
      valuesObject:
        # The chart renders the namespace itself, labelled
        # hardening.weebo.io/exclude so its own webhook never gates it.
        namespace:
          create: true
        # Left empty, the chart renders a self-signed Issuer for the webhook
        # serving cert and has cert-manager inject the CA bundle.
        certificates:
          provider: cert-manager
        # No HA for now. The webhook keeps maxUnavailable: 0 / maxSurge: 1, so a
        # rollout still never leaves it without a ready endpoint; a node drain
        # does, and every webhook here is failurePolicy: Fail.
        webhook:
          replicaCount: {{ .Values.che.hardening.replicas }}
          # The chart refuses a webhook PDB under 2 replicas: the one
          # eviction it allows would be an outage of every Fail webhook.
          podDisruptionBudget:
            enabled: {{ gt (int .Values.che.hardening.replicas) 1 }}
        controller:
          replicaCount: {{ .Values.che.hardening.replicas }}
          # minAvailable: 1 on a single replica can never be satisfied and
          # would stall every node drain.
          podDisruptionBudget:
            enabled: {{ gt (int .Values.che.hardening.replicas) 1 }}
        # Per-feature RBAC and failure policies: che.hardening.operator in
        # values.yaml. The config chart refuses to enable a feature whose
        # switch here is off.
        {{- toYaml .Values.che.hardening.operator | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.che.hardening.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end -}}
