{{- if .Values.che.cheApp.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: che-app
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: "{{ .Values.project }}"
  source:
    repoURL: '{{ .Values.repo }}'
    targetRevision: '{{ .Values.branch }}'
    path: '2.argo/helm/che/sub'
    helm:
      releaseName: che-app
      valuesObject:
        {{- with .Values }}
        {{- toYaml . | nindent 10 }}
        {{- end }}
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: 'argocd'
  # che-operator rewrites part of the CheCluster after every apply (see the
  # che.eclipse.org/checluster-defaults-cleanup annotation), which kept it
  # OutOfSync and selfHeal re-applying it in a loop. Only the fields its own
  # field manager (`manager`) owns are ignored: a change to anything else in
  # git still shows as a diff and syncs.
  ignoreDifferences:
    - group: org.eclipse.che
      kind: CheCluster
      managedFieldsManagers:
        - manager
  syncPolicy:
    automated:
      selfHeal: true
    syncOptions:
    # CheCluster's CRD is installed by eclipse-che-operator (wave 1); skip the
    # dry-run so the first sync does not fail before it exists.
    - SkipDryRunOnMissingResource=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end -}}
