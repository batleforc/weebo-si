{{- /*
  House editors: every editors/<name>.yaml of this chart whose <name> is
  switched on in che.editors.custom (2.argo/helm/che/main/values.yaml).
  che-operator merges every ConfigMap carrying these labels into the
  dashboard's editor list.
*/ -}}
{{- $cfg := .Values.che.editors -}}
{{- $shipped := dict -}}
{{- range $path, $_ := .Files.Glob "editors/*.yaml" -}}
{{- $name := base $path | trimSuffix ".yaml" -}}
{{- if not (hasKey $cfg.custom $name) -}}
{{- fail (printf "%s is not listed in che.editors.custom: add `%s: true` (ship it) or `false` (keep it out) in 2.argo/helm/che/main/values.yaml" $path $name) -}}
{{- end -}}
{{- end -}}
{{- range $name, $on := $cfg.custom -}}
{{- if $on -}}
{{- $path := printf "editors/%s.yaml" $name -}}
{{- $content := $.Files.Get $path -}}
{{- if not $content -}}
{{- fail (printf "che.editors.custom.%s is on but 2.argo/helm/che/sub-bis/%s does not exist" $name $path) -}}
{{- end -}}
{{- $meta := (fromYaml $content).metadata | default dict -}}
{{- $id := printf "%s/%s/%v" ($meta.attributes | default dict).publisher $meta.name ($meta.attributes | default dict).version -}}
{{- $_ := set $shipped $name (dict "id" $id "content" $content) -}}
{{- end -}}
{{- end -}}
{{- /* The dashboard's preselected editor must be one it can show. */ -}}
{{- $visible := list -}}
{{- range $shipped }}{{ $visible = append $visible .id }}{{ end -}}
{{- if or (not $cfg.upstream.hideAll) (has $cfg.default $cfg.upstream.show) -}}
{{- $visible = append $visible $cfg.default -}}
{{- end -}}
{{- if not (has $cfg.default $visible) -}}
{{- fail (printf "che.editors.default %q is neither a shipped house editor (%s) nor an upstream one left visible (che.editors.upstream.show)" $cfg.default (join ", " $visible)) -}}
{{- end -}}
{{- if $shipped }}
apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: editor-definition
    app.kubernetes.io/instance: che
    app.kubernetes.io/managed-by: che-operator
    app.kubernetes.io/name: che
    app.kubernetes.io/part-of: che.eclipse.org
  name: weebo-editors-definitions
  namespace: {{ .Values.che.namespace }}
data:
  {{- range $name, $e := $shipped }}
  # {{ $e.id }}
  {{ $name }}.yaml: |
{{ $e.content | indent 4 }}
  {{- end }}
{{- end }}
