apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: che-cluster-tls
  namespace: {{ .Values.che.namespace }}
spec:
  commonName: "{{ .Values.che.ingress.host }}"
  secretName: che-cluster-tls
  secretTemplate:
    labels:
      app.kubernetes.io/part-of: che.eclipse.org
  dnsNames:
    - "{{ .Values.che.ingress.host }}"
  issuerRef:
    name: vault-issuer
    kind: ClusterIssuer
  privateKey:
    size: 4096
  subject:
    organizationalUnits:
      - Infra
    organizations:
      - WeeboSI
  usages:
    - digital signature
    - key encipherment
