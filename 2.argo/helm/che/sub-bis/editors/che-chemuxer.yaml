# che-incubator/che-chemuxer/next, as che-operator ships it, served through
# angos: publisher weebo, and every image from its cache
# (registry.pkg.weebo.poc/{hub,quay,redhat}/<upstream path>).
# Re-fetch after a che-operator bump (see README.md, step 1).
commands:
  - apply:
      component: chemuxer-injector
    id: init-chemuxer-command
  - exec:
      commandLine: >-
        bash -c 'source $HOME/.nvm/nvm.sh &&
        STATIC_DIR=/chemuxer-vol/dist/client HOST=0.0.0.0 nohup node
        /chemuxer-vol/dist/server/server.js > /chemuxer-vol/chemuxer.log 2>&1 &'
      component: chemuxer-runtime
    id: start-chemuxer-command
components:
  - container:
      command:
        - sh
        - '-c'
        - >-
          cp -r /app/dist /chemuxer-vol/ && cp -r /app/node_modules
          /chemuxer-vol/
      cpuLimit: 500m
      cpuRequest: 30m
      image: registry.pkg.weebo.poc/quay/che-incubator/chemuxer:next
      memoryLimit: 128Mi
      memoryRequest: 32Mi
      volumeMounts:
        - name: chemuxer-volume
          path: /chemuxer-vol
    name: chemuxer-injector
  - attributes:
      app.kubernetes.io/component: chemuxer-runtime
      app.kubernetes.io/part-of: chemuxer.eclipse.org
      controller.devfile.io/container-contribution: true
    container:
      cpuLimit: 500m
      cpuRequest: 30m
      endpoints:
        - attributes:
            cookiesAuthEnabled: true
            discoverable: false
            secure: true
            type: main
            urlRewriteSupported: true
          exposure: public
          name: chemuxer
          protocol: https
          targetPort: 7681
      image: registry.pkg.weebo.poc/quay/che-incubator/chemuxer:next
      memoryLimit: 512Mi
      memoryRequest: 128Mi
      volumeMounts:
        - name: chemuxer-volume
          path: /chemuxer-vol
    name: chemuxer-runtime
  - name: chemuxer-volume
    volume: {}
events:
  postStart:
    - start-chemuxer-command
  preStart:
    - init-chemuxer-command
metadata:
  attributes:
    arch:
      - x86_64
      - arm64
    firstPublicationDate: '2026-07-20'
    iconData: >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64"
      height="64">
        <rect width="64" height="64" rx="14" fill="#1e1e2e"/>
        <text x="4" y="46" font-family="monospace" font-weight="bold" font-size="32" fill="#89b4fa">c</text>
        <text x="23" y="46" font-family="monospace" font-weight="bold" font-size="32" fill="#cdd6f4">h</text>
        <rect x="43" y="22" width="15" height="26" rx="2" fill="#cdd6f4" opacity="0.7">
          <animate attributeName="opacity" values="0.7;0;0.7" dur="1.2s" repeatCount="indefinite"/>
        </rect>
      </svg>
    iconMediatype: image/svg+xml
    provider: "Images cached by [angos](https://registry.pkg.weebo.poc)"
    publisher: weebo
    repository: https://github.com/che-incubator/chemuxer
    title: Chemuxer - Terminal Multiplexer for Eclipse Che
    version: next
  description: Web-based terminal multiplexer for Eclipse Che
  displayName: Chemuxer
  name: che-chemuxer
  tags:
    - terminal
    - multiplexer
    - angos
schemaVersion: 2.3.0
