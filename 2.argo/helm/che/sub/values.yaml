che:
  enabled: true
  namespace: eclipse-che
  cluster:
    enabled: true
  cheApp:
    enabled: true
  ingress:
    enabled: true
    host: cde.dev.weebo.poc
  # weebo-si forks built by weebo-si/che-images (develop = moving tag, rebuilt
  # nightly; pin `sha-<short>` for a reproducible rollout).
  #   che-server:    Forgejo factory, OAuth and PAT modules
  #   che-dashboard: Forgejo provider + workspace Storage tab
  images:
    server: ghcr.io/weebo-si/che-server:develop
    dashboard: ghcr.io/weebo-si/che-dashboard:develop
  # Forgejo as a Che git service (`spec.gitServices.forgejo`, fork only). The
  # OAuth2 application lives on Forgejo with redirect URI
  # https://<che host>/api/oauth/callback; its id/secret are read from Vault.
  forgejo:
    enabled: false
    # Sign-in through an OAuth2 application (gitServices.forgejo); off, the
    # endpoint alone is declared to che-server. See main/values.yaml.
    oauth: false
    secretName: forgejo-oauth-config
    endpoint: https://git.batleforc.fr
    vaultKey: mv/eclipse-che/forgejo
  # IDE control lives in 2.argo/helm/che/main/values.yaml (che.editors),
  # which overrides these defaults. Only `upstream.known` belongs here.
  editors:
    default: weebo/che-code/latest
    custom: {}
    upstream:
      hideAll: true
      show: []
      hide: []
      # Every editor che-operator ships in its editors-definitions ConfigMap
      # (all che-incubator/, images straight from quay.io). hideAll hides
      # exactly this list, so re-list after a che-operator bump:
      #   kubectl exec -n eclipse-che deploy/che-dashboard -- \
      #     curl -s http://localhost:8080/dashboard/api/editors \
      #     | jq -r '.[].metadata | "\(.attributes.publisher)/\(.name)/\(.attributes.version)"'
      known:
        - che-incubator/che-chemuxer/next
        - che-incubator/che-clion-server/latest
        - che-incubator/che-clion-server/next
        - che-incubator/che-code/insiders
        - che-incubator/che-code/latest
        - che-incubator/che-code-server/latest
        - che-incubator/che-code-server/next
        - che-incubator/che-code-sshd/next
        - che-incubator/che-goland-server/latest
        - che-incubator/che-goland-server/next
        - che-incubator/che-herdr/latest
        - che-incubator/che-idea-server/latest
        - che-incubator/che-idea-server/next
        - che-incubator/che-orca/next
        - che-incubator/che-phpstorm-server/latest
        - che-incubator/che-phpstorm-server/next
        - che-incubator/che-pycharm-server/latest
        - che-incubator/che-pycharm-server/next
        - che-incubator/che-rider-server/latest
        - che-incubator/che-rider-server/next
        - che-incubator/che-rubymine-server/latest
        - che-incubator/che-rubymine-server/next
        - che-incubator/che-webstorm-server/latest
        - che-incubator/che-webstorm-server/next
        - che-incubator/che-web-terminal/latest
        - che-incubator/jetbrains-sshd/next
  # Workspace images pulled through angos (registry.pkg.weebo.poc/quay = a
  # quay.io pull-through cache). Pinned tags: unlike the operator defaults
  # they do not move when che-operator is upgraded, so bump them with it.
  workspaceImages:
    projectClone: registry.pkg.weebo.poc/quay/devfile/project-clone:v0.43.0
    gateway: registry.pkg.weebo.poc/quay/eclipse/che--traefik:v3.7.13-24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
  # Read anonymously: the editor cannot authenticate to its gallery.
  openVSXURL: https://pkg.weebo.poc/proxy/vsx
  # The dashboard's Get Started samples: batlehub's `devfile` registry, a
  # registry.devfile.io proxy on its own host (registry-library asks for the
  # OCI layers at the host root). Empty: Che's default, registry.devfile.io.
  devfileRegistryURL: https://devfile.pkg.weebo.poc/
  # Environment of every workspace container (templates/workspace-trust.yaml).
  # `env`: the internal CA -- each variable points at `bundle`, the public roots
  # plus weebo.poc's, which che-operator mounts there (ca-certs-merged).
  # `extraEnv`: other variables, with their own value.
  workspaceTrust:
    enabled: true
    bundle: /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem
    env:
      - SSL_CERT_FILE        # OpenSSL, rustls-native-certs (mise), Go
      - CURL_CA_BUNDLE       # curl
      - GIT_SSL_CAINFO       # git over HTTPS
      - REQUESTS_CA_BUNDLE   # Python requests, pip
      - NODE_EXTRA_CA_CERTS  # Node.js, npm
    extraEnv:
      # mise's HTTP client rewrites every URL through these rules before
      # sending, its hardcoded mise-versions.jdx.dev included, so its version
      # lists come from batlehub (2.argo/helm/batlehub/values.yaml, the
      # mise-versions registry) on the public pkg.weebo.poc name. A plain key
      # matches anywhere in the URL; the first rule that changes it wins. The
      # three `generic` dist mirrors go here too, once mise's go/helm/kubectl
      # downloads are moved over:
      #   "https://dl.google.com/go/": "https://pkg.weebo.poc/proxy/go-dist/generic/"
      #   "https://get.helm.sh/":      "https://pkg.weebo.poc/proxy/helm-dist/generic/"
      #   "https://dl.k8s.io/":        "https://pkg.weebo.poc/proxy/k8s-dist/generic/"
      MISE_URL_REPLACEMENTS: >-
        {"https://mise-versions.jdx.dev/": "https://pkg.weebo.poc/proxy/mise-versions/generic/"}
  # OIDC client the Che gateway authenticates against. Only the client secret
  # is sensitive: it stays in mv/eclipse-che/auth and reaches the CheCluster by
  # Secret name (see templates/oauth-secret.yaml). The client id and secret
  # mirror `applications.che` in 2.argo/helm/auth/sub/values.yaml, which dex's
  # che-cluster static client reuses: they must follow it if it changes.
  auth:
    clientId: che-cluster
    # dex, not Authentik: the apiserver only trusts dex (aud weebo-kube), and
    # che-dashboard calls it with the user's token. `che-cluster` is a dex
    # static client trusted by weebo-kube (2.argo/helm/auth/main dex.yaml).
    identityProviderURL: https://dex.weebo.poc
    oAuthSecretName: che-oauth-secret

repo: ""
project: ""
branch: ""

# CiliumNetworkPolicies, rendered by 2.helm/weebo-base (templates/_cilium.tpl
# documents the format). Ingress only, egress stays open; `host` is always let
# in (kubelet probes, apiserver -> webhooks). Same sources and checks as in
# 2.argo/helm/angos/values.yaml. Values passed down by the main chart override
# these, ciliumNetworkPolicies.enabled included.
ciliumNetworkPolicies:
  enabled: false
  # Docs only (weebo-base.netflowReaches): endpoint-gateway's policy comes
  # from its upstream chart, so the relation cannot sit on a policy here.
  reaches:
    - namespace: weebo-si-hardening
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: endpoint-gateway
      # Its OIDC issuer (che/main endpoint-gateway.yaml).
      hosts: [auth.weebo.poc]
  policies:
    eclipse-che-ingress:
      namespace: eclipse-che
      endpointSelector: {}
      # che.auth.identityProviderURL: che-server and the gateway's oauth2-proxy.
      reaches:
        - dex.weebo.poc
      ingress:
        # gateway -> che/dashboard, operator -> everything it manages.
        - fromEndpoints:
            - {}
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: traefik
                app.kubernetes.io/name: traefik
          toPorts:
            - ports:
                - port: "8080"
                  protocol: TCP
        # Workspaces, matched by namespace label so a new dev-ws-* needs no
        # edit. Mirrors the egress weebo-net-base gives them (che/hardening).
        - fromEndpoints:
            - matchLabels:
                k8s:io.cilium.k8s.namespace.labels.app.kubernetes.io/component: workspaces-namespace
          toPorts:
            - ports:
                - port: "8080"
                  protocol: TCP
                - port: "8089"
                  protocol: TCP
        # endpoint-gateway asks the gateway to authenticate (8089).
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: weebo-si-hardening
                app.kubernetes.io/name: endpoint-gateway
          toPorts:
            - ports:
                - port: "8089"
                  protocol: TCP
    # Webhooks and conversion only, all called by the apiserver.
    devworkspace-controller-ingress:
      namespace: devworkspace-controller
      endpointSelector: {}
      ingress:
        - fromEndpoints:
            - {}
    # The operator pods only. endpoint-gateway has its own policy
    # (che/endpoint-gateway), and the network canary must stay out of reach:
    # it exists to prove a connection is refused, and an allow here would
    # turn that proof green for the wrong reason.
    weebo-si-operator-ingress:
      namespace: weebo-si-hardening
      endpointSelector:
        matchLabels:
          app.kubernetes.io/name: weebo-si-operator
      ingress:
        # otel-cluster's weebo-si-hardening scrape job (http-health).
        - fromEndpoints:
            - matchLabels:
                k8s:io.kubernetes.pod.namespace: monitoring
                app.kubernetes.io/instance: otel-cluster
          toPorts:
            - ports:
                - port: "8081"
                  protocol: TCP
