{{- if .Values.che.cluster.enabled -}}
# Client secret of the authentik OIDC client, referenced by name from the
# CheCluster's `spec.networking.auth.oAuthSecret`. The operator reads the
# `oAuthSecret` key and only considers Secrets in the CheCluster namespace
# that carry the `app.kubernetes.io/part-of=che.eclipse.org` label.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.che.auth.oAuthSecretName }}
  namespace: {{ .Values.che.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: che-cluster-store
  # ESO's defaults, written out: left implicit, the controller fills them in
  # and Argo reports the ExternalSecret OutOfSync forever.
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: {{ .Values.che.auth.oAuthSecretName }}
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: oauth
  data:
    - secretKey: oAuthSecret
      remoteRef:
        key: mv/eclipse-che/auth
        property: AUTHENTIK_CLIENT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end -}}
