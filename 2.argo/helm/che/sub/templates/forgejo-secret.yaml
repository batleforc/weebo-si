{{- if and .Values.che.cluster.enabled .Values.che.forgejo.enabled .Values.che.forgejo.oauth -}}
# OAuth2 application Che uses to talk to Forgejo, referenced from the
# CheCluster's `spec.gitServices.forgejo`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.che.forgejo.secretName }}
  namespace: {{ .Values.che.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: che-cluster-store
  # ESO's defaults, written out: left implicit, the controller fills them in
  # and Argo reports the ExternalSecret OutOfSync forever.
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
    name: {{ .Values.che.forgejo.secretName }}
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: oauth-scm-configuration
        annotations:
          che.eclipse.org/oauth-scm-server: forgejo
          che.eclipse.org/scm-server-endpoint: {{ .Values.che.forgejo.endpoint }}
  data:
    - secretKey: id
      remoteRef:
        key: {{ .Values.che.forgejo.vaultKey }}
        property: id
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
    - secretKey: secret
      remoteRef:
        key: {{ .Values.che.forgejo.vaultKey }}
        property: secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
        nullBytePolicy: Ignore
{{- end -}}
