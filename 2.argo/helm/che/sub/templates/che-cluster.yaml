{{- if .Values.che.cluster.enabled -}}
# https://doc.crds.dev/github.com/eclipse-che/che-operator
# https://eclipse.dev/che/docs/stable/install/proc_deploying-che-using-gitops/
apiVersion: org.eclipse.che/v2
kind: CheCluster
metadata:
  name: eclipse-che
  namespace: {{ .Values.che.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    che.eclipse.org/self-signed-certificate: "false"
spec:
  devEnvironments:
    # che-operator forces this to true on Kubernetes (container builds are
    # OpenShift-only); false here only kept che-app OutOfSync.
    disableContainerBuildCapabilities: true
    maxNumberOfWorkspacesPerUser: 20
    maxNumberOfRunningWorkspacesPerUser: 5
    secondsOfInactivityBeforeIdling: 10800
    defaultNamespace:
      template: dev-ws-<username>
      autoProvision: false
    persistUserHome:
      enabled: true
    networking:
      externalTLSConfig:
        enabled: true
        # Same set as the other ingresses (vault, dex), minus common-name:
        # every workspace endpoint gets its own host, so cert-manager takes
        # the names from each Ingress's tls hosts instead.
        annotations:
          cert-manager.io/cluster-issuer: "vault-issuer"
          cert-manager.io/private-key-size: "4096"
          cert-manager.io/subject-organizations: "WeeboSI"
          cert-manager.io/subject-organizationalunits: "Dev"
    storage:
      pvcStrategy: per-workspace
      perUserStrategyPvcConfig:
        claimSize: "10Gi"
      perWorkspaceStrategyPvcConfig:
        claimSize: "10Gi"
    defaultComponents:
      - name: tool
        container:
          image: registry.pkg.weebo.poc/ghcr/batleforc/weebodevimage/che-min-mise:main
          # Che's webhook defaults it on admission; written out so Argo
          # does not see it as drift.
          sourceMapping: /projects
    # Workspace images through angos' quay.io cache (2.argo/helm/angos,
    # repository `quay`) rather than from quay.io directly.
    #   defaultEditor: che.editors.default (main/values.yaml), a house
    #     editor from sub-bis/editors/ by default;
    #   projectCloneContainer: the init container cloning the projects.
    defaultEditor: {{ .Values.che.editors.default | quote }}
    projectCloneContainer:
      name: project-clone
      image: {{ .Values.che.workspaceImages.projectClone | quote }}
  {{- if and .Values.che.forgejo.enabled .Values.che.forgejo.oauth }}
  # Needs the forked CRD (operator/), the upstream one prunes this field.
  gitServices:
    forgejo:
      - secretName: {{ .Values.che.forgejo.secretName }}
  {{- end }}
  networking:
    hostname: {{ .Values.che.ingress.host }}
    domain: {{ .Values.che.ingress.host }}
    ingressClassName: traefik
    tlsSecretName: che-cluster-tls
    annotations:
      kubernetes.io/ingress.class: "traefik"
    auth:
      oAuthClientName: {{ .Values.che.auth.clientId | quote }}
      # Name of the Secret rendered by oauth-secret.yaml, not the value itself.
      oAuthSecret: {{ .Values.che.auth.oAuthSecretName | quote }}
      # The two audience scopes are dex cross-client: weebo-kube is the
      # audience the apiserver accepts, che-cluster keeps this client in aud
      # so the gateway's own id_token check still passes.
      oAuthScope: "openid email profile offline_access groups audience:server:client_id:che-cluster audience:server:client_id:weebo-kube"
      identityProviderURL: {{ .Values.che.auth.identityProviderURL | quote }}
      gateway:
        oAuthProxy:
          cookieExpireSeconds: 32400
        # The workspace's che--traefik sidecar takes this same image
        # (che-operator, che_routing.go provisionPodAdditions): one field, so
        # the che-gateway Deployment here pulls through angos as well.
        deployment:
          containers:
            - name: gateway
              image: {{ .Values.che.workspaceImages.gateway | quote }}
  components:
    # che-code's extension gallery: batlehub's `vsx` registry, an open-vsx.org
    # proxy (2.argo/helm/batlehub). che-code appends /vscode/gallery,
    # /vscode/item and /vscode/unpkg/... itself.
    pluginRegistry:
      openVSXURL: {{ .Values.che.openVSXURL | quote }}
    cheServer:
      extraProperties:
        CHE_SYSTEM_ADMIN_NAME: "batleforc"
        # Default is the `name` claim (Authentik's display name, "max"), which
        # Che would turn into dev-ws-max. preferred_username is the Authentik
        # username: what WeeboSiUser.username, the dev-ws-<username> namespace
        # and the endpoint gateway's owner check all use.
        CHE_OIDC_USERNAME__CLAIM: "preferred_username"
        {{- if and .Values.che.forgejo.enabled (not .Values.che.forgejo.oauth) }}
        # che.integration.forgejo.oauth_endpoint without an OAuth client: the
        # host is recognised as Forgejo, public repositories are read
        # anonymously, private ones need a PAT added in the dashboard. With
        # forgejo.oauth, che-operator sets this itself from the gitServices
        # Secret.
        CHE_INTEGRATION_FORGEJO_OAUTH__ENDPOINT: {{ .Values.che.forgejo.endpoint | quote }}
        {{- end }}
      deployment:
        containers:
          - name: che
            image: {{ .Values.che.images.server | quote }}
            imagePullPolicy: Always
    metrics:
      enable: true
    dashboard:
      logLevel: INFO
      deployment:
        containers:
          - name: che-dashboard
            image: {{ .Values.che.images.dashboard | quote }}
            imagePullPolicy: Always
            {{- $up := .Values.che.editors.upstream }}
            {{- $hidden := list }}
            {{- range (ternary $up.known ($up.hide | default list) $up.hideAll) }}
            {{- if not (has . ($up.show | default list)) }}{{ $hidden = append $hidden . }}{{ end }}
            {{- end }}
            {{- with $hidden }}
            env:
              # Read off the CheCluster by the dashboard backend, not the pod.
              - name: CHE_HIDE_EDITORS_BY_ID
                value: {{ join "," . | quote }}
            {{- end }}
{{- end -}}
