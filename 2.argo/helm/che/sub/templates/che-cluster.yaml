{{- if .Values.che.cluster.enabled -}}
# https://doc.crds.dev/github.com/eclipse-che/che-operator
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: che-cluster
  namespace: {{ .Values.che.namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: che-cluster-store
  target:
    name: che-cluster
    template:
      type: Opaque
      data:
        che-cluster.yaml: |
          kind: CheCluster
          apiVersion: org.eclipse.che/v2
          metadata:
            name: eclipse-che
            namespace: {{ .Values.che.namespace }}
            annotations:
              che.eclipse.org/self-signed-certificate: "false"
              argocd.argoproj.io/tracking-id: che-app:org.eclipse.che/CheCluster:eclipse-che/che-cluster
          spec:
            devEnvironments:
              disableContainerBuildCapabilities: false
              maxNumberOfWorkspacesPerUser: 20
              maxNumberOfRunningWorkspacesPerUser: 5
              secondsOfInactivityBeforeIdling: 10800
              defaultNamespace:
                template: dev-ws-<username>
                autoProvision: false
              persistUserHome:
                enabled: true
              networking:
                externalTLSConfig:
                  enabled: true
                  annotations:
                    cert-manager.io/cluster-issuer: outbound
              storage:
                pvcStrategy: per-workspace
                perUserStrategyPvcConfig:
                  claimSize: "10Gi"
                perWorkspaceStrategyPvcConfig:
                  claimSize: "10Gi"
              defaultComponents:
                - name: tool
                  container:
                    image: ghcr.io/batleforc/weebodevimage/che-min-mise:main
            networking:
              hostname: {{ .Values.che.ingress.host }}
              domain: {{ .Values.che.ingress.host }}
              ingressClassName: traefik
              tlsSecretName: che-cluster-tls
              annotations:
                kubernetes.io/ingress.class: "traefik"
              auth:
                oAuthClientName: '{{ printf "{{"}} .client_id }}'
                oAuthSecret: '{{ printf "{{"}} .client_secret }}'
                oAuthScope: "openid email profile offline_access"
                identityProviderURL: '{{ printf "{{"}} .url }}'
                gateway:
                  oAuthProxy:
                    cookieExpireSeconds: 32400
            components:
              cheServer:
                extraProperties:
                  CHE_SYSTEM_ADMIN_NAME: "Batleforc"
              metrics:
                enable: true
              dashboard:
                logLevel: INFO
                deployment:
                  containers:
                    - name: che-dashboard
                      image: quay.io/eclipse/che-dashboard:pr-1663
                      imagePullPolicy: Always

  data:
    - secretKey: url
      remoteRef:
        key: mv/eclipse-che/auth
        property: AUTHENTIK_URL
    - secretKey: client_id
      remoteRef:
        key: mv/eclipse-che/auth
        property: AUTHENTIK_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: mv/eclipse-che/auth
        property: AUTHENTIK_CLIENT_SECRET

{{- end -}}
