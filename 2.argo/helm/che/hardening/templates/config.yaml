{{- include "hardening.checkRbac" . -}}
{{- $features := dict -}}
{{- range $name, $block := .Values.config.features -}}
{{- if $block.enabled -}}
{{- $_ := set $features $name (omit $block "enabled" "templates") -}}
{{- end -}}
{{- end -}}
{{- with $features.identity }}{{ with .che -}}
{{- $_ := set . "allowedRepoUrls" ((.allowedRepoUrls | default list) | concat (list $.Values.repo) | uniq) -}}
{{- end }}{{ end -}}
---
# The singleton: any name other than `cluster` is ignored by the operator.
# Spec from values.yaml `config`, enabled features only.
apiVersion: hardening.weebo.io/v1alpha1
kind: WeeboSiConfig
metadata:
  name: cluster
spec:
  features:
    {{- toYaml $features | nindent 4 }}
