{{- range $name, $spec := .Values.users }}
---
# Spec from values.yaml `users.{{ $name }}`. Deleting this object deletes its
# Application and, through it, the user's namespace and workspaces.
apiVersion: hardening.weebo.io/v1alpha1
kind: WeeboSiUser
metadata:
  name: {{ $name }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
