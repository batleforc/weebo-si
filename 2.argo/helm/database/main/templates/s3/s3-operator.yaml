{{- if .Values.s3Operator.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s3-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    # Without it a sync still writes the ignored fields below, rotating the
    # console's JWT secret (logging everyone out) and restarting it.
    - RespectIgnoreDifferences=true
  source:
    repoURL: {{ .Values.s3Operator.repoURL }}
    path: {{ .Values.s3Operator.path }}
    targetRevision: {{ .Values.s3Operator.version }}
    helm:
      releaseName: s3
      valuesObject:
        # The image defaults to Chart.appVersion, which upstream does not bump
        # in git: the 0.0.8 tag still says 0.0.6, so deploying from the repo
        # silently ran the old operator. The console reuses this tag.
        operator:
          image:
            tag: {{ .Values.s3Operator.version | quote }}
        sts:
          tls:
            auto: true
        console:
          enabled: {{ .Values.s3Operator.console.enabled }}
          ingress:
            enabled: true
            className: {{ .Values.s3Operator.console.className }}
            hosts:
              - host: {{ .Values.s3Operator.console.hosts.host }}
            tls:
              - host: {{ .Values.s3Operator.console.hosts.host }}
                secretName: {{ .Values.s3Operator.console.hosts.secretName }}
  destination:
    namespace: {{ .Values.s3Operator.namespace }}
    name: "in-cluster"
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: s3-rustfs-operator-console-secret
      namespace: s3
      jsonPointers:
        - /data/jwt-secret
    # The chart's `lookup` of the existing secret returns nothing under the
    # repo-server, so every render draws a fresh random jwt-secret -- and the
    # console Deployment's checksum of that secret changes with it.
    - group: apps
      kind: Deployment
      name: s3-rustfs-operator-console
      namespace: s3
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
{{- end }}
