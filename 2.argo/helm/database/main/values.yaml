repo: ""
branch: ""
project: ""

clickhouseOperator:
  enabled: true
  repoURL: oci://ghcr.io/clickhouse/clickhouse-operator-helm
  chart: clickhouse-operator-helm
  # renovate: datasource=docker depName=ghcr.io/clickhouse/clickhouse-operator-helm
  version: 0.0.8

mongodbOperator:
  enabled: true
  repoURL: https://mongodb.github.io/helm-charts
  chart: mongodb-kubernetes
  # 1.12 is the last chart on the 108.x agent. 1.13 moves to the Ops Manager 9
  # agent (109.x), under which MongoDB 5.0 -- what ClickStack's MongoDBCommunity
  # still runs -- is end of life. Held below 1.13 in renovate.json5 until the
  # server is on 6.0 or later.
  # renovate: datasource=helm depName=mongodb-kubernetes registryUrl=https://mongodb.github.io/helm-charts
  version: 1.12.0

cnpgOperator:
  enabled: true
  repoURL: https://cloudnative-pg.github.io/charts
  # renovate: datasource=helm depName=cloudnative-pg registryUrl=https://cloudnative-pg.github.io/charts
  version: 0.29.1

s3Operator:
  enabled: true
  repoURL: https://github.com/rustfs/operator
  path: deploy/rustfs-operator
  # renovate: datasource=github-tags depName=rustfs/operator
  version: 0.0.8
  namespace: s3
  console:
    enabled: true
    className: traefik
    hosts:
      host: s3-ope.weebo.poc
      secretName: s3-ope-weebo-poc

valkeyOperator:
  enabled: true
  repoURL: https://valkey.io/valkey-helm
  chart: valkey-operator
  namespace: valkey
  # renovate: datasource=helm depName=valkey-operator registryUrl=https://valkey.io/valkey-helm
  version: 0.8.0

subApp:
  enabled: true
