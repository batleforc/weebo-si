{{- if .Values.s3.enabled -}}
---
apiVersion: rustfs.com/v1alpha1
kind: Tenant
metadata:
  name: main
  namespace: {{ .Values.s3.namespace }}
  labels:
    environment: prod
  annotations:
    operator.rustfs.com/runtime-default-image-ack: {{ .Values.s3.mainInstance.image }}
spec:
  # Container image (optional - uses operator default if not specified)
  image: {{ .Values.s3.mainInstance.image }}

  credsSecret:
    name: main-cred

  pools:
    - name: main
      servers: 1
      persistence:
        volumesPerServer: 1
        volumeClaimTemplate:
          accessModes: ["ReadWriteOnce"]
          storageClassName: longhorn
          resources:
            requests:
              storage: 50Gi
  policies:
    {{ range .Values.s3.mainInstance.creds }}
    - name: {{ .name }}-readwrite
      document:
        configMapKeyRef:
          name: {{ .name }}-policy
          key: policy.json
    {{ end }}

  users:
    {{ range .Values.s3.mainInstance.creds }}
    - name: {{ .name }}
      credsSecret:
        name: {{ .name }}-cred
      policies:
        - {{ .name }}-readwrite
    {{ end }}

  buckets:
    {{ range .Values.s3.mainInstance.creds }}
    - name: {{ .name }}
    {{ end }}

  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    # Not enabled by default because RustFS may need writable runtime paths.
    readOnlyRootFilesystem: false

  # Optional: Enable debug logging for development
  # Note: Operator automatically sets RUSTFS_VOLUMES, RUSTFS_ADDRESS,
  # RUSTFS_CONSOLE_ADDRESS, and RUSTFS_CONSOLE_ENABLE
  env:
    # Standard Rust logging (not RustFS-specific)
    - name: RUST_LOG
      value: "debug"
    {{ if .Values.s3.mainInstance.oidc }}
    - name: RUSTFS_BROWSER_REDIRECT_URL
      value: "https://{{ .Values.s3.mainInstance.dns}}"
    - name: RUSTFS_IDENTITY_OPENID_ENABLE
      value: "true"
    - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
      valueFrom:
        secretKeyRef:
          name: main-oidc
          key: AUTHENTIK_URL
    - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
      valueFrom:
        secretKeyRef:
          name: main-oidc
          key: AUTHENTIK_CLIENT_ID
    - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: main-oidc
          key: AUTHENTIK_CLIENT_SECRET
    - name: RUSTFS_IDENTITY_OPENID_SCOPES
      value: "openid,profile,email,groups"
    - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
      value: "https://{{ .Values.s3.mainInstance.dns}}/rustfs/admin/v3/oidc/callback/default"
    - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
      value: "off"
    - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
      value: "Weebo SSO"
    - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
      value: "groups"
    - name: RUSTFS_IDENTITY_OPENID_ROLES_CLAIM
      value: "roles"
    - name: RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM
      value: "email"
    - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
      value: "preferred_username"
    {{ end }}
{{- end -}}