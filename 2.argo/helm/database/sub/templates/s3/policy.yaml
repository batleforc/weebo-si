{{ if .Values.s3.enabled }}
{{ range .Values.s3.mainInstance.creds }}
---
# The multipart actions are what reclaiming an abandoned upload takes: angos'
# `prune` lists the bucket's in-flight uploads and aborts the stale ones, and
# without ListBucketMultipartUploads its whole sweep failed on AccessDenied --
# with exit code 0, so the CronJob read as green.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .name }}-policy
  namespace: {{ $.Values.s3.namespace }}
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": [
            "s3:ListBucket",
            "s3:GetObject",
            "s3:PutObject",
            "s3:DeleteObject",
            "s3:ListBucketMultipartUploads",
            "s3:ListMultipartUploadParts",
            "s3:AbortMultipartUpload"
          ],
          "Resource": [
            "arn:aws:s3:::{{.name}}",
            "arn:aws:s3:::{{.name}}/*"
          ]
        }
      ]
    }
{{ end }}
{{ end }}
{{ if and .Values.s3.enabled .Values.s3.mainInstance.oidc }}
---
# The policy an SSO session lands on when the `rustfs policies` scope mapping
# in 2.argo/helm/auth/sub resolves the caller to weebo_moderator. Read-only:
# it can see which buckets exist and how the cluster is doing, and nothing in
# them. weebo_admin gets `consoleAdmin` instead, which is canned and needs no
# ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.s3.mainInstance.oidcPolicy.name | kebabcase }}-policy
  namespace: {{ .Values.s3.namespace }}
data:
  policy.json: |
    {
      "Version": "2012-10-17",
      "Statement": [
        {
          "Effect": "Allow",
          "Action": {{ .Values.s3.mainInstance.oidcPolicy.s3Actions | toJson }},
          "Resource": ["arn:aws:s3:::*"]
        },
        {
          "Effect": "Allow",
          "Action": {{ .Values.s3.mainInstance.oidcPolicy.adminActions | toJson }}
        },
        {
          "Effect": "Allow",
          "Action": ["sts:AssumeRole"]
        }
      ]
    }
{{ end }}
