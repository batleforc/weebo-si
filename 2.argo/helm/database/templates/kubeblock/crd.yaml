{{- if .Values.kubeblock.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeblock-crd
  namespace: argocd
spec:
  project: {{ .Values.project }}
  source:
    path: deploy/helm/crds
    repoURL: "https://github.com/apecloud/kubeblocks"
    targetRevision: "{{ .Values.kubeblock.crd_version }}"
    directory:
      recurse: true
  destination:
    namespace: {{ .Release.Namespace}}
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end -}}