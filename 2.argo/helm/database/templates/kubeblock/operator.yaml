{{- if .Values.kubeblock.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeblock
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
  source:
    chart: kubeblocks
    repoURL: https://apecloud.github.io/helm-charts
    targetRevision: {{ .Values.kubeblock.version }}
    helm:
      releaseName: kubeblock
      valuesObject:
        image:
          registry: docker.io
        dataProtection:
          image:
            registry: docker.io
        addonChartsImage:
          registry: docker.io
  destination:
    name: "in-cluster"
    namespace: {{ .Release.Namespace }}
{{- end -}}
