apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: vault-issuer
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  vault:
    path: pki_int/sign/weebo-poc
    server: https://openbao.vault:8200
    caBundleSecretRef:
      key: ca.crt
      name: openbao-tls
    auth:
      kubernetes:
        role: cert-manager
        mountPath: /v1/auth/kubernetes
        secretRef:
          name: vault-issuer
          key: token