certManager:
  enabled: true
  # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
  version: 1.20.2
  installCRDs: true
  certIssuer:
    enabled: true
    name: outbound
    email: "maxleriche.60@gmail.com"
  certIssuerDNS01:
    enabled: false
    name: dns-01
    email: "maxleriche.60@gmail.com"
    nameservers: "dns-server-in.dns.svc.cluster.local"
    namespace: "dns"

