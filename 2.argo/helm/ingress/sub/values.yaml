        - 10.245.0.0/16
        - fd00:10:245::/56
        # SERVICE IP LAB
        - 10.128.0.0/12
        - fd00:10:128::/112
        # IP PROD
        - 94.23.38.81/32
        - 2001:41d0:2:2751::1/128
