certManager:
  enabled: true
  # renovate: datasource=docker depName=quay.io/jetstack/charts/cert-manager
  version: v1.21.3
  installCRDs: true
  certIssuer:
    enabled: true
    name: outbound
    email: "maxleriche.60@gmail.com"
  certIssuerDNS01:
    enabled: false
    name: dns-01
    email: "maxleriche.60@gmail.com"
    nameservers: "dns-server-in.dns.svc.cluster.local"
    namespace: "dns"

trustManager:
  enabled: true
  # renovate: datasource=docker depName=quay.io/jetstack/charts/trust-manager
  version: "0.25.0"
  installCRDs: true

traefik:
  enabled: true
  # renovate: datasource=docker depName=ghcr.io/traefik/helm/traefik
  version: 42.1.3
  ips: ""
  kubeCRD:
    enabled: true
  kubeIngress:
    enabled: true
  gatewayAPI:
    enabled: false
  # X-Request-Id on every request (files/requestid, a local Traefik plugin):
  # kept as sent from trustedIPs, generated for everyone else. Shown on the
  # error pages.
  requestId:
    enabled: true
    # Put it on the web and websecure entrypoints. A second step, once the
    # `request-id` Middleware exists (ingress-app synced, plugin loaded): an
    # entrypoint naming a missing or broken middleware takes every route on it
    # down.
    attach: false
    # Peers whose X-Request-Id is kept: proxies in front of Traefik that set
    # their own. Matched on the connection's address, not X-Forwarded-For.
    # Empty: every request gets a fresh id.
    trustedIPs: []

authentik:
  enabled: true

repo: ""
project: ""
branch: ""

subApp:
  enabled: true
