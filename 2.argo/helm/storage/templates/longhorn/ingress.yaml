{{- if .Values.longhorn.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn
  namespace: longhorn
  labels:
    app.kubernetes.io/name: longhorn
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.longhorn.domain }}`)
      priority: 10
      services:
        - name: longhorn-frontend
          namespace: longhorn
          port: 80
          passHostHeader: true
      middlewares:
        - name: authentik
          namespace: auth
        # - name: outpost-vpn
        #   namespace: traefik
    - kind: Rule
      match: Host(`{{ .Values.longhorn.domain }}`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: auth
          port: 80
          passHostHeader: true
    # Must outrank the rule above, which would otherwise hand this exact path to
    # the outpost and serve the blank 200 that the redirect exists to avoid. The
    # service is never reached -- the middleware answers with a 302 first -- but
    # a route needs one, so it points at the app it redirects to.
    - kind: Rule
      match: Host(`{{ .Values.longhorn.domain }}`) && Path(`/outpost.goauthentik.io/auth/traefik`)
      priority: 20
      services:
        - name: longhorn-frontend
          namespace: longhorn
          port: 80
          passHostHeader: true
      middlewares:
        - name: authentik-auth-landing
          namespace: auth
  tls:
    secretName: longhorn-tls
{{- end -}}