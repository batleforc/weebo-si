{{- if .Values.longhorn.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io
    targetRevision: {{ .Values.longhorn.version }}
    helm:
      releaseName: longhorn
      valuesObject:
        # Opts longhorn-manager into otel-node's annotation discovery. The
        # manager already serves Prometheus metrics on :9500 -- per-volume
        # actual size on disk (what a thin-provisioned PVC really costs),
        # per-disk usage, and the SSD's own SMART attributes. Feeds the
        # longhorn half of the Storage dashboard.
        #
        # The chart applies .Values.annotations to several pod templates, which
        # is harmless: the key is port-suffixed, so it only ever matches a
        # container that actually declares 9500.
        annotations:
          io.opentelemetry.discovery.metrics.9500/enabled: "true"
          io.opentelemetry.discovery.metrics.9500/scraper: "prometheus_simple"
          io.opentelemetry.discovery.metrics.9500/config: |
            collection_interval: "60s"
            endpoint: "`endpoint`"
            metrics_path: "/metrics"
        preUpgradeChecker:
          # Disable the Helm pre-upgrade hook when Longhorn is managed by ArgoCD
          jobEnabled: false
        defaultSettings:
          # Fallback only. The node carries two disks -- /var/mnt/staticdisk (the
          # "staticdisk" user volume on sdb) and /var/lib/longhorn (the EPHEMERAL
          # partition on sda, shared with /var and local-path) -- and a single
          # path cannot express that. The real layout comes from the
          # node.longhorn.io/default-disks-config annotation set in the Talos
          # machine config (1.pulu-init/main.go), which this setting yields to.
          defaultDataPath: /var/mnt/staticdisk # Use /var/mnt/longhorn with UserVolumeConfig on Talos v1.10+
          # Default replica count
          defaultReplicaCount: 1
          # Storage over-provisioning percentage
          storageOverProvisioningPercentage: 100
          # Storage minimal available percentage
          storageMinimalAvailablePercentage: 15
          # Default data locality
          defaultDataLocality: best-effort
          # Only build default disks on nodes carrying
          # node.longhorn.io/create-default-disk, which is what makes the
          # annotation-driven two-disk layout win over defaultDataPath. A node
          # provisioned without that label gets no disk at all.
          createDefaultDiskLabeledNodes: true
          # Every "block*" option deadlocks a single-node cluster, so this has
          # to be one of the two permissive ones. block-for-eviction waits for
          # replicas to be evicted to another node, and the three
          # last-replica variants block whenever this node holds the last
          # replica -- with one node and defaultReplicaCount 1, both conditions
          # are permanently true. Measured on the live cluster: evicting either
          # instance-manager, csi-attacher or csi-provisioner returned
          # "Cannot evict pod as it would violate the pod's disruption budget",
          # so any drain -- including the one a Talos upgrade performs -- hung
          # rather than progressed.
          #
          # allow-if-replica-is-stopped keeps the part worth keeping: Longhorn
          # still refuses to let instance-manager be evicted while a replica is
          # running, so the drain cannot kill the data path underneath an
          # attached volume. Once the workloads are evicted the volumes detach,
          # the replicas stop, and the drain finishes. always-allow would also
          # unblock it but drops that protection for nothing gained here.
          #
          # Full option list, from the setting's own validating webhook:
          # block-for-eviction, block-for-eviction-if-contains-last-replica,
          # block-if-contains-last-replica, allow-if-replica-is-stopped,
          # always-allow.
          nodeDrainPolicy: allow-if-replica-is-stopped
          # Guaranteed instance manager CPU
          guaranteedInstanceManagerCPU: 4
          # Let a filesystem trim actually free blocks. Longhorn volumes are
          # thin-provisioned, but a trim can only release a block if no snapshot
          # in the chain still references it -- with this off, the trim walks the
          # filesystem and frees almost nothing. The ClickHouse volume reached
          # 21.43 GB allocated against 7.6 GB of live data because of this.
          #
          # Longhorn only marks the *latest* snapshot and its parents as removed,
          # and never one with multiple children, so this cannot eat a branch
          # point. Volumes keep unmapMarkSnapChainRemoved=ignored (the
          # persistence.unmapMarkSnapChainRemoved StorageClass default), which
          # means they inherit this global value rather than pinning their own.
          removeSnapshotsDuringFilesystemTrim: true

        persistence:
          # Default storage class
          defaultClass: true
          defaultClassReplicaCount: 1
          defaultFsType: ext4

        csi:
          attacherReplicaCount: 1
          provisionerReplicaCount: 1
          resizerReplicaCount: 1
          snapshotterReplicaCount: 1
        # Resource limits
        longhornManager:
          resources:
            requests:
              cpu: 250m
              memory: 256Mi

        longhornDriver:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi

        # Enable the UI
        longhornUI:
          replicas: 1
  destination:
    name: "in-cluster"
    namespace: longhorn
{{- end -}}
