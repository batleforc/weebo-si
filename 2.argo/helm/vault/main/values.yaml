bankVault:
  enabled: true
  ns: vault-operator
  # renovate: datasource=docker depName=ghcr.io/bank-vaults/helm-charts/vault-operator
  version: 1.24.1

externalSecrets:
  enabled: true
  # renovate: datasource=docker depName=ghcr.io/external-secrets/charts/external-secrets
  version: "2.14.0"

vaultApp:
  enabled: true

vaultInstance:
  enabled: true
  # renovate: datasource=docker depName=openbao/openbao
  version: "2.7.1"
  image: openbao/openbao
  hook:
    enabled: true
    # renovate: datasource=docker depName=ghcr.io/bank-vaults/helm-charts/vault-secrets-webhook
    version: 1.23.1
  dns: vault.weebo.poc

repo: ""
project: ""
branch: ""

# weebo-openbao (RFC 0007): the operator that creates the orgs' and users'
# spaces in openbao namespaces. Phase 3: the operator and its OpenbaoInstance
# only, no namespace yet. Its policy and role are Terraform's
# (2.terra/vault/terra-map/weebo-openbao.tf), its ingress to openbao is
# sub/values.yaml networkPolicy.allowedNamespaces.
openbao:
  enabled: true
  operator:
    # renovate: datasource=docker depName=ghcr.io/weebo-si-operator/charts/weebo-openbao
    version: 0.2.0
    namespace: weebo-openbao
  # Phase 4: the spaces (vault/spaces, its own Application).
  spaces:
    enabled: true
  instance:
    name: main
    # Same list as local.spaces_namespaces in weebo-openbao.tf: the policy
    # grants nothing outside it, this list refuses it before OpenBao does.
    namespaces: [devenv, recette, preprod, prod, users]

# Egress of the operator (RFC 0007 §6.6): DNS and the API server, plus
# OpenBao, its only remote system. The operator chart's own
# CiliumNetworkPolicy (networkPolicy.kind, kit >= 0.32.0), its values passed
# as is.
operatorNetworkPolicy:
  enabled: true
  kind: CiliumNetworkPolicy
  egress:
    enabled: true
    openbao:
      - toEndpoints:
          - matchLabels: { "k8s:io.kubernetes.pod.namespace": vault, vault_cr: openbao }
        toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
