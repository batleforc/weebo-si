# openbao-oidc, the client secret of every namespace's `authentik` backend,
# in the operator's namespace -- the only one its Role reads Secrets in, and
# by name only (chart value releaseSecrets). weebo-authentik writes it to
# mv/weebo-openbao/oidc; the `default` ServiceAccount reads it through the
# `auth-read` role (2.terra/vault/terra-map/auth-base.tf).
# Last wave: an Argo wave waits on the previous one being healthy, so a missing
# secret must not hold the namespaces back. The operator reports it as
# SecretUnavailable on the `authentik` backend alone.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cred-store
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    external-secrets.io/disable-maintenance-checks: "true"
spec:
  provider:
    vault:
      server: "https://openbao.vault:8200"
      path: "mv"
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "auth-read"
          serviceAccountRef:
            name: "default"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.oidc.secret.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  # The operator rereads the Secret on every reconcile (5 min at most) and
  # rewrites the backend's config when its digest changes.
  refreshInterval: 1h
  secretStoreRef:
    name: cred-store
    kind: SecretStore
  target:
    name: {{ .Values.oidc.secret.name }}
  data:
    - secretKey: {{ .Values.oidc.secret.key }}
      remoteRef:
        key: {{ .Values.oidc.secret.vaultKey }}
        property: AUTHENTIK_CLIENT_SECRET
