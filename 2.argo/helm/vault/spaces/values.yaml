# The spaces of OpenBao (RFC 0007), declared to weebo-openbao. Rendered by
# the Application vault/main templates/openbao/spaces.yaml, which passes
# `instance` (name, namespaces) from vault/main's openbao.instance: the
# OpenbaoNamespaces below are those namespaces, nothing else.
instance:
  name: main
  namespaces: []

# Each namespace's types: `orgs` (mount orgs, <org>/<repo>/...) or `users`
# (mount users, <username>/...). A namespace absent here gets `orgs`.
types:
  users: [users]

# The IdP of the namespaces' human logins: Authentik's `openbao` application
# (auth/sub applications.openbao). Its client secret reaches the operator's
# namespace through ESO, from mv/weebo-openbao/oidc.
oidc:
  backend: authentik
  discoveryUrl: https://auth.weebo.poc/application/o/openbao/
  clientId: openbao
  secret:
    name: openbao-oidc
    key: client-secret
    vaultKey: mv/weebo-openbao/oidc
  uiRedirect: "https://vault.weebo.poc/ui/vault/auth/authentik/oidc/callback?namespace="
  cliRedirect: "http://localhost:8250/oidc/callback"

# OpenbaoAccessLevel: the capabilities a cell or a rule grants, on data/ and
# metadata/ of the path; `versions` adds delete/undelete/destroy.
levels:
  read:
    data: [read]
    metadata: [read, list]
  write:
    data: [create, read, update, patch]
    metadata: [read, list]
  owner:
    data: [create, read, update, patch, delete]
    metadata: [read, list, delete]
    versions: true
  # For grants writing one leaf per user: create/update write it, read
  # compares before writing, delete removes it when the user leaves, and
  # metadata carries the operator-kit's ownership custom_metadata. No list.
  token-writer:
    data: [create, read, update, delete]
    metadata: [create, read, update, delete]

# OpenbaoSpaceLayout `weebo`: role -> namespace of type orgs -> level. An
# IdP group `<org>_<role>` gets its cells in every namespace listed.
layout:
  name: weebo
  groupAliasTemplate: "{org}_{role}"
  roles:
    owner: { prod: owner, preprod: owner, recette: owner, devenv: owner }
    maintainer: { prod: write, preprod: write, recette: write, devenv: write }
    dev: { preprod: read, recette: write, devenv: write }
  users:
    usernameClaim: preferred_username
    aliasMetadataKey: username

# OpenbaoOrganization: one per org, its IdP groups named by the layout's
# template (batleforc-org_owner, ...: auth/sub identity.groups).
organizations:
  - batleforc-org

# OpenbaoAccessGrant (the machine model): a system logs in INSIDE a
# namespace through its `kubernetes` backend, as role grant_<name>, which the
# grant's status names. The consumer's chart puts that role in its CR.
grants:
  # weebo-forgejo writes a user's Forgejo token at users/<username>/forgejo-token
  # and nothing else of theirs (2.argo/helm/forgejo values
  # operator.vault.additionalMounts).
  forgejo-user-tokens:
    namespace: users
    subjects:
      - { namespace: weebo-forgejo, name: weebo-forgejo }
    rules:
      - { mount: users, path: "+/forgejo-token", level: token-writer }
