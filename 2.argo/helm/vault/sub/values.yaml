bankVault:
  enabled: true
  ns: vault-operator
  # renovate: datasource=docker depName=ghcr.io/bank-vaults/helm-charts/vault-operator
  version: 1.24.1

externalSecrets:
  enabled: true
  # renovate: datasource=docker depName=ghcr.io/external-secrets/charts/external-secrets
  version: "2.14.0"

vaultApp:
  enabled: true

vaultInstance:
  enabled: true
  # renovate: datasource=docker depName=openbao/openbao
  version: "2.7.2"
  image: openbao/openbao
  hook:
    enabled: true
    # renovate: datasource=docker depName=ghcr.io/bank-vaults/helm-charts/vault-secrets-webhook
    version: 1.23.1
  dns: vault.weebo.poc
  deployed: true

repo: ""
project: ""
branch: ""

# First CiliumNetworkPolicy in the cluster -- see
# templates/vaultInstance/network-policy.yaml. Ingress-only on openbao.
networkPolicy:
  enabled: true
  # Every namespace that opens a connection to openbao:8200, derived from the
  # repo and the live cluster rather than from a Hubble capture alone:
  allowedNamespaces:
    # The ESO controller pod is what actually dials Vault, whichever namespace
    # the store object lives in. Covers ClusterSecretStore/otel-ingest-store and
    # the SecretStores in argocd, auth, cert-manager and monitoring -- which is
    # why those four namespaces are NOT listed here.
    - external-secrets
    # cert-manager connects directly for the vault-issuer ClusterIssuer (Vault
    # PKI). This is the rare flow that a short Hubble capture misses: a renewal
    # fires every 30-90 days, and 11 Certificates depend on it.
    - cert-manager
    # vault-env, injected by vault-secrets-webhook, runs inside the consuming
    # pod and dials openbao from that pod's namespace -- not from vault-infra.
    # authentik server/worker/postgresql, dex, and terra-job-authentik.
    - auth
    # netbird's exit-node carries the same vault-env injection.
    - netbird
    # The bank-vaults operator reconciling the Vault CR.
    - vault-operator
    # The webhook's own health/readiness path to Vault.
    - vault-infra
    # Traefik terminates vault.weebo.poc and proxies to the openbao Service.
    - traefik
    # Dex auth
    - dex
    # weebo-openbao (RFC 0007): the operator logs in and writes the spaces'
    # namespaces. Without it, a VaultUnavailable that does not say why.
    - weebo-openbao

# CiliumNetworkPolicies, rendered by 2.helm/weebo-base (templates/_cilium.tpl
# documents the format). Ingress only, egress stays open; `host` is always let
# in (kubelet probes, apiserver -> webhooks). Same sources and checks as in
# 2.argo/helm/angos/values.yaml. Values passed down by the main chart override
# these, ciliumNetworkPolicies.enabled included.
# openbao keeps its own policy (networkPolicy above).
ciliumNetworkPolicies:
  enabled: false
  policies:
    # vault-operator serves metrics only, nobody scrapes them.
    vault-operator-ingress:
      namespace: vault-operator
      endpointSelector: {}
      ingress:
        - fromEndpoints:
            - {}
    # vault-secrets-webhook, called by the apiserver.
    vault-infra-ingress:
      namespace: vault-infra
      endpointSelector: {}
      ingress:
        - fromEndpoints:
            - {}
    # ESO: webhook and cert-controller, called by the apiserver.
    external-secrets-ingress:
      namespace: external-secrets
      endpointSelector: {}
      ingress:
        - fromEndpoints:
            - {}

# Passed down by vault/main (openbao.*): the OpenbaoInstance of weebo-openbao.
openbao:
  enabled: false
