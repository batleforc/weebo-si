{{- if .Values.vaultInstance.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-https
  labels:
    app: vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/backend-protocol: "https"
    #traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/router.middlewares: traefik-vpn-only@kubernetescrd

    cert-manager.io/cluster-issuer: "vault-issuer"
    cert-manager.io/private-key-size: "4096"
    cert-manager.io/common-name: "{{ .Values.vaultInstance.dns }}"
    cert-manager.io/subject-organizations: "WeeboSI"
    cert-manager.io/subject-organizationalunits: "Infra"
spec:
  rules:
    - host: {{ .Values.vaultInstance.dns }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: openbao
                port:
                  number: 8200
  tls:
    - hosts:
        - {{ .Values.vaultInstance.dns }}
      secretName: {{ .Values.vaultInstance.dns | replace "." "-" }}-tls
{{- end -}}
