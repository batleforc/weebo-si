{{- if .Values.foundation.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.foundation.token.secretName }}
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: {{ .Values.foundation.token.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.foundation.secretStore.name }}
    kind: SecretStore
  target:
    name: {{ .Values.foundation.token.secretName }}
    template:
      type: Opaque
  data:
    # The operator reads this key verbatim; AuthentikInstance.spec.tokenSecretRef.key
    # below must stay in sync with it.
    - secretKey: token
      remoteRef:
        key: {{ .Values.foundation.token.vaultKey }}
        property: {{ .Values.foundation.token.vaultProperty }}
{{- end -}}
