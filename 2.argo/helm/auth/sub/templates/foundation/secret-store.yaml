{{- if and .Values.foundation.enabled .Values.foundation.secretStore.enabled -}}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.foundation.secretStore.name }}
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    ## Add this annotation to disable controller warning events for unmaintained stores
    external-secrets.io/disable-maintenance-checks: "true"
spec:
  provider:
    vault:
      server: "https://openbao.vault:8200"
      path: "mv"
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          # mv_reader_policy is templated on the caller's namespace, so it can
          # only read mv/auth/*. The bootstrap token lives at mv/main-config,
          # which needs the broader `auth` role (mv_policy) -- see
          # 2.terra/vault/terra-map/auth-base.tf.
          role: {{ .Values.foundation.secretStore.vaultRole | quote }}
          serviceAccountRef:
            name: {{ .Values.foundation.secretStore.serviceAccount | quote }}
{{- end -}}
