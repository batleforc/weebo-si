{{- if .Values.foundation.enabled -}}
apiVersion: authentik.weebo.io/v1alpha1
kind: AuthentikInstance
metadata:
  # Cluster-scoped. Only ONE may exist: AuthentikGroup/User/Brand/Flow/Outpost
  # carry no instanceRef and resolve against "the" instance, erroring with
  # AmbiguousDefaultInstance if there is more than one.
  name: {{ .Values.instanceRef }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  url: {{ .Values.foundation.url | quote }}
  tokenSecretRef:
    name: {{ .Values.foundation.token.secretName }}
    namespace: auth
    key: token
  secretStore:
    # `backend` stays kubernetes on purpose. It is the DEFAULT destination, used
    # only by an application that lists no `secretTargets` -- switching it to
    # vault would start writing mv/<pathPrefix>/auth/<crName>, a path layout
    # nothing consumes. Applications that must feed a real Vault path pin it
    # per-target instead; see values.yaml `applications.*.secretTargets`.
    backend: kubernetes
{{- if .Values.foundation.vault.enabled }}
    # Connection only. A `secretTargets` entry with backend `vault` reuses this
    # block for address/mount/auth and supplies just the path -- and the
    # operator hard-errors on such a target if this block is absent, so it has
    # to exist before the first phase-4 application is enabled.
    vault:
      address: {{ .Values.foundation.vault.address | quote }}
      mount: {{ .Values.foundation.vault.mount | quote }}
      kubernetesAuthMount: {{ .Values.foundation.vault.kubernetesAuthMount | quote }}
      # mv_policy, via 2.terra/vault/terra-map/auth-base.tf's `auth` role,
      # whose bound_service_account_names must list the operator's OWN
      # ServiceAccount, authentik-weebo-authentik. MIGRATION.md 3.2.
      kubernetesAuthRole: {{ .Values.foundation.vault.kubernetesAuthRole | quote }}
      pathPrefix: {{ .Values.foundation.vault.pathPrefix | quote }}
{{- with .Values.foundation.vault.caSecretRef }}
      # openbao serves a cert self-signed by the bank-vaults operator, which
      # nothing in the pod's system trust store chains to. The operator reads
      # this Secret over the Kubernetes API and feeds the PEM to its Vault
      # client (needs operator >= 0.8.0) -- the chart has no extraVolumes, so
      # there is no file to point a VAULT_CACERT at. MIGRATION.md 3.2.
      caSecretRef:
        name: {{ .name | quote }}
        namespace: {{ .namespace | quote }}
        key: {{ .key | quote }}
{{- end }}
{{- end }}
{{- end -}}
