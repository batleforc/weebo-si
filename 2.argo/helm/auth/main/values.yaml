dex:
  enabled: true
  # renovate: datasource=helm depName=dex registryUrl=https://charts.dexidp.io
  version: "0.24.1"
  issuer: "dex.weebo.poc"
  # The weebo connector's issuer and clientID are NOT pinned here: dex reads
  # both from mv/dex/auth (AUTHENTIK_URL / AUTHENTIK_CLIENT_ID), which is
  # written by whoever owns the che application. Hardcoding the issuer meant
  # keeping a second copy of "https://auth.weebo.poc/application/o/che-cluster/"
  # in sync with the che app's slug by hand.

authentik:
  enabled: true
  # renovate: datasource=helm depName=authentik registryUrl=https://charts.goauthentik.io
  version: 2026.8.0
  argoAuth:
    enabled: true
  operator:
    enabled: true
    # 0.7.0 adds the AuthentikFlow CRD (phase 2b) and per-application
    # `secretTargets` (the fan-out that unblocks phase 4); 0.8.0 adds
    # `secretStore.vault.caSecretRef`, without which the operator cannot
    # verify openbao's self-signed TLS and every Vault target fails its
    # reconcile. See MIGRATION.md 3.2.
    version: 0.8.0
    replicaCount: 1
  # Phase toggles for the adoption of the Terraform-managed Authentik objects
  # by the operator. Only the flags live here; every spec they switch on is in
  # 2.argo/helm/auth/sub/values.yaml, which this merges over.
  #
  # DO NOT flip one of these on its own -- each is the second half of a step
  # whose first half is importing the object's authentikId. Runbook:
  # 2.argo/helm/auth/MIGRATION.md
  sub:
    enabled: true
    foundation: # phase 0 -- AuthentikInstance + allow-list
      enabled: true
      secretStore:
        enabled: true
      namespacePolicy:
        enabled: true
      # Vault CONNECTION on the AuthentikInstance. The instance's default
      # backend stays `kubernetes`; this block only exists so that a phase-4
      # application may name an explicit `secretTargets` Vault path. Turning it
      # on alone writes nothing anywhere. Prerequisites in MIGRATION.md 3.2.
      vault:
        enabled: false
    identity: # phase 1 -- groups then users
      groups:
        enabled: false
      users:
        enabled: false
    brand: # phase 2a
      enabled: false
    flows: # phase 2b -- needs operator >= 0.7.0
      deviceCode:
        enabled: false
    applications:
      longhorn: # phase 3 -- proxy, safe
        enabled: false
      clickstack: # phase 3 -- proxy, verify forward_single after sync
        enabled: false
      harbor: # phase 4 -- oauth2. Order: harbor, s3, argo, che, vault
        enabled: false
      s3:
        enabled: false
      argo: # 0.8.0 writes the same issuer TF did, so no consumer fix (3.3)
        enabled: false
      che:
        enabled: false
      vault:
        enabled: false

dns:
  domain: auth.weebo.poc
  certificate:
    enabled: true
    name: auth-tls
    issuerRef: "vault-issuer"
    issuerRefKind: ClusterIssuer
  createWithCRD: false
  ipv4:
    enabled: true
    addresses:
      - ""
  ipv6:
    enabled: true
    addresses:
      - ""

repo: ""
project: ""
branch: ""
