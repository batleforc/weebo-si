dex:
  enabled: true
  # renovate: datasource=helm depName=dex registryUrl=https://charts.dexidp.io
  version: "0.26.0"
  issuer: "dex.weebo.poc"
  # The BatleHub theme of its pages (templates/dex/theme.yaml), built by
  # 3.custo/batlehub-theme into files/dex-theme/. `title` is frontend.issuer:
  # the tab title and "Log in to <title>".
  theme:
    enabled: true
    title: "Weebo Kube"
  # The weebo connector's issuer and clientID are NOT pinned here: dex reads
  # both from mv/dex/auth (AUTHENTIK_URL / AUTHENTIK_CLIENT_ID), which is
  # written by whoever owns the che application. Hardcoding the issuer meant
  # keeping a second copy of "https://auth.weebo.poc/application/o/che-cluster/"
  # in sync with the che app's slug by hand.

authentik:
  enabled: true
  # renovate: datasource=helm depName=authentik registryUrl=https://charts.goauthentik.io
  version: 2026.8.5
  argoAuth:
    enabled: true
    # argo-admin-auth, the client of the `weebo-admin` connector of Argo CD's
    # Dex (1.pulu-conf), read from mv/argocd/admin-auth.
    admin: true
  # The database, on CNPG (templates/authentik/postgres.yaml), as for forgejo
  # and batlehub. One instance: the cluster has one worker.
  postgres:
    enabled: true
    instances: 1
    database: authentik
    owner: authentik
    storage:
      size: 10Gi
      storageClassName: longhorn
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
  # The files of the BatleHub brand (fonts, logos, flow backgrounds), built by
  # 3.custo/batlehub-theme into files/theme/ and mounted on the server
  # (templates/authentik/theme.yaml). The brand CSS that uses them is set by
  # auth/sub (brand).
  theme:
    enabled: true
  # Outgoing mail from mv/auth/smtp, for the admin step-up notifications
  # (auth/sub, blueprints.items.admin-step-up-notify). OFF while
  # Stalwart is (2.argo/app/values.yaml, mail.enabled): the secret exists
  # (Terraform writes it regardless) but stalwart.mail.svc does not resolve,
  # so every send would fail and be retried. Off, the elevation notification
  # keeps only its Local transport (Authentik UI) and the events. Turn on
  # with mail.enabled: it also adds the email transport to that rule
  # (passed down to auth/sub as `authentikSmtp`, templates/authentik/sub-app.yaml).
  smtp:
    enabled: false
  operator:
    enabled: true
    # renovate: datasource=docker depName=ghcr.io/weebo-si-operator/charts/weebo-authentik
    # >= 0.23.0: AuthentikBlueprint (auth/sub, blueprints). 0.23.1: a proxy
    # provider PATCH carries internal_host (a flow change on longhorn /
    # clickstack was refused with a 400 before).
    version: 0.25.0
    replicaCount: 1
  sub:
    enabled: true
    foundation: # phase 0 -- AuthentikInstance + allow-list
      enabled: true
      secretStore:
        enabled: true
      namespacePolicy:
        enabled: true
      tls:
        caSecretRef:
          enabled: true
      vault:
        enabled: true
    identity: # phase 1 -- groups then users
      groups:
        enabled: true
      users:
        enabled: true
    brand: # phase 2a
      enabled: true
      theme:
        enabled: true
        # brandingCustomCss, from operator 0.22.0.
        css: true
        # The eleven built-in flows' titles and layout. Adopted by hand on
        # 2026-10-29 (created paused, status.authentikId seeded with the slug,
        # released), so these CRs already exist bound to their flows.
        flows:
          enabled: true
    flows: # phase 2b -- needs operator >= 0.7.0
      deviceCode:
        enabled: true
    applications:
      longhorn: # phase 3 -- proxy, safe
        enabled: true
      clickstack: # phase 3 -- proxy, verify forward_single after sync
        enabled: true
      # Was `harbor`, which no longer exists. Flipping this on DELETES the
      # harbor application and provider in Authentik before creating angos --
      # see the entry in sub/values.yaml.
      angos: # phase 4 -- oauth2. Order: angos, s3, argo, che, vault
        enabled: true
      s3:
        enabled: true
      argo: # 0.8.0 writes the same issuer TF did, so no consumer fix (3.3)
        enabled: true
      argo-admin: # Argo CD admin behind admin-step-up (1.pulu-conf, dex.config weebo-admin)
        enabled: true
      che:
        enabled: true
      # New, not adopted: che/main's endpoint-gateway reads its client from
      # mv/weebo-si-hardening/endpoint-gateway.
      endpoint-gateway:
        enabled: true
      # New, not adopted: 2.argo/helm/forgejo reads its client from
      # mv/forgejo/auth.
      forgejo:
        enabled: true
      # New, not adopted: 2.argo/helm/mail reads its client from mv/mail/auth.
      stalwart:
        enabled: true
      vault:
        enabled: false
      # New, not adopted: the OIDC client of OpenBao's namespaces (RFC 0007,
      # weebo-openbao), its secret at mv/weebo-openbao/oidc.
      openbao:
        enabled: true
      # New. The apiserver's admin issuer (1.pulu-init, jwt[1]), behind the
      # admin-step-up flow (blueprints below).
      kube-admin:
        enabled: true
    # AuthentikBlueprint CRs (operator >= 0.23.0), from auth/sub's
    # files/blueprints/: what no other kind models.
    blueprints:
      enabled: true

dns:
  domain: auth.weebo.poc
  certificate:
    enabled: true
    name: auth-tls
    issuerRef: "vault-issuer"
    issuerRefKind: ClusterIssuer
  createWithCRD: false
  ipv4:
    enabled: true
    addresses:
      - ""
  ipv6:
    enabled: true
    addresses:
      - ""

repo: ""
project: ""
branch: ""

# Egress of the operator (RFC 0007 §6.6): DNS and the API server, plus
# Authentik (auth.weebo.poc, through Traefik) and OpenBao (secretTargets). The
# operator chart's own CiliumNetworkPolicy (networkPolicy.kind, kit >=
# 0.32.0).
operatorNetworkPolicy:
  enabled: true
  kind: CiliumNetworkPolicy
  egress:
    enabled: true
    authentik:
      - toEndpoints:
          - matchLabels: { "k8s:io.kubernetes.pod.namespace": traefik, app.kubernetes.io/name: traefik }
        toPorts: [{ ports: [{ port: "8443", protocol: TCP }] }]
    vault:
      - toEndpoints:
          - matchLabels: { "k8s:io.kubernetes.pod.namespace": vault, vault_cr: openbao }
        toPorts: [{ ports: [{ port: "8200", protocol: TCP }] }]
