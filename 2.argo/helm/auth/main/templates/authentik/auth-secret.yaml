{{- if .Values.authentik.argoAuth.enabled -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-secret
  namespace: argocd
  annotations:
    sync-waves.argoproj.io/sync-wave: "5"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: auth
  target:
    name: argo-dev-auth
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        url: '{{ printf "{{"}} .url }}'
        client_id: '{{ printf "{{"}} .client_id }}'
        client_secret: '{{ printf "{{"}} .client_secret }}'
  data:
    - secretKey: url
      remoteRef:
        key: mv/argocd/auth
        property: AUTHENTIK_URL
    - secretKey: client_id
      remoteRef:
        key: mv/argocd/auth
        property: AUTHENTIK_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: mv/argocd/auth
        property: AUTHENTIK_CLIENT_SECRET
{{- end -}}
{{- if and .Values.authentik.argoAuth.enabled .Values.authentik.argoAuth.admin }}
---
# The argo-admin application (auth/sub): the `weebo-admin` connector of Argo
# CD's Dex reads it as $argo-admin-auth:<key> (1.pulu-conf, dex.config).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-admin-secret
  namespace: argocd
  annotations:
    sync-waves.argoproj.io/sync-wave: "5"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: auth
  target:
    name: argo-admin-auth
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      data:
        url: '{{ printf "{{"}} .url }}'
        client_id: '{{ printf "{{"}} .client_id }}'
        client_secret: '{{ printf "{{"}} .client_secret }}'
  data:
    - secretKey: url
      remoteRef:
        key: mv/argocd/admin-auth
        property: AUTHENTIK_URL
    - secretKey: client_id
      remoteRef:
        key: mv/argocd/admin-auth
        property: AUTHENTIK_CLIENT_ID
    - secretKey: client_secret
      remoteRef:
        key: mv/argocd/admin-auth
        property: AUTHENTIK_CLIENT_SECRET
{{- end }}
