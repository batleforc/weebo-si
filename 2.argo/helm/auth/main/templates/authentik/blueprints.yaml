{{- if and .Values.authentik.enabled .Values.authentik.blueprints.enabled -}}
---
# Authentik blueprints for what the weebo-authentik CRDs do not model (stages,
# stage bindings, notification rules, policies), from files/blueprints/.
# authentik.yaml lists this ConfigMap under the chart's `blueprints.configMaps`,
# which mounts it on the WORKER at /blueprints/mounted/cm-authentik-blueprints;
# the worker discovers every *.yaml there and applies it, again on every
# change and on its hourly schedule. Removing a file does not delete what it
# created: do that by hand.
#
# Each file goes through `tpl` with this chart's values, so a blueprint can
# follow a flag (admin-step-up-notify.yaml and authentik.smtp.enabled). Plain
# blueprints carry no template action, and render as they are.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: auth
  annotations:
    # Before the authentik Application: the worker pod waits on this volume.
    argocd.argoproj.io/sync-wave: "-1"
data:
  {{- range $path, $_ := .Files.Glob "files/blueprints/*.yaml" }}
  {{ base $path }}: {{ tpl ($.Files.Get $path) $ | toJson }}
  {{- end }}
{{- end -}}
