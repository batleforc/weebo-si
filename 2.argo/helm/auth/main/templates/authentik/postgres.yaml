{{- if and .Values.authentik.enabled .Values.authentik.postgres.enabled -}}
{{- $pg := .Values.authentik.postgres -}}
---
# Its own store rather than auth-app's `auth-vault`: that one comes with
# auth-app (wave 2), after the database Authentik needs to start. Same `auth`
# role -- mv_policy is what can read mv/main-config.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: authentik-db
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    external-secrets.io/disable-maintenance-checks: "true"
spec:
  provider:
    vault:
      server: "https://openbao.vault:8200"
      path: "mv"
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "auth"
          serviceAccountRef:
            name: "default"
---
# The role CNPG creates at bootstrap. Its password is the one Authentik
# already connects with: the chart's default config reads
# `env://POSTGRES_PASSWORD`, which vault-webhook fills from the same key on the
# server and worker pods -- so they need no change but the host. basic-auth
# because CNPG refuses a `bootstrap.initdb.secret` of any other type.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pg-cred
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: authentik-db
  target:
    name: authentik-pg-cred
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ $pg.owner | quote }}
        password: "{{ "{{" }} .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: mv/main-config
      property: AUTHENTIK_POSTGRES_USER_PASSWORD
---
# The database behind Authentik, reached at `authentik-pg-rw.auth.svc:5432`.
# No `imageName`, as for forgejo and batlehub: the operator picks the image
# matching its own version. Wave -1 orders the creation only: Argo CD (as
# installed by 1.pulu-conf) has no health check for postgresql.cnpg.io
# Clusters, so it does NOT wait for the import to finish before moving on to
# the `authentik` Application. The migration waits by hand.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: {{ $pg.instances }}
  storage:
    size: {{ $pg.storage.size }}
    storageClass: {{ $pg.storage.storageClassName }}
  {{- with $pg.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  bootstrap:
    initdb:
      database: {{ $pg.database }}
      owner: {{ $pg.owner }}
      secret:
        name: authentik-pg-cred
      {{- if $pg.import.enabled }}
      # One-shot copy of the chart's old PostgreSQL (pg_dump/pg_restore of
      # one database, so the major version can move up). CNPG only reads
      # `bootstrap` when it creates the Cluster: switching this off afterwards
      # changes nothing on the running database.
      import:
        type: microservice
        databases:
          - {{ $pg.database }}
        source:
          externalCluster: authentik-legacy
      {{- end }}
  {{- if $pg.import.enabled }}
  externalClusters:
    - name: authentik-legacy
      connectionParameters:
        host: {{ $pg.import.host }}
        user: {{ $pg.owner }}
        dbname: {{ $pg.database }}
        sslmode: disable
      password:
        name: authentik-pg-cred
        key: password
  {{- end }}
{{- end -}}
