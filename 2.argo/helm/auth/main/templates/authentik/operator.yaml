{{- if .Values.authentik.operator.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: authentik-operator
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  # The chart's CRDs carry empty `categories`, `shortNames` and
  # `additionalPrinterColumns` lists, which the API server drops on write, so
  # the app sat OutOfSync forever. Only the empty lists are ignored: a list
  # the chart fills in still shows up as a diff.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.names.categories | select(. == [])
        - .spec.names.shortNames | select(. == [])
        - .spec.versions[].additionalPrinterColumns | select(. == [])
  source:
    chart: weebo-authentik
    repoURL: oci://ghcr.io/batleforc/charts/weebo-authentik
    targetRevision: {{ .Values.authentik.operator.version }}
    helm:
      releaseName: authentik
      valuesObject:
        replicaCount: {{ .Values.authentik.operator.replicaCount }}
        image:
          tag: v{{ .Values.authentik.operator.version }}
        # Same story as vault-webhook: the chart defaults this on with
        # minAvailable: 1, which against a single replica pins
        # disruptionsAllowed at 0 -- verified by the operator pod refusing
        # eviction. It blocks node drains without protecting availability.
        # Re-enable alongside replicaCount > 1.
        podDisruptionBudget:
          enabled: false
        # Opts the operator into otel-node's annotation discovery. The chart
        # serves Prometheus metrics on the `metrics` container port (9090,
        # metrics.prometheus, on by default); the key is port-suffixed so the
        # webhook port is never scraped.
        podAnnotations:
          io.opentelemetry.discovery.metrics.9090/enabled: "true"
          io.opentelemetry.discovery.metrics.9090/scraper: "prometheus_simple"
          io.opentelemetry.discovery.metrics.9090/config: |
            collection_interval: "30s"
            endpoint: "`endpoint`"
            metrics_path: "/metrics"


{{- end -}}
