{{- if .Values.authentik.operator.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: authentik-operator
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: weebo-authentik
    repoURL: oci://ghcr.io/batleforc/charts/weebo-authentik
    targetRevision: {{ .Values.authentik.operator.version }}
    helm:
      releaseName: authentik
      valuesObject:
        replicaCount: {{ .Values.authentik.operator.replicaCount }}
        image:
          tag: v{{ .Values.authentik.operator.version }}
        # Same story as vault-webhook: the chart defaults this on with
        # minAvailable: 1, which against a single replica pins
        # disruptionsAllowed at 0 -- verified by the operator pod refusing
        # eviction. It blocks node drains without protecting availability.
        # Re-enable alongside replicaCount > 1.
        podDisruptionBudget:
          enabled: false


{{- end -}}
