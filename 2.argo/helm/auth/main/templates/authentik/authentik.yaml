{{- if .Values.authentik.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  labels:
    app.kubernetes.io/name: authentik
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
    # Without it, Replace=true re-PUTs every object on every sync. Added on
    # 2026-10-18 when vault-secrets-webhook still mutated Secrets and rejected
    # every write of the `authentik` Secret (its `vault:` refs, an address
    # that no longer resolved); secret mutation is now off
    # (2.argo/helm/vault/main/templates/hook/hook.yaml). Kept: re-PUTting
    # unchanged objects buys nothing.
    - ApplyOutOfSyncOnly=true
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: authentik
    repoURL: https://charts.goauthentik.io
    targetRevision: {{ .Values.authentik.version }}
    helm:
      releaseName: authentik
      valuesObject:
        global:
          env:
            - name: POSTGRES_PASSWORD
              value: "vault:mv/data/main-config#AUTHENTIK_POSTGRES_USER_PASSWORD"
            # Task history (authentik_tasks_task + _tasklog) kept 7 days
            # instead of 30. ~65k tasks a day here, 94% event triggers fired
            # by the weebo-authentik operator re-writing unchanged objects
            # every reconcile: 2.4 GB of the database's 3 GB on 2026-10-18.
            # The worker purges daily (worker.task_purge_interval). Event
            # retention itself is a tenant setting, not an env: set to
            # days=90 in the database the same day (see left-todo).
            - name: AUTHENTIK_WORKER__TASK_EXPIRATION
              value: "days=7"
          {{- if .Values.authentik.postgres.enabled }}
            # CNPG's read-write Service, which follows the primary. Set here
            # and not as authentik.postgresql.host because, at the migration,
            # the chart's `authentik` Secret could not be updated (see
            # ApplyOutOfSyncOnly above). An explicit env wins over the
            # Secret's envFrom, so the Secret's stale AUTHENTIK_POSTGRESQL__HOST
            # is never read. User and database keep the chart defaults
            # (authentik/authentik).
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-pg-rw
          {{- end }}
          podAnnotations:
            inject-certs: "enabled"
            vault.security.banzaicloud.io/vault-addr: "https://openbao.vault:8200"
            vault.security.banzaicloud.io/vault-role: "auth"
            vault.security.banzaicloud.io/vault-path: "kubernetes"
            vault.security.banzaicloud.io/vault-tls-secret: "openbao-tls"
        authentik:
          bootstrap_token: "vault:mv/data/main-config#AUTHENTIK_BOOTSTRAP_TOKEN"
          bootstrap_password: "vault:mv/data/main-config#AUTHENTIK_BOOTSTRAP_PASSWORD"
          secret_key: "vault:mv/data/main-config#AUTHENTIK_SECRET_KEY"
          error_reporting:
            enabled: true

        server:
          ingress:
            ingressClassName: traefik
            enabled: true
            hosts:
            - {{ .Values.dns.domain }}
            https: false
            tls:
            - secretName: {{ .Values.dns.certificate.name }}
              hosts:
              - {{ .Values.dns.domain }}
          # /dev/shm leak, which crash-looped the server on 2026-10-18 from
          # 07:59 to 12:00 (4978 gunicorn workers killed by SIGBUS). gunicorn
          # recycles a worker every `web.max_requests` (1000, ~62 a day here).
          # Each new worker writes prometheus multiprocess files keyed by its
          # PID (counter_/gauge_all_/histogram_<pid>.db, ~28 KiB) into
          # /dev/shm/authentik_prometheus_tmp, and gunicorn.conf.py's
          # worker_exit only clears the files keyed by worker number. /dev/shm
          # is the pod's (64 MiB by default) and outlives container restarts,
          # so ~1.7 MiB a day fills it in ~39 days -- the old pod's exact age
          # -- and every worker then dies on its first mmap write.
          # Both settings below only slow it down; a new pod starts empty.
          env:
            - name: AUTHENTIK_WEB__MAX_REQUESTS
              # ~6 recycles a day instead of ~62. Server RSS was 734Mi of its
              # 2Gi limit with 1000.
              value: "10000"
          volumes:
            - name: dshm
              emptyDir:
                # tmpfs, counted against the pod's memory only for what is
                # actually written.
                medium: Memory
                sizeLimit: 256Mi
          {{- if .Values.authentik.theme.enabled }}
            # The BatleHub brand's files (templates/authentik/theme.yaml),
            # served as /static/dist/assets/batlehub.
            - name: theme
              configMap:
                name: authentik-theme
                items:
                {{- range include "authentik.theme.files" . | trim | splitList "\n" | compact }}
                  - key: {{ include "authentik.theme.key" . }}
                    path: {{ trimPrefix "files/theme/" . }}
                {{- end }}
          {{- end }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
          {{- if .Values.authentik.theme.enabled }}
            - name: theme
              mountPath: /web/dist/assets/batlehub
              readOnly: true
          {{- end }}
        # The database is CNPG's (templates/authentik/postgres.yaml), not the
        # chart's bundled Bitnami PostgreSQL -- off upstream by default, and
        # stated here so a chart bump can't bring it back.
        postgresql:
          enabled: false

{{- end -}}
