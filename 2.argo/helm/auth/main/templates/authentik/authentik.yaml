{{- if .Values.authentik.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  labels:
    app.kubernetes.io/name: authentik
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
    # Without it, Replace=true re-PUTs every object on every sync, the two
    # Secrets carrying `vault:` references included. vault-secrets-webhook
    # intercepts those and, unable to reach Vault for a Secret (it falls back
    # to https://vault:8200, which no longer resolves), rejects the write:
    # the whole sync failed even with nothing to change in them.
    - ApplyOutOfSyncOnly=true
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: authentik
    repoURL: https://charts.goauthentik.io
    targetRevision: {{ .Values.authentik.version }}
    helm:
      releaseName: authentik
      valuesObject:
        global:
          env:
            - name: POSTGRES_PASSWORD
              value: "vault:mv/data/main-config#AUTHENTIK_POSTGRES_USER_PASSWORD"
          {{- if .Values.authentik.postgres.enabled }}
            # CNPG's read-write Service, which follows the primary. Set here
            # and not as authentik.postgresql.host: that one lands in the
            # chart's `authentik` Secret, which vault-secrets-webhook refuses
            # to let anyone update (see ApplyOutOfSyncOnly above). An explicit
            # env wins over the Secret's envFrom. User and database keep the
            # chart defaults (authentik/authentik).
            - name: AUTHENTIK_POSTGRESQL__HOST
              value: authentik-pg-rw
          {{- end }}
          podAnnotations:
            inject-certs: "enabled"
            vault.security.banzaicloud.io/vault-addr: "https://openbao.vault:8200"
            vault.security.banzaicloud.io/vault-role: "auth"
            vault.security.banzaicloud.io/vault-path: "kubernetes"
            vault.security.banzaicloud.io/vault-tls-secret: "openbao-tls"
        authentik:
          bootstrap_token: "vault:mv/data/main-config#AUTHENTIK_BOOTSTRAP_TOKEN"
          bootstrap_password: "vault:mv/data/main-config#AUTHENTIK_BOOTSTRAP_PASSWORD"
          secret_key: "vault:mv/data/main-config#AUTHENTIK_SECRET_KEY"
          error_reporting:
            enabled: true

        server:
          ingress:
            ingressClassName: traefik
            enabled: true
            hosts:
            - {{ .Values.dns.domain }}
            https: false
            tls:
            - secretName: {{ .Values.dns.certificate.name }}
              hosts:
              - {{ .Values.dns.domain }}
        # The database is CNPG's (templates/authentik/postgres.yaml), not the
        # chart's bundled Bitnami PostgreSQL -- off upstream by default, and
        # stated here so a chart bump can't bring it back.
        postgresql:
          enabled: false

{{- end -}}
