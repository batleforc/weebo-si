{{- if .Values.dex.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dex
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
  source:
    chart: dex
    repoURL: https://charts.dexidp.io
    targetRevision: {{ .Values.dex.version }}
    helm:
      releaseName: dex
      valuesObject:
        podAnnotations:
          vault.security.banzaicloud.io/vault-addr: "https://openbao.vault:8200"
          vault.security.banzaicloud.io/vault-role: "auth-read"
          vault.security.banzaicloud.io/vault-path: "kubernetes"
          vault.security.banzaicloud.io/vault-tls-secret: "openbao-tls"
          inject-certs: "enabled"
        config:
          issuer: "https://{{ .Values.dex.issuer }}"
          storage:
            type: kubernetes
            config:
              inCluster: true
          enablePasswordDB: false
          oauth2:
            skipApprovalScreen: true
          connectors:
          - type: oidc
            id: weebo
            name: weebo
            config:
              # Same source as clientID/clientSecret below: the per-application
              # OIDC issuer authentik itself publishes, not a second copy of it
              # maintained here. mv/dex/auth is written by the che application
              # (2.terra/auth/terra-map/che-cluster.tf today, its
              # AuthentikApplication's secretTargets after the migration), so
              # this tracks the slug automatically instead of drifting from it.
              issuer: $AUTHENTIK_URL
              clientID: $AUTHENTIK_CLIENT_ID
              redirectURI: "https://dex.weebo.poc/callback"
              clientSecret: $AUTHENTIK_CLIENT_SECRET
              insecureEnableGroups: true
              scopes:
                - openid
                - email
                - profile
                - offline_access
          staticClients:
          - id: weebo-kube
            redirectURIs:
            - 'https://dex.weebo.poc/callback'
            - 'http://localhost:8000'
            name: 'Kube App'
            secretEnv: KUBE_CLIENT_SECRET

        envVars:
          - name: "AUTHENTIK_URL"
            value: "vault:mv/data/dex/auth#AUTHENTIK_URL"
          - name: "AUTHENTIK_CLIENT_SECRET"
            value: "vault:mv/data/dex/auth#AUTHENTIK_CLIENT_SECRET"
          - name: "AUTHENTIK_CLIENT_ID"
            value: "vault:mv/data/dex/auth#AUTHENTIK_CLIENT_ID"
          - name: "KUBE_CLIENT_SECRET"
            value: "vault:mv/data/dex/config#KUBE_CLIENT_SECRET"
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: "vault-issuer"
            cert-manager.io/private-key-size: "4096"
            cert-manager.io/common-name: "{{ .Values.dex.issuer }}"
            cert-manager.io/subject-organizations: "WeeboSI"
            cert-manager.io/subject-organizationalunits: "Infra"
          hosts:
          - host: {{ .Values.dex.issuer }}
            paths:
              - path: /
                pathType: ImplementationSpecific
          tls:
            - hosts:
              - {{ .Values.dex.issuer }}
              secretName: dex-tls
  destination:
    name: "in-cluster"
    namespace: dex
{{- end -}}
