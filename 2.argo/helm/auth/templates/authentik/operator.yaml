{{- if .Values.authentik.operator.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik-operator
  namespace: argocd
  labels:
    app.kubernetes.io/name: authentik-operator
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - Replace=true
  destination:
    namespace: auth
    server: https://kubernetes.default.svc
  project: {{ .Values.project }}
  source:
    chart: weebo-authentik
    repoURL: oci://ghcr.io/batleforc/charts/weebo-authentik
    targetRevision: {{ .Values.authentik.operator.version }}
    helm:
      releaseName: authentik
      valuesObject:
        replicaCount: {{ .Values.authentik.operator.replicaCount }}


{{- end -}}
