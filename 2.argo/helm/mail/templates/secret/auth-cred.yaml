---
# Written to Vault by the authentik operator: the `stalwart` application in
# 2.argo/helm/auth/sub carries `secretTargets: [{backend: vault, path:
# mail/auth}]`. The issuer (AUTHENTIK_URL, `<url>/application/o/stalwart/`)
# and the client id (the tokens' `aud`) feed the plan's Oidc directory.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-oidc
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: stalwart-oidc
  data:
  - secretKey: issuer
    remoteRef:
      key: mv/mail/auth
      property: AUTHENTIK_URL
  - secretKey: clientId
    remoteRef:
      key: mv/mail/auth
      property: AUTHENTIK_CLIENT_ID
