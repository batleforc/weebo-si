---
# The phase-0 sending accounts' passwords, one key per account: the bootstrap
# plan sets them on the accounts. Terraform writes the same values to each
# app's mv/<namespace>/smtp. Gone in phase 1 (RFC 0001, D21).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-accounts
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: stalwart-accounts
  dataFrom:
  - extract:
      key: mv/mail/accounts
