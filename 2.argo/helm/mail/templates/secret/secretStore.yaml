# Vault, read-only, mv/mail/* only: the `mail-read` role of
# 2.terra/vault/terra-map/mail.tf. Not `auth-read`, whose namespace-templated
# policy also lets a namespace write mv/<ns>/config and mv/<ns>/sub.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: cred-store
  namespace: {{ .Release.Namespace }}
  annotations:
    external-secrets.io/disable-maintenance-checks: "true"
spec:
  provider:
    vault:
      server: "https://openbao.vault:8200"
      path: "mv"
      caProvider:
        type: Secret
        name: openbao-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "mail-read"
          serviceAccountRef:
            name: "default"
