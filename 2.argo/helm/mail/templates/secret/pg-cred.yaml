---
# The role CNPG creates at bootstrap, and the password Stalwart's DataStore
# connects with (STALWART_DB_PASSWORD, read by config.json). basic-auth because
# CNPG refuses a `bootstrap.initdb.secret` of any other type.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-pg-cred
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: stalwart-pg-cred
    template:
      type: kubernetes.io/basic-auth
      data:
        username: "{{ "{{" }}.username}}"
        password: "{{ "{{" }}.password}}"
  data:
  - secretKey: username
    remoteRef:
      key: mv/mail/pg
      property: username
  - secretKey: password
    remoteRef:
      key: mv/mail/pg
      property: password
