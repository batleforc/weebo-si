---
# The recovery admin: STALWART_RECOVERY_ADMIN (`<user>:<password>`) on the
# server, the break-glass account, and the identity of the bootstrap Job. Like
# mv/forgejo/admin, Vault is the only place it is written.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-admin
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: stalwart-admin
    template:
      data:
        username: "{{ "{{" }}.username}}"
        password: "{{ "{{" }}.password}}"
        recovery: "{{ "{{" }}.username}}:{{ "{{" }}.password}}"
  data:
  - secretKey: username
    remoteRef:
      key: mv/mail/admin
      property: username
  - secretKey: password
    remoteRef:
      key: mv/mail/admin
      property: password
