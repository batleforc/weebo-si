---
# The RustFS user's keys. The tenant in 2.argo/helm/database/sub reads the same
# mv/mail/s3 to create that user. Stalwart reads them from its environment
# (the BlobStore's `EnvironmentVariable` secrets): they never enter the plan.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-s3-cred
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: stalwart-s3-cred
  data:
  - secretKey: accesskey
    remoteRef:
      key: mv/mail/s3
      property: accesskey
  - secretKey: secretkey
    remoteRef:
      key: mv/mail/s3
      property: secretkey
