---
# Everything ClusterIP: nothing is exposed outside the cluster but HTTPS,
# through Traefik. No SMTP 25 (RFC 0001, D22): local delivery does not go
# through SMTP, and apps submit on 587.
apiVersion: v1
kind: Service
metadata:
  name: stalwart
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: stalwart
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stalwart
  ports:
    # STARTTLS. Before it, only XOAUTH2/OAUTHBEARER are offered; after it,
    # PLAIN and LOGIN.
    - name: submission
      port: 587
      targetPort: submission
    - name: imaps
      port: 993
      targetPort: imaps
    # WebUI and JMAP, behind Traefik.
    - name: https
      port: 443
      targetPort: https
    # Management: health, and the API the bootstrap and the operator use.
    - name: http
      port: 8080
      targetPort: http
