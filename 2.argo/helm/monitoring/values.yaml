repo: ""
branch: ""
project: ""

clickstack:
  enabled: true
  domain: clickstack.weebo.poc
  # Retention baked into the otel_* tables by the gateway collector's clickhouse
  # exporter. Upstream default is 720h (30d), which is what drives most of the
  # disk and background-merge cost on a small cluster.
  tablesTtl: 168h
  # ClickHouse's own server logger verbosity, rendered into the
  # ClickHouseCluster CR. The operator's default is `trace`, and on this
  # cluster that made ClickHouse by far the loudest workload in its own
  # database: 1.13M lines an hour, 56% of them debug and trace, tailed off
  # stdout by otel-node and written straight back into ClickHouse -- where the
  # extra parts drove the background merges that were hitting the 4.5 GiB
  # query memory limit, whose exceptions were then logged. `information` cuts
  # that feedback loop at the source, before a line is written at all, which
  # is the only place it costs nothing.
  #
  # This and otel.node.dedupInterval are meant to ship together: dropping
  # debug/trace here leaves a remainder that is mostly repeated stack frames,
  # which is exactly what dedup collapses. Measured over 10 minutes on that
  # pod, the pair take 203,930 lines down to 8,220 stored rows.
  #
  # Raise it back to `debug` or `trace` while actually debugging ClickHouse,
  # and put it back afterwards. Accepted values are the server's own:
  # test, trace, debug, information, notice, warning, error, critical, fatal.
  clickhouseLogLevel: information
  # Ceiling for mark_cache_size and index_mark_cache_size, in bytes (512 MiB).
  # ClickHouse defaults both to 5 GiB apiece -- sizing for a dedicated host,
  # left untouched here -- so the server advertises 10 GiB of cache inside a
  # container whose whole budget is the 4.5 GiB it derives from the 5Gi limit.
  #
  # This is a consistency fix, not an incident waiting to happen, and the
  # measurement is worth keeping because it is counter-intuitive: the marks for
  # every active part in the database total 12.75 MiB, and the two caches sit at
  # 107 KiB and 101 KiB. Neither can approach 5 GiB without roughly 400x the
  # current data, so the oversized default costs nothing today. What it does is
  # leave a cache able to crowd out queries and merges if this ever grows into
  # a real dataset, and make the memory budget impossible to reason about.
  #
  # 512 MiB is ~40x the marks that exist and ~10% of the memory budget each, so
  # the caches can no longer dominate while still never evicting anything real.
  # Both are changeable_without_restart, so this reloads in place.
  #
  # Do not read the mark cache hit rate (89.5k hits against 8.1M misses) as a
  # symptom of the size: parts here are created by ingest and destroyed by TTL
  # merges faster than they are ever re-read, so almost every mark read is for a
  # part that has never been seen before. A larger cache cannot fix that, and a
  # smaller one does not cause it.
  markCacheSize: 536870912
  # ClickHouse's own system log tables. The operator switches all five on in
  # config.d/00-logs-tables.yaml with nothing but their names, so they inherit
  # the upstream defaults -- and upstream ships them with no retention at all.
  # They had grown to 5.38 GiB of the 10.82 GiB in the database, with text_log
  # alone (4.28 GiB, 90M rows) larger than otel_logs (2.74 GiB): more disk spent
  # on ClickHouse describing itself than on the telemetry it exists to hold.
  # clickhouseLogLevel caps how fast these fill; this caps how long they keep
  # what they collected.
  systemLogs:
    # Retention for every table below, as a ClickHouse INTERVAL. Applied as a
    # table TTL, so rows expire during the background merges that already run.
    ttl: 3 DAY
    # system.metric_log is 1433 columns wide -- one per ProfileEvent and
    # CurrentMetric. A horizontal merge of a Wide part opens a write buffer per
    # column, which lands around 4.5 GiB: exactly max_server_memory_usage, which
    # the server derives as 0.9 x the 5Gi container limit. So every merge threw
    # MEMORY_LIMIT_EXCEEDED, logged a full stack trace, and was retried at once
    # -- 114 traces in the first two minutes of pod life, and no progress ever.
    # This is upstream's own bug (ClickHouse PR #89811): wide parts start at
    # 10 MiB while the vertical merge algorithm only engages at 131072 rows, and
    # metric_log falls in the gap.
    #
    # Nothing in this repo reads the table, and the same counters are served by
    # the server's Prometheus endpoint on :9363, so removing it loses no signal.
    # Set it back to true only together with the upstream mitigation -- an
    # `engine` override raising min_bytes_for_wide_part to 512 MiB so the parts
    # stay Compact -- otherwise the merge loop comes straight back.
    metricLog: false
  # Vault path holding the first HyperDX account, consumed by the bootstrap Job
  # so the signup form never has to be opened by hand.
  bootstrap:
    enabled: true
    mongoshImage: "mongo:7"
    curlImage: "curlimages/curl:8.11.1"

  preauth:
    enabled: true
    repo: https://github.com/batleforc/weebo-si-hardening
    revision: main
    image:
      repository: ghcr.io/batleforc/preauth-proxy
      tag: main
  # Dashboards are reconciled from dashboards/*.json (chart root) by the
  # clickstack-dashboards Job, which logs in with the bootstrap admin account
  # and drives the same /dashboards routes the UI does -- hence the dependency
  # on bootstrap.enabled. See dashboards/README.md for the round trip.
  dashboards:
    enabled: true
    pythonImage: "python:3.13-alpine"
    # Stamped as a tag on every dashboard this repo owns. Dashboards without it
    # were built by hand in the UI and are never updated or pruned.
    managedTag: "managed-by-argocd"
    # Delete managed dashboards whose JSON file was removed from git. Turning
    # this off makes the Job additive, at the cost of leaving orphans behind.
    prune: true
    # Log the planned changes and exit without touching the instance.
    dryRun: false
    # Names deleted outright, tag or no tag -- the escape hatch for dashboards
    # created in the UI. A name here must not also have a file in dashboards/.
    delete: []

# Shared ingestion plumbing: one Vault-held key, fanned out to every namespace
# labelled with otel.ingestLabel, plus the Kubernetes-wide collectors.
otel:
  enabled: true
  # renovate: datasource=helm depName=opentelemetry-collector registryUrl=https://open-telemetry.github.io/opentelemetry-helm-charts
  version: "0.171.1"
  clusterName: weebo-si
  ingestLabel: weebo.io/otel-ingest
  ingestSecret: clickstack-ingest
  # Pod-template annotation that opts a workload out of log collection, applied
  # by otel-node's filter/logs processor. Set it to "false" on the pod template
  # to drop that pod's logs.
  logsAnnotation: weebo.io/logs
  # ClickStack's own gateway collector, which is OpAMP-driven by HyperDX and so
  # cannot have receivers added to it -- everything below ships to it via OTLP.
  endpoint:
    grpc: http://clickstack-otel-collector.monitoring:4317
    http: http://clickstack-otel-collector.monitoring:4318
  # DaemonSet: pod logs, node metrics, kubelet metrics.
  node:
    enabled: true
    # Log files the agent never opens -- the only way to spend zero CPU/IO on a
    # workload's logs. Each entry is a glob against the
    # <namespace>_<pod>_<uid>/<container> part of the path; the
    # /var/log/pods/ prefix and /*.log suffix are added automatically.
    # Examples:
    #   - kube-system_*/*        drop a whole namespace
    #   - '*/istio-proxy'        drop one sidecar everywhere
    #   - default_noisy-app-*/*  drop one workload
    logExcludes: []
    # filelog polls every matched file on this interval; upstream default is
    # 200ms, which is far more than a homelab needs.
    pollInterval: 1s
    # Collapse byte-identical log records seen within this window into one,
    # carrying a `log_count` attribute. Empty string removes the processor.
    #
    # Aimed at the failure mode where a workload prints the same stack trace
    # thousands of times: the frames are byte-identical and collapse, while
    # ordinary lines (which carry a timestamp or an id) never match and pass
    # through untouched. Costs up to this much latency on every log record,
    # since a window has to close before it is emitted.
    dedupInterval: 10s
    # Drop log records below this OTel severity.
    #
    # DEAD, and left here as documentation of why rather than as a knob:
    # nothing in this agent's pipeline sets a severity. filelog's `container`
    # operator parses the CRI wrapper (time, stream, logtag) and leaves
    # severity_number at 0, and the `severity_number > 0` guard the condition
    # needs -- without which it would drop every unparsed log in the cluster --
    # is therefore never true. Measured:
    # otelcol_processor_filter_logs.filtered_total moved by 0 over an hour in
    # which 1.1M debug/trace lines were ingested.
    #
    # The severity visible in HyperDX is inferred much later, by the gateway
    # collector, which scans the first 256 characters of the body for a level
    # keyword. That is downstream of here and cannot be filtered on from here.
    # Restoring this knob means parsing severity at the agent first -- and note
    # the gateway's keyword scan is only a guess: it reads a ClickHouse stack
    # frame as `info` and any INFO line containing the word "error" as `error`.
    #
    # Setting it to a severity re-enables a condition that still does nothing.
    minSeverity: ""
  # Deployment: cluster-level metrics and Kubernetes events.
  cluster:
    enabled: true

obi:
  enabled: true
  # renovate: datasource=helm depName=opentelemetry-ebpf-instrumentation registryUrl=https://open-telemetry.github.io/opentelemetry-helm-charts
  version: "0.13.0"
  # Network flow metrics, on top of the application traces OBI produces by
  # default. IP-level and per-flow, so this is the noisier, more expensive half
  # of OBI -- the flag is the rollback switch that keeps tracing working if the
  # extra eBPF work or the flow cardinality turns out not to be worth it. Until
  # 2026-08-16 this was spelt `enabled` in the config and had never been on.
  networkFlows: true
