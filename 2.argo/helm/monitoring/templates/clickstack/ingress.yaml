{{- if .Values.clickstack.enabled -}}
{{- $preauth := .Values.clickstack.preauth.enabled -}}
{{- $service := ternary "clickstack-preauth" "clickstack" $preauth -}}
{{- $port := ternary 8080 3000 $preauth -}}
# ⚠ With clickstack.preauth.enabled, the `authentik` middleware below is not
# defence in depth -- it is the only authentication on this route. Everything it
# lets through reaches preauth.yaml's proxy, which hands every request a
# full-privilege HyperDX session without asking who is holding it. Dropping the
# middleware, or routing to clickstack-preauth from anywhere else, publishes
# HyperDX to whoever can reach that Service. See preauth.yaml and RFC 0003.
#
# Rollback is `clickstack.preauth.enabled: false`: the route goes back to
# clickstack:3000 unguarded, HyperDX serves its own login form again, and the
# proxy Application is removed. Nothing persisted has to be unwound.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clickstack
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: clickstack
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.clickstack.domain }}`)
      priority: 10
      services:
        - name: {{ $service }}
          namespace: {{ .Release.Namespace }}
          port: {{ $port }}
          passHostHeader: true
      {{- if $preauth }}
      middlewares:
        - name: authentik
          namespace: auth
      {{- end }}
    {{- if $preauth }}
    # HyperDX's API calls. Same gate, but an expired session gets a 401 instead
    # of a 302 into the login flow (clickstack-api-auth below): HyperDX's own
    # fetch of /api/me used to follow that 302 to auth.weebo.poc, overwrite the
    # page's pending flow in the authentik session, and land the browser on
    # /api/me after login.
    - kind: Rule
      match: Host(`{{ .Values.clickstack.domain }}`) && PathPrefix(`/api/`)
      priority: 12
      services:
        - name: {{ $service }}
          namespace: {{ .Release.Namespace }}
          port: {{ $port }}
          passHostHeader: true
      middlewares:
        - name: clickstack-api-origin
        - name: clickstack-api-auth
    - kind: Rule
      match: Host(`{{ .Values.clickstack.domain }}`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 15
      services:
        - name: authentik-server
          namespace: auth
          port: 80
          passHostHeader: true
    # Must outrank the rule above, which would otherwise hand this exact path to
    # the outpost and serve the blank 200 that the redirect exists to avoid. The
    # service is never reached -- the middleware answers with a 302 first -- but
    # a route needs one, so it points at the app it redirects to.
    - kind: Rule
      match: Host(`{{ .Values.clickstack.domain }}`) && Path(`/outpost.goauthentik.io/auth/traefik`)
      priority: 20
      services:
        - name: {{ $service }}
          namespace: {{ .Release.Namespace }}
          port: {{ $port }}
          passHostHeader: true
      middlewares:
        - name: authentik-auth-landing
          namespace: auth
    {{- end }}
  tls:
    secretName: clickstack-tls
{{- if $preauth }}
---
# The outpost's nginx endpoint answers 401 when unauthenticated, where the
# traefik one redirects; it reads the request URL from X-Original-URL alone,
# which Traefik does not send. Any URL of the host will do: it only has to
# parse and not be an /outpost.goauthentik.io path.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: clickstack-api-origin
  namespace: {{ .Release.Namespace }}
spec:
  headers:
    customRequestHeaders:
      X-Original-URL: "https://{{ .Values.clickstack.domain }}/api/"
---
# Same session check as auth/authentik (one outpost cookie), 401 instead of a
# redirect. Still the only authentication in front of preauth on this path.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: clickstack-api-auth
  namespace: {{ .Release.Namespace }}
spec:
  forwardAuth:
    address: http://authentik-server.auth.svc.cluster.local/outpost.goauthentik.io/auth/nginx
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-uid
{{- end }}
{{- end -}}
