{{- if .Values.clickstack.enabled -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: clickstack
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: clickstack
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.clickstack.domain }}`)
      priority: 10
      services:
        - name: clickstack
          namespace: {{ .Release.Namespace }}
          port: 3000
          passHostHeader: true
    #   middlewares:
    #     - name: authentik
    #       namespace: auth
    # - kind: Rule
    #   match: Host(`{{ .Values.clickstack.domain }}`) && PathPrefix(`/outpost.goauthentik.io/`)
    #   priority: 15
    #   services:
    #     - name: authentik-server
    #       namespace: auth
    #       port: 80
    #       passHostHeader: true
  tls:
    secretName: clickstack-tls
{{- end -}}
