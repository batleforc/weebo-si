{{- if .Values.clickstack.enabled -}}
---
# Consumed by the clickstack chart's HyperDX app deployment and otel-collector
# via envFrom (secret name "clickstack-secret" is expected verbatim by the
# vendored chart). Also feeds MONGO_URI, which overrides the broken
# empty-password value baked into the chart's own clickstack-config ConfigMap
# since envFrom lists the ConfigMap before this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: monitoring-store
  target:
    name: clickstack-secret
    template:
      engineVersion: v2
      data:
        HYPERDX_API_KEY: '{{ "{{" }} .HYPERDX_API_KEY {{ "}}" }}'
        CLICKHOUSE_APP_PASSWORD: '{{ "{{" }} .CLICKHOUSE_APP_PASSWORD {{ "}}" }}'
        CLICKHOUSE_PASSWORD: '{{ "{{" }} .CLICKHOUSE_OTEL_PASSWORD {{ "}}" }}'
        CLICKHOUSE_ADMIN_PASSWORD: '{{ "{{" }} .CLICKHOUSE_ADMIN_PASSWORD {{ "}}" }}'
        MONGODB_PASSWORD: '{{ "{{" }} .MONGODB_PASSWORD {{ "}}" }}'
        MONGO_URI: 'mongodb://hyperdx:{{ "{{" }} .MONGODB_PASSWORD {{ "}}" }}@clickstack-mongodb-svc:27017/hyperdx?authSource=hyperdx'
  data:
  - secretKey: HYPERDX_API_KEY
    remoteRef:
      key: mv/monitoring/config
      property: HYPERDX_API_KEY
  - secretKey: CLICKHOUSE_APP_PASSWORD
    remoteRef:
      key: mv/monitoring/config
      property: CLICKHOUSE_APP_PASSWORD
  - secretKey: CLICKHOUSE_OTEL_PASSWORD
    remoteRef:
      key: mv/monitoring/config
      property: CLICKHOUSE_OTEL_PASSWORD
  - secretKey: CLICKHOUSE_ADMIN_PASSWORD
    remoteRef:
      key: mv/monitoring/config
      property: CLICKHOUSE_ADMIN_PASSWORD
  - secretKey: MONGODB_PASSWORD
    remoteRef:
      key: mv/monitoring/config
      property: MONGODB_PASSWORD
---
# Bridges MONGODB_PASSWORD to the key name ("password") the MongoDB Community
# operator hardcodes for passwordSecretRef. Referenced by
# mongodb.spec.users[0].passwordSecretRef.name in clickstack.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-mongo-password
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: monitoring-store
  target:
    name: clickstack-mongo-password
  data:
  - secretKey: password
    remoteRef:
      key: mv/monitoring/config
      property: MONGODB_PASSWORD
---
# Pre-rendered HyperDX connections.json/sources.json, consumed via
# hyperdx.deployment.useExistingConfigSecret in clickstack.yaml. sources.json
# is copied verbatim from the chart's own default (no credentials in it);
# connections.json embeds the ClickHouse "app" user password from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-hyperdx-config
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: monitoring-store
  target:
    name: clickstack-hyperdx-config
    template:
      engineVersion: v2
      data:
        connections.json: |
          [
            {
              "name": "Local ClickHouse",
              "host": "http://clickstack-clickhouse-clickhouse-headless:8123",
              "port": 8123,
              "username": "app",
              "password": "{{ "{{" }} .CLICKHOUSE_APP_PASSWORD {{ "}}" }}"
            }
          ]
        sources.json: |
          [
            {
              "from": {
                "databaseName": "default",
                "tableName": "otel_logs"
              },
              "kind": "log",
              "timestampValueExpression": "Timestamp",
              "name": "Logs",
              "displayedTimestampValueExpression": "Timestamp",
              "implicitColumnExpression": "Body",
              "serviceNameExpression": "ServiceName",
              "bodyExpression": "Body",
              "eventAttributesExpression": "LogAttributes",
              "resourceAttributesExpression": "ResourceAttributes",
              "defaultTableSelectExpression": "Timestamp,ServiceName,SeverityText,Body",
              "severityTextExpression": "SeverityText",
              "traceIdExpression": "TraceId",
              "spanIdExpression": "SpanId",
              "connection": "Local ClickHouse",
              "traceSourceId": "Traces",
              "sessionSourceId": "Sessions",
              "metricSourceId": "Metrics"
            },
            {
              "from": {
                "databaseName": "default",
                "tableName": "otel_traces"
              },
              "kind": "trace",
              "timestampValueExpression": "Timestamp",
              "name": "Traces",
              "displayedTimestampValueExpression": "Timestamp",
              "implicitColumnExpression": "SpanName",
              "serviceNameExpression": "ServiceName",
              "bodyExpression": "SpanName",
              "eventAttributesExpression": "SpanAttributes",
              "resourceAttributesExpression": "ResourceAttributes",
              "defaultTableSelectExpression": "Timestamp,ServiceName,StatusCode,round(Duration/1e6),SpanName",
              "traceIdExpression": "TraceId",
              "spanIdExpression": "SpanId",
              "durationExpression": "Duration",
              "durationPrecision": 9,
              "parentSpanIdExpression": "ParentSpanId",
              "spanNameExpression": "SpanName",
              "spanKindExpression": "SpanKind",
              "statusCodeExpression": "StatusCode",
              "statusMessageExpression": "StatusMessage",
              "connection": "Local ClickHouse",
              "logSourceId": "Logs",
              "sessionSourceId": "Sessions",
              "metricSourceId": "Metrics"
            },
            {
              "from": {
                "databaseName": "default",
                "tableName": ""
              },
              "kind": "metric",
              "timestampValueExpression": "TimeUnix",
              "name": "Metrics",
              "resourceAttributesExpression": "ResourceAttributes",
              "metricTables": {
                "gauge": "otel_metrics_gauge",
                "histogram": "otel_metrics_histogram",
                "sum": "otel_metrics_sum",
                "_id": "682586a8b1f81924e628e808",
                "id": "682586a8b1f81924e628e808"
              },
              "connection": "Local ClickHouse",
              "logSourceId": "Logs",
              "traceSourceId": "Traces",
              "sessionSourceId": "Sessions"
            },
            {
              "from": {
                "databaseName": "default",
                "tableName": "hyperdx_sessions"
              },
              "kind": "session",
              "timestampValueExpression": "TimestampTime",
              "name": "Sessions",
              "displayedTimestampValueExpression": "Timestamp",
              "implicitColumnExpression": "Body",
              "serviceNameExpression": "ServiceName",
              "bodyExpression": "Body",
              "eventAttributesExpression": "LogAttributes",
              "resourceAttributesExpression": "ResourceAttributes",
              "defaultTableSelectExpression": "Timestamp,ServiceName,SeverityText,Body",
              "severityTextExpression": "SeverityText",
              "traceIdExpression": "TraceId",
              "spanIdExpression": "SpanId",
              "connection": "Local ClickHouse",
              "logSourceId": "Logs",
              "traceSourceId": "Traces",
              "metricSourceId": "Metrics"
            }
          ]
  data:
  - secretKey: CLICKHOUSE_APP_PASSWORD
    remoteRef:
      key: mv/monitoring/config
      property: CLICKHOUSE_APP_PASSWORD
---
# ClickHouse users.d config, rendered directly from Vault-sourced passwords
# (no @from_env indirection, no password env vars on the ClickHouse
# container). Mounted at /etc/clickhouse-server/users.d/ as a Secret volume
# via clickhouse.cluster.spec.podTemplate.volumes in clickstack.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-clickhouse-users
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: monitoring-store
  target:
    name: clickstack-clickhouse-users
    template:
      engineVersion: v2
      data:
        app.yaml: |
          users:
            reader:
              password: '{{ "{{" }} .CLICKHOUSE_APP_PASSWORD {{ "}}" }}'
              profile: default
              quota: "default"
              grants:
                - query: "GRANT SHOW ON *.*, SELECT ON system.*, SELECT ON default.*"
        otelcollector.yaml: |
          users:
            otelcollector:
              password: '{{ "{{" }} .CLICKHOUSE_OTEL_PASSWORD {{ "}}" }}'
              profile: default
              quota: "default"
              grants:
                - query: "GRANT SELECT,INSERT,CREATE,SHOW ON default.*"
  data:
  - secretKey: CLICKHOUSE_APP_PASSWORD
    remoteRef:
      key: mv/monitoring/config
      property: CLICKHOUSE_APP_PASSWORD
  - secretKey: CLICKHOUSE_OTEL_PASSWORD
    remoteRef:
      key: mv/monitoring/config
      property: CLICKHOUSE_OTEL_PASSWORD
{{- end -}}
