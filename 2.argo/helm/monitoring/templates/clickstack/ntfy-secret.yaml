{{- if and .Values.clickstack.enabled .Values.clickstack.dashboards.enabled .Values.clickstack.alerts -}}
---
# The ntfy topic URL (and an optional access token) the alerts go to, typed
# in by `task ntfy:set-url` into mv/monitoring/ntfy. Read by the
# clickstack-dashboards Job. Until the path exists there is no Secret and the
# Job leaves alerts alone: deletionPolicy Delete makes a missing path a
# deleted Secret (Ready, SecretDeleted) rather than an error that would fail
# every sync of this app before its PostSync Jobs.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickstack-ntfy
  namespace: {{ .Release.Namespace }}
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: monitoring-store
  target:
    name: clickstack-ntfy
    deletionPolicy: Delete
  dataFrom:
    - extract:
        key: mv/monitoring/ntfy
{{- end -}}
