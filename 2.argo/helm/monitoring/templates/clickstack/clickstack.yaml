{{- if .Values.clickstack.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clickstack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: '{{ .Values.repo }}'
    path: '2.helm/clickstack'
    targetRevision: '{{ .Values.branch }}'
    helm:
      releaseName: clickstack
      valuesObject:
        fullnameOverride: clickstack
        hyperdx:
          existingSecret: true
          frontendUrl: "https://{{ .Values.clickstack.domain }}"
          secrets: {}
          config:
            # Read by the gateway collector's clickhouse exporter, which
            # interpolates it as ${env:HYPERDX_OTEL_EXPORTER_TABLES_TTL:-720h}
            # in the config HyperDX pushes over OpAMP. It lands in the CREATE
            # TABLE statement, so it only applies to tables the exporter creates
            # -- existing ones need an ALTER TABLE ... MODIFY TTL by hand.
            HYPERDX_OTEL_EXPORTER_TABLES_TTL: {{ .Values.clickstack.tablesTtl | quote }}
          service:
            # The bootstrap Job talks to /register/password and /installation,
            # which only the API port serves. Not exposed through the
            # IngressRoute, so it stays cluster-internal.
            apiPort:
              enabled: true
          deployment:
            useExistingConfigSecret: true
            existingConfigSecret: clickstack-hyperdx-config
            existingConfigConnectionsKey: connections.json
            existingConfigSourcesKey: sources.json
        clickhouse:
          cluster:
            spec:
              settings:
                logger:
                  # Merged with the chart's own settings.extraConfig, which
                  # Helm leaves alone -- both are maps under `settings`.
                  level: {{ .Values.clickstack.clickhouseLogLevel | quote }}
                # Rendered into config.d/99-extra-config.yaml, which the server
                # reads after the operator's own 00-logs-tables.yaml -- so these
                # keys override it. Merged with the chart's extraConfig defaults
                # (max_connections and friends) rather than replacing them.
                extraConfig:
                  # Both default to 5 GiB each, which is upstream sizing for a
                  # dedicated host and was never scaled to this 5Gi container:
                  # 10 GiB of nominal cache against the 4.5 GiB the server
                  # derives as max_server_memory_usage. See markCacheSize in
                  # values.yaml for why that is untidy rather than urgent.
                  mark_cache_size: {{ .Values.clickstack.markCacheSize | int64 }}
                  index_mark_cache_size: {{ .Values.clickstack.markCacheSize | int64 }}
                  {{- $ttl := printf "event_date + INTERVAL %s DELETE" .Values.clickstack.systemLogs.ttl }}
                  {{- range $table := list "text_log" "query_log" "part_log" "asynchronous_metric_log" }}
                  {{ $table }}:
                    ttl: {{ $ttl | quote }}
                  {{- end }}
                  metric_log:
                  {{- if .Values.clickstack.systemLogs.metricLog }}
                    ttl: {{ $ttl | quote }}
                  {{- else }}
                    # Drops the element from the merged config entirely, which is
                    # how a system log table is disabled. The operator uses the
                    # same attribute for tcp_port_secure.
                    "@remove": "1"
                  {{- end }}
              # settings:
              #   defaultUserPassword:
              #     passwordType: password
              #     secret:
              #       name: clickstack-secret
              #       key: CLICKHOUSE_ADMIN_PASSWORD
              dataVolumeClaimSpec:
                resources:
                  requests:
                    storage: 20Gi
              containerTemplate:
                resources:
                  requests:
                    memory: "1Gi"
                  limits:
                    memory: "5Gi"
                env:
                  - name: CLICKHOUSE_ADMIN_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: clickstack-secret
                        key: CLICKHOUSE_ADMIN_PASSWORD
                volumeMounts:
                  - name: clickhouse-users-config
                    mountPath: /etc/clickhouse-server/users.d/
                    readOnly: true
              podTemplate:
                volumes:
                  - name: clickhouse-users-config
                    secret:
                      secretName: clickstack-clickhouse-users
        mongodb:
          spec:
            members: 1
            type: ReplicaSet
            security:
              authentication:
                modes: ["SCRAM"]
            users:
              - name: hyperdx
                db: hyperdx
                passwordSecretRef:
                  name: clickstack-mongo-password
                roles:
                  - name: dbOwner
                    db: hyperdx
                  - name: clusterMonitor
                    db: admin
                scramCredentialsSecretName: clickstack-mongodb-scram
            additionalMongodConfig:
              storage.wiredTiger.engineConfig.journalCompressor: zlib
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: '{{ .Release.Namespace }}'
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
    automated:
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m
{{- end -}}
