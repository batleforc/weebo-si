{{- if .Values.obi.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  syncPolicy:
    automated: {}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        # Opts the namespace into the clickstack-ingest ClusterExternalSecret,
        # which is the only thing needed to hand OBI the ingestion key.
        {{ .Values.otel.ingestLabel }}: "true"
    syncOptions:
    - CreateNamespace=true
  source:
    chart: opentelemetry-ebpf-instrumentation
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    targetRevision: {{ .Values.obi.version }}
    helm:
      releaseName: obi
      valuesObject:
        volumes:
          - name: bpffs
            hostPath:
              path: /sys/fs/bpf
              type: Directory

        volumeMounts:
          - name: bpffs
            mountPath: /sys/fs/bpf
            mountPropagation: HostToContainer
        env:
          OTEL_EBPF_KUBE_CLUSTER_NAME: {{ .Values.otel.clusterName | quote }}
        # Replaces the bank-vaults webhook injection of
        # vault:mv/data/obi/config#API_KEY -- a second, hand-maintained copy of
        # the ClickStack key, which also relied on ${VAR} being expanded inside
        # another env var (Kubernetes only expands the $(VAR) form). The value
        # now arrives pre-formatted from the shared secret.
        envValueFrom:
          OTEL_EXPORTER_OTLP_HEADERS:
            secretKeyRef:
              name: {{ .Values.otel.ingestSecret }}
              key: OTEL_EXPORTER_OTLP_HEADERS
        config:
          create: true
          data:
            cluster_name: {{ .Values.otel.clusterName | quote }}
            otel_traces_export:
              endpoint: {{ .Values.otel.endpoint.grpc | quote }}
            otel_metrics_export:
              endpoint: {{ .Values.otel.endpoint.http | quote }}
            {{- if .Values.obi.networkFlows }}
            # `enable`, not `enabled`: OBI parses this file with a plain
            # yaml.Unmarshal, so a misspelt key is dropped without a warning and
            # the feature stays off (NetworkFlows.Enable is what flips
            # metrics.features to include `network`).
            #
            # Flows are IP-level: they show that something talked to
            # 140.82.121.4, not that it talked to github.com. The client spans
            # OBI already produces carry server.address and are what the Egress
            # dashboard reads; this is for the traffic no protocol decoder
            # covers.
            network:
              enable: true
              # Left at the default `socket_filter` deliberately: the `tc`
              # source is the one that has to share traffic-control hooks with
              # Cilium, and nothing here needs it.
            ebpf:
              # Cilium runs with enable-tcx=true, and the chart's default
              # contextPropagation does attach TC programs. OBI's `auto` would
              # pick tcx anyway; pinning it states the contract instead of
              # leaving it to detection -- under tcx the two coexist, OBI at the
              # head of the hook list and Cilium at the tail.
              # https://opentelemetry.io/docs/zero-code/obi/cilium-compatibility/
              traffic_control_backend: tcx
            {{- end }}
  destination:
    name: in-cluster
    namespace: obi

{{- end -}}
