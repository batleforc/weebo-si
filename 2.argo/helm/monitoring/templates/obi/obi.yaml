{{- if .Values.obi.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: obi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  syncPolicy:
    automated: {}
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        # Opts the namespace into the clickstack-ingest ClusterExternalSecret,
        # which is the only thing needed to hand OBI the ingestion key.
        {{ .Values.otel.ingestLabel }}: "true"
    syncOptions:
    - CreateNamespace=true
  source:
    chart: opentelemetry-ebpf-instrumentation
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    targetRevision: {{ .Values.obi.version }}
    helm:
      releaseName: obi
      valuesObject:
        volumes:
          - name: bpffs
            hostPath:
              path: /sys/fs/bpf
              type: Directory

        volumeMounts:
          - name: bpffs
            mountPath: /sys/fs/bpf
            mountPropagation: HostToContainer
        env:
          OTEL_EBPF_KUBE_CLUSTER_NAME: {{ .Values.otel.clusterName | quote }}
        # Replaces the bank-vaults webhook injection of
        # vault:mv/data/obi/config#API_KEY -- a second, hand-maintained copy of
        # the ClickStack key, which also relied on ${VAR} being expanded inside
        # another env var (Kubernetes only expands the $(VAR) form). The value
        # now arrives pre-formatted from the shared secret.
        envValueFrom:
          OTEL_EXPORTER_OTLP_HEADERS:
            secretKeyRef:
              name: {{ .Values.otel.ingestSecret }}
              key: OTEL_EXPORTER_OTLP_HEADERS
        config:
          create: true
          data:
            cluster_name: {{ .Values.otel.clusterName | quote }}
            otel_traces_export:
              endpoint: {{ .Values.otel.endpoint.grpc | quote }}
            otel_metrics_export:
              endpoint: {{ .Values.otel.endpoint.http | quote }}
            network:
              enabled: true
  destination:
    name: in-cluster
    namespace: obi

{{- end -}}
