{{- if .Values.otel.enabled -}}
---
# Materialises the ClickStack ingestion credentials into every namespace
# labelled {{ .Values.otel.ingestLabel }}=true. Onboarding a new telemetry
# producer is therefore: label its namespace, then envFrom the
# {{ .Values.otel.ingestSecret }} Secret -- no Vault write, no per-namespace
# ExternalSecret, no value copied out of the HyperDX UI.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: {{ .Values.otel.ingestSecret }}
spec:
  externalSecretName: {{ .Values.otel.ingestSecret }}
  namespaceSelectors:
    - matchLabels:
        {{ .Values.otel.ingestLabel }}: "true"
  refreshTime: 1h
  externalSecretSpec:
    refreshPolicy: Periodic
    refreshInterval: 24h
    secretStoreRef:
      name: otel-ingest-store
      kind: ClusterSecretStore
    target:
      name: {{ .Values.otel.ingestSecret }}
      template:
        engineVersion: v2
        data:
          INGESTION_API_KEY: '{{ "{{" }} .INGESTION_API_KEY {{ "}}" }}'
          OTEL_EXPORTER_OTLP_ENDPOINT: '{{ .Values.otel.endpoint.http }}'
          # HyperDX builds its bearertokenauth extension with an empty scheme
          # (packages/api/src/opamp/controllers/opampController.ts), so the
          # header value is the bare key -- no "Bearer " prefix.
          OTEL_EXPORTER_OTLP_HEADERS: 'authorization={{ "{{" }} .INGESTION_API_KEY {{ "}}" }}'
    data:
    - secretKey: INGESTION_API_KEY
      remoteRef:
        key: mv/monitoring/otel
        property: INGESTION_API_KEY
{{- end -}}
