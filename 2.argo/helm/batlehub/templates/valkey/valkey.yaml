{{- if and .Values.batlehub.enabled .Values.batlehub.valkey.enabled -}}
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: batlehub-valkey
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  image: {{ printf "%s:%s" .Values.batlehub.valkey.image.repository .Values.batlehub.valkey.image.tag | quote }}
  shards: {{ .Values.batlehub.valkey.shards }}
  replicasPerShard: {{ .Values.batlehub.valkey.replicasPerShard }}
  podDisruptionBudget:
    mode: Disabled
  persistence:
    size: {{ .Values.batlehub.valkey.storage.size }}
    storageClassName: {{ .Values.batlehub.valkey.storage.storageClassName }}
  acl:
    users:
      - name: batlehub
        password:
          secret:
            name: batlehub-valkey-cred
            keys: [pwd]
        permissions: "+@all ~* &*"
{{- end -}}
