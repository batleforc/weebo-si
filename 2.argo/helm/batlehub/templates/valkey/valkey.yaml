{{- if .Values.batlehub.enabled -}}
apiVersion: valkey.io/v1alpha1
kind: ValkeyCluster
metadata:
  name: batlehub-valkey
  namespace: {{ .Release.Namespace }}
spec:
  shards: 1
  replicas: 0
  podDisruptionBudget:
    mode: Disabled
  persistence:
    size: 5Gi
    storageClassName: longhorn
  users:
    - name: batlehub
      passwordSecret:
        name: batlehub-valkey-cred
        keys: [pwd]
      permissions: "+@all ~* &*"
{{- end -}}