{{- if and .Values.batlehub.enabled .Values.batlehub.valkey.enabled -}}
---
# `pwd` is what the ValkeyCluster hands its `batlehub` user; `url` is the same
# password inside a redis:// URL, which is the only form batlehub's `[cache]`
# block takes. Both are written by 2.terra/vault/terra-map/batlehub.tf, from one
# random_string, so the two can never drift.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-valkey-cred
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: batlehub-valkey-cred
  data:
  - secretKey: pwd
    remoteRef:
      key: mv/batlehub/config
      property: pwd
  - secretKey: url
    remoteRef:
      key: mv/batlehub/config
      property: url
{{- end -}}
