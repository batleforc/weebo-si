{{- if .Values.batlehub.enabled -}}
---
# One router, one service: unlike angos there is no second audience to split off
# -- batlehub runs its own OIDC login, serves its own SPA and reads its own
# `Authorization` header, so nothing sits between Traefik and the pod.
#
# Every registry declared in values.yaml answers on `<name>.pkg.weebo.poc` as
# well as `/proxy/<name>/`; the Host() list is generated from that list, so
# adding one still means no route edit. Not a HostRegexp: Traefik cannot tie
# TLS options to one, so with the workspace-reachable options below the SNI
# <name>.pkg kept the default ones and every subdomain answered 421 (Host and
# SNI options differ), while fronting from it to other hosts went through.
# CoreDNS already sends `*.weebo.poc` here (2.argo/app/templates/dns/coredns.yaml),
# so a new registry needs no DNS record either. One label only, matching what
# the certificate covers.
#
# `passHostHeader` is what makes host routing work at all: batlehub selects the
# registry from the Host (or the X-Forwarded-Host, which is why
# `trustedProxies` names this cluster's pod CIDR), so a rewritten Host would
# route every request to the apex.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: batlehub
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: batlehub
  # With the Application it fronts, rather than the wave 0 it would default to:
  # a router pointing at a Service that does not exist yet is Traefik logging
  # an error every few seconds for as long as the first sync takes.
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`{{ .Values.batlehub.dns }}`){{ if .Values.batlehub.subdomainRouting.enabled }}{{ range .Values.batlehub.registries }} || Host(`{{ .name }}.{{ $.Values.batlehub.dns }}`){{ end }}{{ end }}
      priority: 10
      services:
        - name: batlehub
          namespace: {{ .Release.Namespace }}
          port: 8080
          passHostHeader: true
  tls:
    secretName: batlehub-tls
    # weebo-net-base lets workspaces open TLS to this host: same TLS options
    # as the other reachable hosts, so no Host of another router rides it
    # (2.argo/helm/ingress/sub/templates/middleware/tls-workspace-reachable.yaml).
    options:
      name: workspace-reachable
      namespace: traefik
{{- end -}}
