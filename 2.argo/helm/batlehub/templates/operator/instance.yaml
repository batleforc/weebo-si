{{- $o := .Values.operator -}}
{{- if and .Values.batlehub.enabled $o.enabled -}}
---
# The batlehub above, as an `external` instance with `manageConfig`: the
# upstream chart keeps deploying it, the operator owns its configuration.
# `spec.config` is everything but the registries (templates/_config.tpl, the
# same template the chart's seed is rendered from), and each registry is a
# BatleHubRegistry (operator/registries.yaml) the operator renders after it.
# It validates the result against the instance (dry run), then stages and
# approves it: hot keys -- the registries among them -- reload without a
# restart. A key batlehub only reads at startup (database, auth, storage...)
# is held back as RestartForbidden: those change through the chart's seed,
# which rolls the pod (batlehub.writableConfig).
#
# It also writes what lives in batlehub's database -- namespace claims,
# package grants and policies, maintenances -- from the CRs of this namespace.
#
# The public URL rather than the Service, as for the ForgejoInstance: Traefik
# in front, signed by the internal CA that trust-manager replicates into this
# namespace as the `weebo.poc` Secret.
#
# Its CRD comes from the weebo-batlehub Application of the same sync, so the
# first dry-run cannot know the kind: SkipDryRunOnMissingResource, and the
# Application's retries, cover the time the CRDs take to land.
apiVersion: batlehub.weebo.io/v1alpha1
kind: BatleHubLocalInstance
metadata:
  name: {{ $o.instance.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  external:
    url: "https://{{ .Values.batlehub.dns }}"
    adminTokenSecretRef:
      name: batlehub-operator-token
      key: token
    manageConfig: {{ $o.manageConfig }}
    tls:
      caSecretRef:
        name: {{ $o.instance.caSecret.name }}
        key: {{ $o.instance.caSecret.key }}
  {{- if $o.manageConfig }}
  config:
    {{- include "batlehub.serverConfig" (dict "root" $ "forChart" false) | nindent 4 }}
  {{- end }}
{{- end -}}
