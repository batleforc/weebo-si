{{- if and .Values.batlehub.enabled .Values.batlehub.oidc.enabled -}}
---
# Written to Vault by the authentik operator itself: the AuthentikApplication in
# 2.argo/helm/auth/sub carries `secretTargets: [{backend: vault, path:
# batlehub/auth}]`, and the operator fills AUTHENTIK_CLIENT_ID,
# AUTHENTIK_CLIENT_SECRET and AUTHENTIK_URL there.
#
# AUTHENTIK_URL is the issuer WITH its path
# (https://auth.weebo.poc/application/o/batlehub/), which is what batlehub
# discovers against -- not the bare host. Read from Vault rather than written
# here so that a slug change on the Authentik side does not need a matching edit
# in this repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-auth
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: batlehub-auth
  data:
  - secretKey: AUTHENTIK_CLIENT_ID
    remoteRef:
      key: mv/batlehub/auth
      property: AUTHENTIK_CLIENT_ID
  - secretKey: AUTHENTIK_CLIENT_SECRET
    remoteRef:
      key: mv/batlehub/auth
      property: AUTHENTIK_CLIENT_SECRET
  - secretKey: AUTHENTIK_URL
    remoteRef:
      key: mv/batlehub/auth
      property: AUTHENTIK_URL
{{- end -}}
