{{- if and .Values.batlehub.enabled (eq .Values.batlehub.storage.type "s3") -}}
---
# The RustFS user's keys, under the names the AWS SDK reads them from. aws-sdk-s3
# is what batlehub's S3 backend is built on and its `[storage]` block carries no
# key for credentials at all -- they come from the environment or they do not
# come.
#
# Rendered only when S3 is the storage backend, which on the published image it
# cannot be -- see batlehub.storage in values.yaml. The bucket and these keys
# exist anyway; what is missing is a server built with `storage-s3`.
#
# The bucket, the user and its policy are created by the RustFS Tenant in
# 2.argo/helm/database/sub; this reads the same mv/batlehub/s3 path that tenant
# does, so the two sides cannot disagree.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-s3-cred
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: batlehub-s3-cred
  data:
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: mv/batlehub/s3
      property: accesskey
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: mv/batlehub/s3
      property: secretkey
{{- end -}}
