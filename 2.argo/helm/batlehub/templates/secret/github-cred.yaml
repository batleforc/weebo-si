{{- if and .Values.batlehub.enabled .Values.batlehub.githubToken.enabled -}}
---
# GITHUB_TOKEN for the `github` registry's upstream auth
# (batlehub.githubToken). Written to Vault by hand: GitHub has no API to mint
# a token, so nothing in 2.terra creates it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-github
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: batlehub-github
  data:
  - secretKey: token
    remoteRef:
      key: {{ .Values.batlehub.githubToken.vaultKey }}
      property: {{ .Values.batlehub.githubToken.property }}
{{- end -}}
