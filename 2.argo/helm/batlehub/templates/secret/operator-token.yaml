{{- if and .Values.batlehub.enabled .Values.operator.enabled -}}
---
# The admin token weebo-batlehub drives this batlehub with, both faces of it,
# from mv/batlehub/operator (2.terra/vault/terra-map/batlehub.tf):
#
#   token       the bearer, read by the operator through the BatleHubLocalInstance
#   token_hash  its argon2id, which the batlehub pod reads as
#               OPERATOR_TOKEN_HASH into its `[[auth]] type = "token"` entry
#
# The label is the opt-in: the operator reads Secrets with its own rights and
# sends the token to the URL the instance names, so it only reads one carrying
# `batlehub.weebo.io/instance-token: "true"` (TokenSecretNotAllowed otherwise).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: batlehub-operator-token
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 24h
  secretStoreRef:
    name: cred-store
  target:
    name: batlehub-operator-token
    template:
      metadata:
        labels:
          batlehub.weebo.io/instance-token: "true"
  data:
  - secretKey: token
    remoteRef:
      key: mv/batlehub/operator
      property: token
  - secretKey: token_hash
    remoteRef:
      key: mv/batlehub/operator
      property: token_hash
{{- end -}}
