from_latest_tag = false
ignore_merge_commits = false
disable_changelog = false
disable_bump_commit = false
generate_mono_repository_global_tag = true
branch_whitelist = []
skip_ci = "[skip ci]"
skip_untracked = false
pre_bump_hooks = []
post_bump_hooks = []
pre_package_bump_hooks = []
post_package_bump_hooks = []

[git_hooks]
[git_hooks.commit-msg]
script = """#!/bin/sh
set -e
cog verify --file $1
"""

[git_hooks.pre-commit]
script = """#!/bin/sh
set -e
gitleaks git --pre-commit --redact --staged --verbose
# Network-flow diagrams (0.docs/content/docs/security/network-flows), drawn
# from the rendered network policies. Only when a chart or the generator is
# part of the commit; the result is added to the same commit. It renders the
# working tree, not the index: partially staged chart edits are drawn whole.
if git diff --cached --name-only | grep -qE '^(2\\.argo/|2\\.helm/|0\\.task/scripts/netflow\\.py)'; then
  task docs:netflow
  git add 0.docs/content/docs/security/network-flows
fi
"""

[commit_types]

[changelog]
path = "CHANGELOG.md"
authors = []

[bump_profiles]
