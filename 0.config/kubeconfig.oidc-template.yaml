apiVersion: v1
clusters:
  - cluster:
      certificate-authority-data: ""
      server: ""
    name: Weebo-si
contexts:
  - context:
      cluster: Weebo-si
      user: Weebo-si
    name: Weebo-si
  # The admin elevation (runbook bascule-weebo-si): Authentik's kube-admin
  # application, behind a second factor, one-hour tokens, no refresh.
  # `alias kadmin='kubectl --context Weebo-si-admin'`. The Talos kubeconfig
  # (0.config/kubeconfig.yaml) is the break-glass.
  - context:
      cluster: Weebo-si
      user: Weebo-si-admin
    name: Weebo-si-admin
current-context: Weebo-si
kind: Config
preferences: {}
users:
  - name: Weebo-si
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://dex.weebo.poc
          - --oidc-client-id=weebo-kube
          - --oidc-client-secret=
          - --oidc-extra-scope="email offline_access profile openid groups"
          - --grant-type=authcode
        command: kubectl
        env: null
        provideClusterInfo: false
  - name: Weebo-si-admin
    user:
      exec:
        apiVersion: client.authentication.k8s.io/v1beta1
        args:
          - oidc-login
          - get-token
          - --oidc-issuer-url=https://auth.weebo.poc/application/o/kube-admin/
          - --oidc-client-id=kube-admin
          - --oidc-extra-scope=email
          - --oidc-extra-scope=profile
          - --oidc-extra-scope=groups
          # No offline_access: no refresh token, the elevation expires.
          # A cache of its own, or the dev token cached for the same cluster
          # would be offered to this context too.
          - --token-cache-dir=~/.kube/cache/oidc-login-admin
          - --grant-type=authcode
        command: kubectl
        env: null
        interactiveMode: IfAvailable
        provideClusterInfo: false
