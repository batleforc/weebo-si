apiVersion: batch/v1
kind: Job
metadata:
  name: "terra-job-authentik"
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  backoffLimit: 5
  template:
    metadata:
      annotations:
        vault.security.banzaicloud.io/vault-addr: "https://openbao.vault:8200"
        vault.security.banzaicloud.io/vault-role: "auth"
        vault.security.banzaicloud.io/vault-path: "kubernetes"
        vault.security.banzaicloud.io/vault-tls-secret: "openbao-tls"
    spec:
      serviceAccountName: "authentik"
      containers:
        - name: terraform
          image: hashicorp/terraform:1.16.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - "-c"
            - |
              set -x
              cd /terraform
              touch anotherNameThatSoundNothing.tf
              rm -rf *.tf
              cp /scripts/*.tf .
              terraform init --upgrade
              terraform apply -auto-approve
          env:
            - name: TF_VAR_authentik_url
              value: "https://auth.weebo.poc"
            - name: TF_VAR_authentik_token
              value: "vault:mv/data/main-config#AUTHENTIK_BOOTSTRAP_TOKEN"
            - name: TF_VAR_vault_addr
              value: "https://openbao.vault:8200"
          volumeMounts:
            - mountPath: terraform
              name: terra-job
            - mountPath: /scripts
              name: "script-vol"
            - mountPath: /etc/ssl/vault
              name: openbao-tls
            - mountPath: /etc/ssl/certs
              name: etc-ssl-certs
      restartPolicy: Never
      volumes:
        - name: "script-vol"
          configMap:
            name: "terra-auth-config"
        - name: terra-job
          persistentVolumeClaim:
            claimName: "terra-job-authentik"
        - name: openbao-tls
          secret:
            secretName: "openbao-tls"
        - name: etc-ssl-certs
          secret:
            secretName: "weebo.poc"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "terra-job-authentik-empty"
spec:
  backoffLimit: 10
  template:
    spec:
      containers:
        - name: create-in-vault
          image: hashicorp/terraform:1.16.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - "-c"
            - |
              set -x
              echo "WIP"
          volumeMounts:
            - mountPath: terraform
              name: terra-job
      restartPolicy: Never
      volumes:
        - name: terra-job
          persistentVolumeClaim:
            claimName: "terra-job-authentik"
