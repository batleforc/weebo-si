apiVersion: batch/v1
kind: Job
metadata:
  name: "terra-job-vault"
  annotations:
    argocd.argoproj.io/hook: PostSync
spec:
  backoffLimit: 5
  template:
    metadata:
      annotations:
        inject-certs: "enabled"
        vault.security.banzaicloud.io/vault-addr: "https://vault.vault:8200"
        vault.security.banzaicloud.io/vault-role: "auth"
        vault.security.banzaicloud.io/vault-path: "kubernetes"
        vault.security.banzaicloud.io/vault-tls-secret: "vault-tls"
    spec:
      containers:
        - name: terraform
          image: hashicorp/terraform:1.16.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - "-c"
            - |
              set -x
              cd /terraform
              touch anotherNameThatSoundNothing.tf
              rm -rf *.tf
              cp /scripts/*.tf .
              terraform init --upgrade
              terraform apply -auto-approve
          env:
            - name: TF_VAR_vault_addr
              value: "https://openbao.vault:8200"
          volumeMounts:
            - mountPath: terraform
              name: terra-job
            - mountPath: /scripts
              name: "script-vol"
            - mountPath: /etc/ssl/vault
              name: vault-tls
            - mountPath: /var/run/vault
              name: vault-token
      restartPolicy: Never
      volumes:
        - name: "script-vol"
          configMap:
            name: "terra-vault-config"
        - name: terra-job
          persistentVolumeClaim:
            claimName: "terra-job-vault"
        - name: vault-tls
          secret:
            secretName: "openbao-tls"
        - name: vault-token
          secret:
            secretName: "openbao-unseal-keys"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: "terra-job-vault-empty"
  annotations:
    # Job.spec.template is immutable, and unlike its PostSync sibling above this
    # one is a plain tracked resource -- so ArgoCD reaches for a patch and the
    # API server rejects it:
    #   Job.batch "terra-job-vault-empty" is invalid:
    #   spec.template: ... field is immutable
    # It stayed hidden only because nothing had ever edited the pod template;
    # pinning the terraform image off :latest was the first change to try.
    # Force+Replace makes ArgoCD delete and recreate instead of patching, which
    # is free here -- the container only echoes WIP.
    #
    # The Job itself is not pointless: terra-job-* PVCs use the local-path
    # StorageClass, which is WaitForFirstConsumer, so the claim stays Pending
    # until some pod mounts it (hence ignore-healthcheck on the PVC). This stub
    # is that first consumer, binding the volume before the real PostSync hook
    # needs it.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
spec:
  backoffLimit: 10
  template:
    spec:
      containers:
        - name: create-in-vault
          image: hashicorp/terraform:1.16.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - "-c"
            - |
              set -x
              echo "WIP"
          volumeMounts:
            - mountPath: terraform
              name: terra-job
      restartPolicy: Never
      volumes:
        - name: terra-job
          persistentVolumeClaim:
            claimName: "terra-job-vault"
