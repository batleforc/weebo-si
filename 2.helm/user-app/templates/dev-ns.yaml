kind: Namespace
apiVersion: v1
metadata:
  name: dev-ws-{{ .Values.cheUser.username }}
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-namespace
  annotations:
    che.eclipse.org/username: {{ .Values.cheUser.username }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dev-ws-{{ .Values.cheUser.username }}-rolebinding
  namespace: dev-ws-{{ .Values.cheUser.username }}
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
subjects:
  - kind: User
    name: weebsso:max@batleforc.fr
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: eclipse-che-cheworkspaces-clusterrole
  apiGroup: rbac.authorization.k8s.io
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: dev-ws-{{ .Values.cheUser.username }}-rolebinding-devworkspace
  namespace: dev-ws-{{ .Values.cheUser.username }}
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
subjects:
  - kind: User
    name: weebsso:{{ .Values.cheUser.username }}@weebo.poc
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: eclipse-che-cheworkspaces-devworkspace-clusterrole
  apiGroup: rbac.authorization.k8s.io

