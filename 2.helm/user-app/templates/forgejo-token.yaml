{{- if .Values.forgejo.enabled }}
{{- $ns := printf "dev-ws-%s" .Values.cheUser.username }}
{{- $name := .Values.forgejo.name }}
{{- $reader := printf "%s-reader" $name }}
# A Forgejo token for this person, minted by weebo-forgejo into the Secret
# <name> (FORGEJO_TOKEN, FORGEJO_USERNAME, FORGEJO_URL). Allowed only by the
# ForgejoNamespacePolicy che-workspaces (2.argo/helm/che/hardening), which
# lets dev-ws-<username> mint tokens for <username> and nobody else.
apiVersion: forgejo.weebo.io/v1alpha1
kind: ForgejoAccessToken
metadata:
  name: {{ $name }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # The Forgejo login is the Authentik preferred_username, as is Che's.
  userRef:
    remoteName: {{ .Values.cheUser.username | quote }}
  scopes:
    {{- toYaml .Values.forgejo.scopes | nindent 4 }}
  {{- with .Values.forgejo.rotationPeriod }}
  rotationPeriod: {{ . | quote }}
  {{- end }}
  deletionPolicy: Delete
  secretTargets:
    # The Secret the ExternalSecret below turns into Che's credential.
    - name: {{ $name }}
    {{- with .Values.forgejo.vaultMount }}
    # The person's own space in OpenBao; the instance's pathGrants let
    # dev-ws-<username> write there and nowhere else.
    - backend: vault
      name: forgejo-token
      mount: {{ . }}
      path: {{ printf "%s/forgejo-token" $.Values.cheUser.username | quote }}
    {{- end }}
---
# The operator's keys are fixed, the DevWorkspace git-credential format wants
# one `credentials` key: ESO re-reads that Secret, through the Kubernetes
# provider, and writes it in the right shape. This ServiceAccount may read
# that one Secret and nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $reader }}
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $reader }}
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $name | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $reader }}
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: {{ $reader }}
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $reader }}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $reader }}
  namespace: {{ $ns }}
  annotations:
    external-secrets.io/disable-maintenance-checks: "true"
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ $ns }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ $reader }}
---
# A Che personal access token (che-server's KubernetesPersonalAccessTokenManager,
# weebo-si/che-server fork): listed in the dashboard, and turned by che-server
# into the workspace's git credentials at each start. Without che-userid,
# scm-url or scm-personal-access-token-name che-server deletes the Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-che-pat
  namespace: {{ $ns }}
spec:
  refreshPolicy: Periodic
  # Follows a rotation (rotationPeriod) within the hour, and puts the Secret
  # back if che-server deleted it as invalid.
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: {{ $reader }}
  target:
    name: personal-access-token-{{ $name }}
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: scm-personal-access-token
        annotations:
          # Che's user id is the `sub` of the Dex token: base64url, unpadded,
          # of the protobuf {1: Authentik sub, 2: connector id}. Authentik's
          # che-cluster provider has sub_mode user_username, and the
          # connector is `weebo` (2.argo/helm/auth/main/templates/dex/dex.yaml).
          # Matches user-profile's `id` in the namespace.
          {{- $u := .Values.cheUser.username }}
          {{- $conn := "weebo" }}
          che.eclipse.org/che-userid: {{ printf "\n%c%s\x12%c%s" (len $u) $u (len $conn) $conn | b64enc | replace "+" "-" | replace "/" "_" | trimSuffix "=" | trimSuffix "=" | quote }}
          che.eclipse.org/scm-url: {{ .Values.forgejo.url | quote }}
          che.eclipse.org/scm-provider-name: forgejo
          # `forgejo`: the fork's fetcher then accepts any server URL, not
          # only the configured che.forgejo.endpoint.
          che.eclipse.org/scm-personal-access-token-name: forgejo
          che.eclipse.org/scm-personal-access-token-id: {{ $name | quote }}
      data:
        token: '{{ "{{" }} .FORGEJO_TOKEN {{ "}}" }}'
  dataFrom:
    - extract:
        key: {{ $name }}
{{- end }}
