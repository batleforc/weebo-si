{{- if .Values.cheUser.externalConfig.enabled }}
# The user's own manifests (dotfiles, devfile registries...), synced into
# their workspace namespace. Its repo must be on the che-users AppProject.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.cheUser.username }}-external-config
  namespace: argocd
spec:
  project: {{ required "project is rendered by the operator" .Values.project }}
  source:
    path: {{ .Values.cheUser.externalConfig.path }}
    repoURL: {{ required "cheUser.externalConfig.repoURL" .Values.cheUser.externalConfig.repoURL }}
    targetRevision: {{ .Values.cheUser.externalConfig.branch }}
  destination:
    namespace: dev-ws-{{ .Values.cheUser.username }}
    server: "https://kubernetes.default.svc"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
{{- end }}
