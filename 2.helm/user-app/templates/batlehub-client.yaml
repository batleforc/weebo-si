{{- with .Values.batlehub.server }}
{{- $host := (urlParse .).host }}
# Package configuration for every workspace container, as env vars: the
# DevWorkspace automount, no file in $HOME to shadow and nothing to run at
# start. Workspaces resolve no public registry (weebo-net-base, DNS), so
# each client is pointed at its BatleHub registry, <name>.<server host>
# (names from 2.argo/helm/batlehub/values.yaml, batlehub.registries). An env
# var beats the user's config file; a flag (`pip install -i`) still beats it.
# Not here: cargo (no sparse index found on cargo.<host>) and maven (no env
# var, settings.xml only).
apiVersion: v1
kind: ConfigMap
metadata:
  name: batlehub-client
  namespace: dev-ws-{{ $.Values.cheUser.username }}
  labels:
    controller.devfile.io/mount-to-devworkspace: "true"
    controller.devfile.io/watch-configmap: "true"
  annotations:
    controller.devfile.io/mount-as: env
data:
  BATLEHUB_SERVER: {{ . | quote }}
  NPM_CONFIG_REGISTRY: "https://npm.{{ $host }}/"
  PIP_INDEX_URL: "https://pypi.{{ $host }}/simple/"
  UV_DEFAULT_INDEX: "https://pypi.{{ $host }}/simple/"
  # The sum.golang.org checks go through BatleHub's sumdb relay as well.
  GOPROXY: "https://go.{{ $host }}"
  {{- if $.Values.batlehub.setupApply }}
  BATLEHUB_SETUP_APPLY: "true"
  {{- end }}
{{- end }}
