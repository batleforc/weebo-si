# Rendered per person by weebo-si-operator: the team template
# (2.argo/helm/che/hardening/templates/teams/<team>.yaml, workspace.che) sets the base, the
# WeeboSiUser's spec.che.values is deep-merged over it.

# AppProject of this Application (che-users), set by the operator.
project: ""
# The external-config Application goes to <prefix>-<username>, a project of
# its own rendered by 2.argo/helm/che/hardening from the same `users` list.
externalConfigProjectPrefix: che-config

cheUser:
  # Che username: dev-ws-<username>, and the namespace owner annotation.
  username: ""
  # The apiserver maps an OIDC login to "labsso:" + email (1.pulu-init).
  email: ""
  # weebo.io/team, which the WeeboSiTeam's namespaceSelector matches.
  teamLabel: ""
  # What this person may do in their namespace. Levels and add-ons are
  # defined in templates/_access.tpl: baseline < deploy, and the
  # port-forward add-on (JetBrains Gateway).
  access:
    # Set by the team template: the floor every member gets.
    teamLevel: ""
    # Set per person, in the WeeboSiUser's che.values. Empty = teamLevel;
    # below teamLevel is a refused render.
    level: ""
    # The team's add-ons, and the person's on top (both apply).
    addons: []
    extraAddons: []
  externalConfig:
    enabled: false
    repoURL: ""
    path: "config"
    branch: "HEAD"

# The BatleHub instance workspaces are pointed at (templates/batlehub-client.yaml).
# Empty: no ConfigMap. Set by the team template.
batlehub:
  server: ""
  # BATLEHUB_SETUP_APPLY=true in the workspace: the parent devfiles' postStart
  # runs `batlehub setup apply --yes` only when it is set (and the binary is
  # in the image). Off until batlehub RFC 0038 ships.
  setupApply: false

# A Forgejo token in every workspace's git credentials
# (templates/forgejo-token.yaml). Set by the team template.
forgejo:
  enabled: false
  # The CR and Secret name; the token is named dev-ws-<username>-<name> in
  # Forgejo (Settings > Applications).
  name: che-workspace
  # Changing them issues a new token, which the operator refuses without the
  # forgejo.weebo.io/allow-disruptive-update annotation.
  scopes: [write:repository, read:user]
  rotationPeriod: 720h
  # The ForgejoInstance's URL (2.argo/helm/forgejo, operator.instance), as
  # che-server will see it in the token's scm-url.
  url: https://git.weebo.poc
  # Also writes the token to OpenBao, users/<username>/forgejo-token (the
  # instance's additional mount `users`, RFC 0007), next to the Secret Che
  # reads. Empty: the Secret only.
  vaultMount: users

# Prefix of Che's own ClusterRoles (the `baseline` level): the namespace
# che-operator runs in.
cheNamespace: eclipse-che

# Off until the auth-read role in 2.terra/vault/terra-map/auth-base.tf binds
# dev-ws-* namespaces.
vault:
  enabled: false
  server: "https://openbao.vault:8200"
  path: "mv"
  role: "auth-read"
  sa: "default"
