{{/*
The MCK operator's MongoDBCommunity CR requires passwordSecretRef to point
to a Secret with a key named "password". This template bridges the shared
clickstack-secret (which uses MONGODB_PASSWORD) to the format MCK expects.

Skipped when hyperdx.existingSecret is set, since that means credentials are
managed externally (e.g. by an ExternalSecret) and mongodb.spec.users[].passwordSecretRef.name
is expected to point directly at that externally-managed Secret instead.
*/}}
{{- if and .Values.mongodb.enabled (not .Values.hyperdx.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickstack.mongodb.fullname" . }}-password
  labels:
    {{- include "clickstack.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.hyperdx.secrets.MONGODB_PASSWORD | quote }}
{{- end }}
