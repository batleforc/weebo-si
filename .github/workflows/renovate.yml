name: Renovate

# Renovate runs on the GitHub side: `origin` fetches from
# github.com/batleforc/weebo-si, that is where the default branch (develop)
# and the issue tracker live, and the Dependency Dashboard is an issue.
# Configuration is in renovate.json5 at the repo root.

on:
  schedule:
    - cron: "0 1 * * *" # 03:00 Europe/Paris. The only timing gate -- renovate.json5 sets no schedule.
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run: resolve everything, write nothing"
        type: boolean
        default: false
      logLevel:
        description: "Renovate log level"
        type: choice
        options: ["info", "debug"]
        default: "info"
  push:
    branches: ["develop"]
    paths:
      - "renovate.json5"
      - ".github/workflows/renovate.yml"

# Renovate runs as the built-in GITHUB_TOKEN, so the job itself needs the write
# scopes: branches and commits (contents), the PRs, and the Dependency Dashboard
# (an issue).
permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: batleforc/weebo-si
          RENOVATE_AUTODISCOVER: "false"
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_DRY_RUN: ${{ inputs.dryRun == true && 'full' || '' }}
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
