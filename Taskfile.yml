version: "3"

dotenv: [".env"]

includes:
  pulunit: 1.pulu-init/Taskfile.yaml
  puluconf: 1.pulu-conf/Taskfile.yaml
  argo: 0.task/argo.yaml
  vpn: 0.task/vpn.yaml
  vault: 0.task/vault.yaml
  s3: 0.task/s3.yaml
  angos: 0.task/angos.yaml

tasks:
  init:
    desc: "Init project"
    cmds:
      - cog install-hook -a -o
  sofka:
    desc: Run Sofka on cluster
    silent: true
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    aliases: [s]
    cmds:
      - sofka {{ .CLI_ARGS }}
  kubectl:
    desc: "Run kubectl commands on the cluster"
    silent: true
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    aliases: [k]
    cmds:
      - kubectl {{ .CLI_ARGS }}
  kubectl-oidc:
    silent: true
    env:
      KUBECONFIG: 0.config/kubeconfig.oidc.yaml
    aliases: [k-oidc, k-o]
    cmds:
      - kubectl {{ .CLI_ARGS }}
  docs:run:
    desc: "Run the current doc (Fumadocs) dev server"
    dir: 0.docs
    cmds:
      - npm run dev
  docs:legacy:run:
    desc: "Run the archived VitePress doc (saisons 1 & 2) from its git tag, in a throwaway worktree"
    cmds:
      - .github/scripts/build-legacy-docs.sh --worktree-only
      - yarn --cwd .legacy-docs install
      - yarn --cwd .legacy-docs run docs:dev
  docs:pages:
    desc: "Build both docs and assemble the GitHub Pages site into dist/ (what the CI does)"
    cmds:
      - yarn --cwd 0.docs install
      - yarn --cwd 0.docs build
      - .github/scripts/build-legacy-docs.sh
      - .github/scripts/assemble-pages.sh
  docs:pages:preview:
    desc: "Serve the assembled Pages site on http://localhost:8080/weebo-si/ (both docs, real base path)"
    deps: [docs:pages]
    cmds:
      # Les deux sites referencent /weebo-si/... en absolu: on recree ce prefixe
      # avec un lien symbolique plutot que de servir dist/ a la racine.
      - rm -rf .tmp/pages-preview
      - mkdir -p .tmp/pages-preview
      - ln -s "$(pwd)/dist" .tmp/pages-preview/weebo-si
      - python3 -m http.server 8080 --directory .tmp/pages-preview
  talosctl:
    env:
      TALOSCONFIG: "0.config/talosconfig2.yaml"
    aliases: [t]
    cmds:
      - talosctl {{ .CLI_ARGS }}
  k9s:
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    cmds:
      - k9s
  lfk:
    env:
      KUBECONFIG: 0.config/kubeconfig.oidc.yaml
    cmds:
      - lfk {{ .CLI_ARGS }}
  cilium:
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    aliases: [c]
    cmds:
      - cilium {{ .CLI_ARGS }}
  # Only the cluster endpoint and CA are stamped in; the OIDC issuer and client
  # id are static in the template. Until 2026-09-05 this also read a client id
  # from a zitadel/cluster-auth Secret and wrote it over args[3] -- dead since
  # the move to dex, where weebo-kube is a staticClient and the template already
  # carries the right value, so the lookup only made the task fail.
  create-kubeconfig-oidc:
    vars:
      server_url:
        sh: cat 0.config/kubeconfig.yaml | yq .clusters[0].cluster.server
      server_ca:
        sh: cat 0.config/kubeconfig.yaml | yq .clusters[0].cluster."certificate-authority-data"
    cmds:
      - cp 0.config/kubeconfig.oidc-template.yaml 0.config/kubeconfig.oidc.yaml
      - yq e -i '.clusters[0].cluster.server = "{{ .server_url }}"' 0.config/kubeconfig.oidc.yaml
      - yq e -i '.clusters[0].cluster."certificate-authority-data" = "{{ .server_ca }}"' 0.config/kubeconfig.oidc.yaml
  secscan:
    desc: "Run security scan"
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    cmds:
      - kubescape scan --format html --output kubescape.html
      - popeye -A --save --out html --output-file popeye.html
