version: "3"

tasks:
  forward:
    desc: "Forward the port to access to Vault UI"
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    cmds:
      - kubectl port-forward svc/openbao -n vault 8200:8200
  pwd:
    desc: "Get the initial root token for Vault"
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    cmds:
      - kubectl -n vault get secret openbao-unseal-keys -o jsonpath="{.data.vault-root}" | base64 -d && echo
  get-ca:
    desc: "Get the CA certificate for Vault"
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    cmds:
      - kubectl -n vault get secret openbao-tls -o jsonpath="{.data.ca\.crt}" | base64 -d > .tmp/vault-ca.crt
  default:
    desc: "Login to Vault CLI"
    env:
      VAULT_ADDR: "https://vault.weebo.poc" #"https://localhost:8200"
      #VAULT_CACERT: ".tmp/vault-ca.crt"
    vars:
      VAULT_TOKEN:
        sh: task vault:pwd
    cmds:
      - VAULT_TOKEN={{.VAULT_TOKEN}} vault {{ .CLI_ARGS }}
  dex:
    desc: "Create entry in vault for DEX"
    vars:
      TOKEN: "{{ .TOKEN }}"
    cmds:
      - task vault -- kv put -tls-skip-verify -mount=mv dex/config LAB_CLIENT_SECRET={{ .TOKEN }}
  vpn:
    desc: "Create entry in vault for VPN terraform provider"
    vars:
      TOKEN: "{{ .TOKEN }}"
    cmds:
      - task vault -- kv put -tls-skip-verify -mount=mv netbird/vpn-exit-node KUBERNETES_SETUP_KEY={{ .TOKEN }}
  ntfy:
    desc: "Type in the ntfy topic URL (and optional access token) the ClickStack alerts go to; stored in Vault at mv/monitoring/ntfy"
    # Prompted without echo and handed to `kv put` on stdin as JSON: the URL
    # (which names the topic, a secret of its own) never reaches the shell
    # history, the process list or this repo. Then refreshes the
    # ExternalSecret and syncs `monitoring`, whose PostSync Job
    # (files/clickstack-dashboards.py) writes the webhooks and alerts.
    interactive: true
    env:
      KUBECONFIG: 0.config/kubeconfig.yaml
    cmds:
      - |
        set -eu
        printf 'ntfy topic URL (https://ntfy.example/topic): '; read -rs url; echo
        printf 'ntfy access token (empty: none): '; read -rs token; echo
        case "$url" in http://*/?*|https://*/?*) ;; *) echo "not a topic URL" >&2; exit 1;; esac
        URL="$url" TOKEN="$token" python3 -I -c 'import json, os; d = {"URL": os.environ["URL"]}; t = os.environ["TOKEN"]; d.update({"TOKEN": t} if t else {}); print(json.dumps(d))' \
          | task vault -- kv put -tls-skip-verify -mount=mv monitoring/ntfy - >/dev/null
        echo "stored in mv/monitoring/ntfy"
        kubectl -n monitoring annotate externalsecret clickstack-ntfy force-sync="$(date +%s)" --overwrite
        # A manual sync carries none of the app's syncOptions: without
        # ServerSideApply the dashboards ConfigMap overflows the
        # last-applied annotation and the sync fails before its Jobs.
        kubectl -n argocd patch application monitoring --type merge -p '{"operation":{"initiatedBy":{"username":"task-vault-ntfy"},"sync":{"syncOptions":["ServerSideApply=true","CreateNamespace=true"]}}}' >/dev/null
        echo "monitoring sync started: the clickstack-dashboards Job provisions the alerts (kubectl -n monitoring logs job/clickstack-dashboards)"

  ca-bundle:
    desc: "Write the Weebo PKI (root + intermediate CA) to .tmp/weebo-si-ca.pem"
    # Read from Vault rather than from a Kubernetes secret or a committed file:
    # this is the PKI of whichever cluster the current context points at, so a
    # reprovisioned one produces its own bundle here and nothing stale survives.
    #
    # Two readers: `trust-intermediate` below installs it in this host's trust
    # store, and 1.pulu-init reads it to hand the nodes TLS trust for the
    # registry. Neither the file nor its content belongs in git.
    vars:
      CA_BUNDLE: .tmp/weebo-si-ca.pem
    cmds:
      # pki/certs & pki_int/certs list the *issued* (leaf) certs, not the CAs:
      # the CA certs live under <mount>/cert/ca.
      - mkdir -p .tmp
      - rm -f {{ .CA_BUNDLE }}
      # vault -field=... prints without a trailing newline, hence the echo between certs
      - task vault -- read -tls-skip-verify -field=certificate pki/cert/ca >> {{ .CA_BUNDLE }}
      - echo >> {{ .CA_BUNDLE }}
      - task vault -- read -tls-skip-verify -field=certificate pki_int/cert/ca >> {{ .CA_BUNDLE }}
      - echo >> {{ .CA_BUNDLE }}
      - openssl crl2pkcs7 -nocrl -certfile {{ .CA_BUNDLE }} | openssl pkcs7 -print_certs -noout

  trust-intermediate:
    desc: "Trust the Weebo PKI (root + intermediate CA) on this host"
    vars:
      CA_BUNDLE: .tmp/weebo-si-ca.pem
    deps: [ca-bundle]
    cmds:
      # drop the previous anchor, it only held leaf certificates
      - sudo rm -f /etc/pki/ca-trust/source/anchors/weebo-si-int-ca.pem /etc/pki/ca-trust/source/anchors/weebo-si-int-ca.crt
      - sudo cp {{ .CA_BUNDLE }} /etc/pki/ca-trust/source/anchors/weebo-si-ca.pem
      - sudo update-ca-trust
