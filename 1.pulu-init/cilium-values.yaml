ipam:
  mode: kubernetes
kubeProxyReplacement: true
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
k8sServicePort: 6443
# The agent, the operator and cilium-envoy all run on the host network, and
# this node has no host firewall: a metrics port on 0.0.0.0 is a metrics port
# on the internet (9963/9964/9965 all answered from outside, 2026-10-25). The
# chart hardcodes ":<port>" for these listeners, so the address is moved with a
# flag instead -- Cilium binds every option to viper with BindPFlag and reads
# the ConfigMap as viper's config layer, which an explicit flag outranks.
# otel-controlplane (2.argo/helm/monitoring), itself on the host network, then
# scrapes both on loopback.
extraArgs:
  - --hubble-metrics-server=127.0.0.1:9965
operator:
  replicas: 1
  extraArgs:
    - --operator-prometheus-serve-addr=127.0.0.1:9963
# cilium-envoy proxies nothing here (no L7 policy, no Cilium Ingress or Gateway
# API: its ingress/egress clusters had served 0 requests in 46 days), so its
# metrics only described itself -- while 9964 was being probed from outside.
# Turn back on, behind a firewall, if L7 policies arrive.
envoy:
  prometheus:
    enabled: false
rollOutCiliumPods: true
k8s:
  requireIPv4PodCIDR: true
  requireIPv6PodCIDR: true
ipv4:
  enabled: true
ipv6:
  enabled: true
commonLabels:
  pod-security.kubernetes.io/enforce: privileged
# Hubble already runs (main.go enables it with the UI); this only turns on its
# Prometheus exporter, which is the one place in the cluster that can answer
# "this traffic was dropped, and here is why". OBI's spans stop at the protocol
# layer: a policy denial, a refused connection or a failed DNS lookup never
# completes an exchange, so it produces no span at all.
#
# Feeds the Hubble half of the "Network drops" dashboard
# (2.argo/helm/monitoring/dashboards/network.json), scraped on 127.0.0.1:9965
# by otel-controlplane (see extraArgs above). The label names below are
# what its queries read: sourceContext/destinationContext become `source` and
# `destination`, labelsContext adds `source_namespace`/`destination_namespace`.
hubble:
  metrics:
    enabled:
      - "drop:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace"
      - "policy:sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity;labelsContext=source_namespace,destination_namespace"
      # `query` puts the queried name on the metric, which is the whole point
      # here -- without it a failed lookup is a count with no subject. It is
      # also the cardinality risk on this list; drop the option if the DNS
      # series count ever gets out of hand.
      - "dns:query;ignoreAAAA;labelsContext=source_namespace"
